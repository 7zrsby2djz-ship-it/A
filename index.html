<title>按鈕與積木</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
/* Layout: one-handed phone app — content column, fixed bottom tab bar, full-screen practice overlay, bottom sheets.
   English = cobalt "button" world; Japanese = deep teal "block" world; block roles each keep one color everywhere. */
:root{
  --bg:#EEF1F6; --surface:#FFFFFF; --surface2:#F6F8FB; --ink:#18202F; --muted:#5B6479; --line:#D8DDE8;
  --en:#2F55E4; --en-soft:#E3E9FF; --en-ink:#1D3BB0; --en-hero:#2F55E4;
  --jp:#0B7F6A; --jp-soft:#D9F1EB; --jp-ink:#075D4E; --jp-hero:#0B7F6A;
  --ok:#1B8F4E; --ok-soft:#DDF3E6; --bad:#CC3B3B; --bad-soft:#FBE3E3; --warn:#B7790E; --warn-soft:#FBF0D8;
  --r-purpose:#9A5B00; --r-purpose-bg:#FFEBC9;
  --r-place:#08756E; --r-place-bg:#D5F1EE;
  --r-thing:#5A3CC4; --r-thing-bg:#E8E1FF;
  --r-num:#1467B8; --r-num-bg:#DAEBFF;
  --r-way:#B03570; --r-way-bg:#FCE0EE;
  --r-qual:#4F7A0B; --r-qual-bg:#E6F3CF;
  --r-pt:#56607A; --r-pt-bg:#E6E9F1;
  --r-end:#18202F; --r-end-bg:#D9DEEA;
  --r-reply:#8A4B12; --r-reply-bg:#F6E4D3;
  --shadow:0 1px 2px rgba(24,32,47,.06),0 4px 14px rgba(24,32,47,.06);
  --f-body:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  --f-en:"Atkinson Hyperlegible",-apple-system,"Helvetica Neue",Arial,sans-serif;
  --f-jp:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;
  --f-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --tab-h:66px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10141C; --surface:#1A202C; --surface2:#151A24; --ink:#E8ECF4; --muted:#9AA3B8; --line:#2A3242;
  --en:#7C98FF; --en-soft:#222C4E; --en-ink:#AFC0FF; --en-hero:#2C47B5;
  --jp:#3CC9A7; --jp-soft:#133A33; --jp-ink:#8EE6CF; --jp-hero:#0C6655;
  --ok:#4CC984; --ok-soft:#163726; --bad:#FF7B7B; --bad-soft:#3E1C1F; --warn:#F0B84A; --warn-soft:#3A2E14;
  --r-purpose:#FFC56B; --r-purpose-bg:#3B2C12; --r-place:#6BDDD2; --r-place-bg:#10332F; --r-thing:#B9A5FF; --r-thing-bg:#2A2150;
  --r-num:#8CC4FF; --r-num-bg:#15304D; --r-way:#FF9CC9; --r-way-bg:#40172B; --r-qual:#B5E36B; --r-qual-bg:#253312;
  --r-pt:#B7BFD3; --r-pt-bg:#2A3140; --r-end:#E8ECF4; --r-end-bg:#343D50; --r-reply:#F2B77E; --r-reply-bg:#3D2814;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10141C; --surface:#1A202C; --surface2:#151A24; --ink:#E8ECF4; --muted:#9AA3B8; --line:#2A3242;
  --en:#7C98FF; --en-soft:#222C4E; --en-ink:#AFC0FF; --en-hero:#2C47B5;
  --jp:#3CC9A7; --jp-soft:#133A33; --jp-ink:#8EE6CF; --jp-hero:#0C6655;
  --ok:#4CC984; --ok-soft:#163726; --bad:#FF7B7B; --bad-soft:#3E1C1F; --warn:#F0B84A; --warn-soft:#3A2E14;
  --r-purpose:#FFC56B; --r-purpose-bg:#3B2C12; --r-place:#6BDDD2; --r-place-bg:#10332F; --r-thing:#B9A5FF; --r-thing-bg:#2A2150;
  --r-num:#8CC4FF; --r-num-bg:#15304D; --r-way:#FF9CC9; --r-way-bg:#40172B; --r-qual:#B5E36B; --r-qual-bg:#253312;
  --r-pt:#B7BFD3; --r-pt-bg:#2A3140; --r-end:#E8ECF4; --r-end-bg:#343D50; --r-reply:#F2B77E; --r-reply-bg:#3D2814;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark}

[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
button:focus-visible,[tabindex]:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--en);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.25}
p{margin:0}
.en{font-family:var(--f-en)}
.jpf{font-family:var(--f-jp)}
.muted{color:var(--muted)}
.small{font-size:13px}
.tnum{font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
.app{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:12px calc(var(--tab-h) + 28px + env(safe-area-inset-bottom,0px))}
.topbar{display:flex;align-items:center;gap:12px;padding-block:6px 14px}
.topbar h1{font-size:20px;font-weight:800;letter-spacing:.02em}
.topbar .grow{flex:1;min-width:0}
.lv{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.xpbar{height:6px;border-radius:6px;background:var(--line);overflow:hidden;width:96px}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--en),var(--jp));border-radius:6px}
.streak{display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--muted);line-height:1.1}
.streak b{font-size:20px;color:var(--ink);font-family:var(--f-en)}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--tab-h);align-items:center}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);height:100%;justify-content:center}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--ink);font-weight:700}
.tab[aria-current="page"] svg{color:var(--en)}
.tab.jp[aria-current="page"] svg{color:var(--jp)}
.tab.look .dot{width:52px;height:52px;border-radius:18px;background:var(--ink);color:var(--bg);display:grid;place-items:center;margin-top:-18px;box-shadow:var(--shadow)}
.tab.look .dot svg{color:var(--bg)!important}

/* ---------- common blocks ---------- */
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:10px}
.row.wrap{flex-wrap:wrap}
.card{background:var(--surface);border-radius:20px;padding:18px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none;border:1px solid var(--line)}
.sec-title{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.06em;margin-block:6px 2px}
.hero-en{background:var(--en-hero);color:#fff}
.hero-jp{background:var(--jp-hero);color:#fff}
.hero-en .muted,.hero-jp .muted{color:rgba(255,255,255,.82)}
.big{font-size:34px;font-weight:800;font-family:var(--f-en);line-height:1}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 18px;border-radius:16px;font-weight:700;font-size:17px;background:var(--surface2);border:1px solid var(--line);transition:transform .08s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:transparent}
.btn.en-b{background:var(--en-hero);color:#fff;border-color:transparent}
.btn.jp-b{background:var(--jp-hero);color:#fff;border-color:transparent}
.btn.onhero{background:#fff;color:var(--en-hero);border:0}
.hero-jp .btn.onhero{color:var(--jp-hero)}
.overlay .btn.primary{background:var(--en-hero);color:#fff}
.overlay.jpmode .btn.primary{background:var(--jp-hero);color:#fff}
.btn svg{width:22px;height:22px;flex:none}
.lvdots{display:flex;gap:5px;margin-top:6px}
.lvdots i{width:16px;height:8px;border-radius:4px;background:var(--line)}
.lvdots i.pass{background:var(--jp)}
.lvdots i.cur{background:transparent;box-shadow:inset 0 0 0 2px var(--jp)}
.lvp{background:var(--jp-soft);color:var(--jp-ink)}
.repair{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rep{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:10px 12px;border-radius:14px;background:var(--surface);border:1px solid var(--line);text-align:left;min-height:58px;min-width:0}
.rep .jpf{font-weight:700;font-size:15px;line-height:1.3}
.rep:active{transform:scale(.98)}
.opt .jline{display:flex}
.li.keych{background:var(--warn-soft)}
.btn.ghost{background:transparent}
.btn.sm{min-height:40px;font-size:15px;border-radius:12px;padding:0 14px}
.btn.block{width:100%}
.btn[disabled]{opacity:.45}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.seg button{min-height:40px;border-radius:10px;font-weight:700;font-size:15px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pill{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.st-new{background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.st-short{background:var(--warn-soft);color:var(--warn)}
.st-fam{background:var(--en-soft);color:var(--en-ink)}
.st-mast{background:var(--ok-soft);color:var(--ok)}
.st-conf{background:var(--bad-soft);color:var(--bad)}
.meter{height:10px;border-radius:10px;background:rgba(255,255,255,.25);overflow:hidden}
.meter i{display:block;height:100%;background:#fff;border-radius:10px;transition:width .6s}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.kpi{background:var(--surface);border-radius:16px;padding:14px;box-shadow:var(--shadow);min-width:0}
.kpi b{display:block;font-size:24px;font-family:var(--f-en)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:74px}
.week div{display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;font-size:11px;color:var(--muted)}
.week i{display:block;width:100%;max-width:26px;border-radius:6px 6px 3px 3px;background:var(--en);min-height:3px}
.week i.jpbar{background:var(--jp)}
.list{display:flex;flex-direction:column;background:var(--surface);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.li{display:flex;align-items:center;gap:12px;padding:12px 16px;min-height:58px;text-align:left;width:100%;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .w{font-family:var(--f-en);font-weight:700;font-size:18px}
.li .grow{flex:1;min-width:0}
.li .zh{color:var(--muted);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{padding:28px 18px;text-align:center;color:var(--muted)}
.icon-btn{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none}
.icon-btn svg{width:22px;height:22px}
.speak{background:var(--surface2);border:1px solid var(--line)}
.fakebtn{display:inline-flex;align-items:center;min-height:34px;padding:0 14px;border-radius:9px;font-family:var(--f-en);font-weight:700;font-size:15px;border:1px solid var(--line);background:var(--surface)}
.fakebtn.main{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.fakebtn.ring{box-shadow:0 0 0 3px var(--en)}

/* ---------- mock interface ---------- */
.mock{border:1px solid var(--line);border-radius:16px;background:var(--surface2);overflow:hidden}
.mock .bar{display:flex;gap:5px;padding:8px 12px;border-bottom:1px solid var(--line)}
.mock .bar i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.mock .body{padding:16px;display:flex;flex-direction:column;gap:14px}
.mock .msg{font-family:var(--f-en);font-size:19px;line-height:1.4}
.mock mark{background:var(--en-soft);color:var(--en-ink);padding:0 4px;border-radius:5px;font-weight:700}
.mock .btns{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}

/* ---------- Japanese blocks ---------- */
.blk{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:0;padding:7px 12px 8px;border-radius:12px;min-height:56px;background:var(--rb);color:var(--rc);font-family:var(--f-jp);font-weight:700;font-size:21px;line-height:1.15;border:2px solid transparent;position:relative}
.blk .ro{font-family:var(--f-en);font-weight:400;font-size:12px;opacity:.85;line-height:1.1;margin-bottom:2px}
.blk .rl{font-family:var(--f-body);font-size:10px;font-weight:700;opacity:.8;line-height:1;margin-top:3px}
.noro .blk .ro{display:none}
.noro .blk.peek .ro{display:block}
.blk.pt{min-width:44px}
.blk.bad{border-color:var(--bad);animation:shake .35s}
.blk.good{border-color:var(--ok)}
.blk.slot{border:2px dashed currentColor;background:transparent}
.role-purpose{--rb:var(--r-purpose-bg);--rc:var(--r-purpose)}
.role-place{--rb:var(--r-place-bg);--rc:var(--r-place)}
.role-thing{--rb:var(--r-thing-bg);--rc:var(--r-thing)}
.role-num{--rb:var(--r-num-bg);--rc:var(--r-num)}
.role-way{--rb:var(--r-way-bg);--rc:var(--r-way)}
.role-qual{--rb:var(--r-qual-bg);--rc:var(--r-qual)}
.role-pt{--rb:var(--r-pt-bg);--rc:var(--r-pt)}
.role-end{--rb:var(--r-end-bg);--rc:var(--r-end)}
.role-reply{--rb:var(--r-reply-bg);--rc:var(--r-reply)}
.sent{display:flex;flex-wrap:wrap;gap:6px;align-items:flex-end}
.jline{display:flex;flex-direction:column;gap:1px}
.jline .ro{font-family:var(--f-en);font-size:13px;color:var(--muted);line-height:1.2}
.jline .jp{font-family:var(--f-jp);font-size:21px;font-weight:700;line-height:1.35}
.noro .jline .ro{display:none}
.noro .jline.peek .ro{display:block}
.bubble{background:var(--surface);border-radius:4px 18px 18px 18px;padding:12px 14px;box-shadow:var(--shadow);display:flex;gap:10px;align-items:flex-start}
.bubble .grow{flex:1;min-width:0}
.who{font-size:12px;font-weight:700;color:var(--jp-ink)}
.answer-zone{min-height:78px;border:2px dashed var(--line);border-radius:16px;padding:10px;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start;background:var(--surface)}
.answer-zone:empty::before{content:'點下面的積木，依序放進來';color:var(--muted);font-size:14px;align-self:center;margin:auto}
.tray{display:flex;flex-wrap:wrap;gap:8px}
.tray .blk.used{opacity:.18;pointer-events:none}
.legend{display:flex;flex-wrap:wrap;gap:6px}
.legend span{font-size:12px;font-weight:700;padding:3px 8px;border-radius:8px;background:var(--rb);color:var(--rc)}
.parts{display:flex;flex-direction:column;gap:8px}
.part{display:flex;gap:10px;align-items:flex-start}
.part .blk{flex:none}
.part p{font-size:14px;padding-top:4px}

/* ---------- session overlay ---------- */
.overlay{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.ov-head{display:flex;align-items:center;gap:12px;padding:8px 16px;max-width:560px;width:100%;margin:0 auto}
.prog{flex:1;height:10px;border-radius:10px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;border-radius:10px;background:var(--en);transition:width .3s}
.overlay.jpmode .prog i{background:var(--jp)}
.ov-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.ov-body .in{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:8px 24px;display:flex;flex-direction:column;gap:16px}
.ov-foot{padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--surface)}
.ov-foot .in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.q{font-size:20px;font-weight:800}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:12px;min-height:60px;padding:10px 16px;border-radius:16px;background:var(--surface);border:2px solid var(--line);text-align:left;font-size:17px;width:100%}
.opt .en{font-weight:700;font-size:19px}
.opt .sub{display:block;font-size:13px;color:var(--muted);font-weight:400}
.opt.correct{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt[disabled]{cursor:default}
.fb{border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:8px;animation:up .25s ease-out}
.fb.ok{background:var(--ok-soft)}
.fb.no{background:var(--bad-soft)}
.fb h3{font-size:18px}
.fb.ok h3{color:var(--ok)}
.fb.no h3{color:var(--bad)}
.rule{border-left:3px solid var(--en);padding-left:10px;font-size:15px}
.jpmode .rule,.rule.j{border-left-color:var(--jp)}
.teach-word{display:flex;align-items:center;gap:12px}
.teach-word .fakebtn{font-size:26px;min-height:56px;padding:0 22px;border-radius:14px}
.cmp{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;align-items:baseline;font-size:15px}
.cmp .en{font-weight:700}
.cmp .me{color:var(--en-ink)}
.done-hero{text-align:center;padding:24px 0 8px;display:flex;flex-direction:column;align-items:center;gap:10px}

/* ---------- sheet ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,14,22,.45);z-index:50;animation:fade .2s}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;max-height:88%;overflow-y:auto;background:var(--bg);border-radius:22px 22px 0 0;padding:10px 16px calc(20px + env(safe-area-inset-bottom,0px));animation:up .25s ease-out}
.sheet .in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.grab{width:40px;height:5px;border-radius:5px;background:var(--line);margin:0 auto 4px}
textarea,input[type=text]{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
textarea{min-height:120px;resize:vertical;font-family:var(--f-en)}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:14px;font-weight:700;font-size:15px;box-shadow:var(--shadow);animation:drop .25s ease-out;max-width:calc(100% - 32px)}
.switch{position:relative;width:52px;height:32px;border-radius:16px;background:var(--line);flex:none;transition:background .2s}
.switch::after{content:'';position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.switch[aria-checked="true"]{background:var(--jp)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}
.set-row{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);min-height:60px}
.set-row:last-child{border-bottom:0}
.set-row .grow{flex:1;min-width:0}
.paste-src{font-family:var(--f-mono);font-size:13px;background:var(--surface2);border-radius:12px;padding:10px;white-space:pre-wrap;word-break:break-word;max-height:120px;overflow:auto}
.found{display:flex;flex-direction:column;gap:8px}
.found .it{display:flex;gap:10px;align-items:center;background:var(--surface);border-radius:14px;padding:10px 12px;box-shadow:var(--shadow)}
.found .it .grow{flex:1;min-width:0}
.found .w{font-family:var(--f-en);font-weight:700;font-size:17px}
.ai-box{background:var(--en-soft);color:var(--ink);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:6px}
.tower{display:flex;flex-direction:column-reverse;align-items:center;gap:2px;width:38px}
.tower i{display:block;width:26px;height:9px;border-radius:3px}
.tower svg{animation:bob 3s ease-in-out infinite}
.hint-bar{display:flex;gap:10px;align-items:center;background:var(--warn-soft);color:var(--ink);border-radius:14px;padding:10px 12px;font-size:14px}
@keyframes up{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
@keyframes drop{from{transform:translate(-50%,-10px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
@keyframes fade{from{opacity:0}}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.pop{animation:pop .45s ease-out}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

}

function patTask(pid) {
  const p = PAT_MAP[pid], seq = [], args = [];
  p.parts.forEach(part => { if (typeof part === 'string') seq.push(part); else { const b = pick(part.opt); seq.push(b); args.push(B[b][2]); } });

function diagnose(user, ansList) {
  let exp = ansList[0], best = -1;
  ansList.forEach(a => { let k = 0; while (k < a.length && a[k] === user[k]) k++; if (k > best) { best = k; exp = a; } });
  const rn = id => ROLES[B[id][3]].n;
  if (user.length === exp.length && [...user].sort().join() === [...exp].sort().join())
    return {i:best, kind:'order', msg:`積木都選對了，只是順序不對。這句的順序是：${exp.map(x => '〔' + rn(x) + '〕').join(' → ')}。句尾（動作）永遠放最後。`};
  for (let i = 0; i < Math.max(user.length, exp.length); i++) {
    const u = user[i], e = exp[i];
    if (u === e) continue;
    if (u === undefined) return {i, kind:'missing', msg:`還少了一塊〔${rn(e)}〕。`};
    if (e === undefined) return {i, kind:'extra', msg:`多放了「${B[u][0]}」，這句不需要它。`};
    const ru = B[u][3], re = B[e][3];
    if (ru === 'pt' && re === 'pt') return {i, kind:'pt', u, e, msg:`助詞選錯了。你放了「${B[u][0]}」：${PT_RULE[u]}<br>這裡要「${B[e][0]}」：${PT_RULE[e]}`};
    if (ru === re) return {i, kind:'content', u, e, msg:`〔${ROLES[re].n}〕的位置對了，但題目要的是「${B[e][2]}」，你放的是「${B[u][2]}」。`};
    return {i, kind:'role', u, e, msg:`這個位置該放〔${ROLES[re].n}〕積木，你放的是〔${ROLES[ru].n}〕積木「${B[u][0]}」（${B[u][2]}）。`};
  }

}

let IDX = new Map();
const normKey = k => k.toLowerCase().replace(/[’‘]/g, "'").replace(/[^a-z' \-]/g, ' ').replace(/\s+/g, ' ').trim();
function buildIndex() {
  IDX = new Map();
  const add = (k, id) => { k = normKey(k); if (k && !IDX.has(k)) IDX.set(k, id); };
  allEnIds().forEach(id => { const it = getEn(id); add(it.w, id); (it.al || []).forEach(a => add(a, id)); });
}
function lookupWord(t) {
  const c = [t];
  if (t.endsWith("'s")) c.push(t.slice(0, -2));
  if (t.endsWith('ies')) c.push(t.slice(0, -3) + 'y');
  if (t.endsWith('es')) c.push(t.slice(0, -2));
  if (t.endsWith('s')) c.push(t.slice(0, -1));
  if (t.endsWith('ed')) { c.push(t.slice(0, -2)); c.push(t.slice(0, -1)); }
  if (t.endsWith('ing')) { c.push(t.slice(0, -3)); c.push(t.slice(0, -3) + 'e'); }
  for (const x of c) { const id = IDX.get(x); if (id) return id; }
  return null;
}
function analyze(text) {
  const toks = (text.replace(/[’‘]/g, "'").match(/[A-Za-z][A-Za-z'\-]*/g) || []).map(t => t.replace(/^['-]+|['-]+$/g, ''));
  const low = toks.map(t => t.toLowerCase());
  const found = [], unknown = [], skipped = new Set();
  let i = 0;
  while (i < low.length) {
    let hit = null, n = 0;
    for (let k = Math.min(4, low.length - i); k >= 2; k--) { const id = IDX.get(low.slice(i, i + k).join(' ')); if (id) { hit = id; n = k; break; } }
    if (!hit) { hit = lookupWord(low[i]); n = 1; }
    if (hit) { if (!found.includes(hit)) found.push(hit); }
    else { const t = low[i]; if (isBasic(t) || t.length < 3 || t.length > 24) skipped.add(t); else if (!unknown.includes(t)) unknown.push(t); }
    i += n;
  }
  return {found, unknown, skipped:[...skipped]};
}
function isBasic(t) {
  if (STOP.has(t) || NAMES.has(t)) return true;
  const c = [t.replace(/'s$/, ''), t.replace(/s$/, ''), t.replace(/es$/, ''), t.replace(/ed$/, ''), t.replace(/d$/, ''), t.replace(/ing$/, ''), t.replace(/ing$/, 'e'), t.replace(/n't$/, '')];
  return c.some(x => STOP.has(x) || NAMES.has(x));
}

  const parts = text.split(/(?<=[.!?\n])\s*/);

}

function startEn(extra = 0) {
  const due = enDue().slice(0, 14);
  let news = newCandidates(extra);
  if (!due.length && !news.length) news = newCandidates(3);
  if (!due.length && !news.length) { toast('字庫裡的字都學過了！'); return; }
  const rev = shuffle(due).map(id => ({t:'q', id}));
  const cards = [];
  let ri = 0;
  news.forEach((id, k) => { cards.push({t:'teach', id}, {t:'q', id, isNew:true}); for (let j = 0; j < 2 && ri < rev.length; j++) cards.push(rev[ri++]); });
  while (ri < rev.length) cards.push(rev[ri++]);
  startSession('en', cards, '英文');
}
function startGroupPractice(gid) {
  const g = GROUPS[gid];
  const cards = shuffle(g.sc).map(([t, a]) => ({t:'q', id:a, q:{mode:'sc', id:a, g:gid, text:t, opts:shuffle([a, ...shuffle(g.ids.filter(x => x !== a && !(SYN[a] || []).includes(x))).slice(0, 3)])}}));
  closeSheet(); startSession('en', cards, g.t);
}
function learnedIds() { return allEnIds().filter(id => S.en[id] && !S.en[id].known); }
function startReview() {
  const rank = {conf:0, short:1, fam:2, mast:3};
  const pool = learnedIds().sort((a, b) => (rank[status(S.en[a])] - rank[status(S.en[b])]) || ((S.en[a].last || 0) - (S.en[b].last || 0)));
  if (!pool.length) { toast('還沒有學過的字，先做一次英文練習'); return; }
  const pick15 = shuffle(pool.slice(0, 15));
  const modes = ['mean', 'sc', 'zh2en'];
  const cards = pick15.map((id, i) => ({t:'q', id, q:makeEnQ(id, modes[i % 3])}));
  startSession('en', cards, '複習學過的字', {review:true, missed:[]});
}
function startJp() {
  const due = shuffle(jpDue()).slice(0, 6);
  const cards = due.map(p => ({t:'build', task:patTask(p.id)}));
  if (cards.length < 4) {
    const nxt = PAT.find(p => !S.jp[p.id]);
    if (nxt) cards.push({t:'pteach', pid:nxt.id}, {t:'build', task:patTask(nxt.id)}, {t:'build', task:patTask(nxt.id)});
  }
  if (!cards.length) { const known = PAT.filter(p => S.jp[p.id]); shuffle(known).slice(0, 5).forEach(p => cards.push({t:'build', task:patTask(p.id)})); }
  startSession('jp', cards, '日文');
}

/* ---- answering ---- */
function answerEn(idx) {
  const c = curCard(); if (!c || SES.res) return;
  const q = c.q, chosen = q.opts[idx], ok = chosen === q.id;
  SES.res = {chosen:idx, ok};
  const firstTime = !SES.graded.has(q.id);
  const r = recOf('en', q.id, true);
  if (firstTime && SES.review && ok && r.due > Date.now()) { SES.graded.add(q.id); r.ok++; r.last = Date.now(); }
  else if (firstTime) { SES.graded.add(q.id); grade(r, ok); if (c.isNew) { S.newDay.n = newToday() + 1; L().nw++; SES.stats.nw++; S.boost = S.boost.filter(x => x !== q.id); } }
  if (!ok && SES.review && firstTime) SES.missed.push(q.id);
  if (!ok) { r.conf[chosen] = (r.conf[chosen] || 0) + 1; addAgain(q.id);
    if (!SES.requeued.has(q.id)) { SES.requeued.add(q.id); SES.cards.splice(Math.min(SES.i + 3, SES.cards.length), 0, {t:'q', id:q.id}); } }
  SES.stats.n++; if (ok) SES.stats.ok++;
  const lg = L(); lg.en++; if (ok) lg.enOk++;
  touchStreak(); addXp(ok ? (firstTime ? 10 : 4) : 1);
  persist();
  renderSes();
  if (S.settings.autoSpeak) speak(getEn(q.id).w, 'en-US');
  requestAnimationFrame(() => { const fb = document.querySelector('#sesBody .fb'); fb && fb.scrollIntoView({behavior:'smooth', block:'nearest'}); });
}
function checkBuild(showAnswer) {
  const c = curCard(), t = c.task, st = SES.build;
  let seq = st.placed.map(i => t.tray[i]);
  let ok = t.ans.some(a => a.join() === seq.join());
  if (showAnswer) {
    const a = t.ans[0]; const used = new Set(); st.placed = a.map(id => { const i = t.tray.findIndex((x, k) => x === id && !used.has(k)); used.add(i); return i; });
    st.solved = true; st.shown = true; renderSes(); speakIf(sentText(a)); return;
  }
  const first = st.tries === 0; st.tries++;
  const gradeKey = (t.pid || t.pat) ? (t.pid || t.pat) : null;
  if (ok) {
    st.solved = true; st.diag = null;
    if (t.ans.length > 1 && seq.join() !== t.ans[0].join()) st.altNote = '這樣說也對！另一個常見說法：' + sentText(t.ans[0]) + '。';
    else if (t.ans.length > 1) st.altNote = '另一種說法也對：' + sentText(t.ans[1]) + '。';
  } else {
    st.diag = diagnose(seq, t.ans);
    if (st.diag.kind === 'pt') S.jpConf[st.diag.e + '>' + st.diag.u] = (S.jpConf[st.diag.e + '>' + st.diag.u] || 0) + 1;
  }
  if (first) {
    SES.stats.n++; if (ok) SES.stats.ok++;
    const lg = L(); lg.jp++; if (ok) lg.jpOk++;
    if (gradeKey && !SES.graded.has(gradeKey)) { SES.graded.add(gradeKey); const r = recOf('jp', gradeKey, true); grade(r, ok); if (!ok && st.diag) r.conf[st.diag.kind] = (r.conf[st.diag.kind] || 0) + 1; }
    touchStreak(); addXp(ok ? 12 : 2);
  } else if (ok) addXp(3);
  persist();
  renderSes();
  if (ok) speakIf(sentText(seq));
  requestAnimationFrame(() => { const fb = document.querySelector('#sesBody .fb'); fb && fb.scrollIntoView({behavior:'smooth', block:'nearest'}); });
}
function speakIf(t) { if (S.settings.autoSpeak) speak(t, 'ja-JP'); }
function nextCard() {
  const c = curCard();
  if (c && c.t === 'pteach' && !S.jp[c.pid]) { recOf('jp', c.pid, true); persist(); }
  SES.i++; SES.res = null; SES.build = null; SES.d = null;
  if (curCard() && curCard().t === 'dEnd') finalizeDlg(curCard().ctx);
  if (!curCard()) finishSession();
  renderSes(); const bd = $('#sesBody'); if (bd) bd.scrollTop = 0; autoSpeakCard();
}
function finishSession() {
  if (SES.sceneId) { const s = S.scenes[SES.sceneId] || (S.scenes[SES.sceneId] = {done:0, best:0}); s.done++; s.best = Math.max(s.best, SES.stats.ok); s.last = Date.now(); addXp(15); persist(); }
}

function markEncounter(id) {
  const r = S.en[id];
  if (!r) { if (!S.boost.includes(id)) S.boost.push(id); }
  else if (!['fam', 'mast'].includes(status(r))) { r.due = Math.min(r.due, Date.now()); r.enc = (r.enc || 0) + 1; }
  addAgain(id);
}
function addCustom(word, zh, note, text) {
  const w = word.trim(); if (!w || !zh.trim()) return false;
  const lib = lookupWord(w.toLowerCase()); if (lib) { markEncounter(lib); return true; }
  const id = 'c_' + w.toLowerCase().replace(/[^a-z0-9]+/g, '-').slice(0, 30);
  S.custom[id] = {id, w, zh:zh.trim(), note:(note || '').trim() || '你在 Claude 裡查過的字', cat:'my', f:2, exEn:text ? snippetFor(text, w) : w, exZh:'', al:[], groups:[]};
  if (!S.boost.includes(id)) S.boost.unshift(id);
  addAgain(id); buildIndex(); persist(); return true;
}

function dlgSt(sid) { return S.dlg[sid] || (S.dlg[sid] = {un:1, rec:{}, pass:{}}); }
function dlgScript(ctx) { return DLG_MAP[ctx.sid].lv[ctx.lv]; }
function mkRec() { return {s:0, due:0, ok:0, ng:0, lapse:0, conf:{}, t0:Date.now(), last:0}; }
function dlgDue() {
  const t = Date.now(), out = [];
  DLG.forEach(d => { const st = S.dlg[d.id]; if (!st) return; for (const lv in st.rec) { const r = st.rec[lv]; if (r.s < 7 && r.due <= t) out.push({sid:d.id, lv:+lv}); } });
  return out;
}
function dlgNext() {
  for (const d of DLG) { const st = dlgSt(d.id); if (!st.rec[st.un]) return {sid:d.id, lv:st.un}; }
  return null;
}
function dlgCards(sid, lv) {
  const ctx = {sid, lv, ok:0, n:0, rep:0, peek:false, miss:[], wrongK:{r1:[], r2:[]}, fuOk:null};
  return [{t:'dIntro', ctx}, {t:'dRound', ctx, r:'r1'}, {t:'dFollow', ctx}, {t:'dRound', ctx, r:'r2'}, {t:'dEnd', ctx}];
}
function startDlg() {
  const due = shuffle(dlgDue()).slice(0, 2), picks = due.slice();
  const room = due.length ? 1 : 2;
  for (const d of DLG) {
    if (picks.length >= due.length + room) break;
    const st = dlgSt(d.id);
    if (!st.rec[st.un] && !picks.some(p => p.sid === d.id && p.lv === st.un)) picks.push({sid:d.id, lv:st.un});
  }
  if (!picks.length) shuffle(DLG).slice(0, 2).forEach(d => picks.push({sid:d.id, lv:dlgSt(d.id).un}));
  startSession('jp', picks.flatMap(p => dlgCards(p.sid, p.lv)), '對話練習', {dlg:true});
}
function startDlgOne(sid, lv) { closeSheet(); startSession('jp', dlgCards(sid, lv), DLG_MAP[sid].name, {dlg:true}); }

function jl2(jp, ro, size) { return `<span class="jline"><span class="ro">${esc(ro)}</span><span class="jp" ${size ? `style="font-size:${size}px"` : ''}>${esc(jp)}</span></span>`; }
function dlgLine(c) { const sc = dlgScript(c.ctx); return sc[c.r]; }

      <div class="kpi"><span class="small muted">請對方重說</span><b class="tnum">${ctx.rep} 次</b><span class="small muted">不扣分</span></div>
    </div>
    ${tags.length ? `<p class="small">這次漏掉的：${tags.map(t => `<span class="pill st-conf" style="margin-right:4px">${TAG[t]}</span>`).join('')}</p>` : ''}
    ${ctx.unlocked ? `<div class="fb ok"><h3>第 ${ctx.unlocked} 級解鎖了</h3><p>下一級的回答會${LV_NAME[ctx.unlocked]}。</p></div>`
      : ctx.pass ? '' : `<p class="small muted">${ctx.peek ? '這次有直接看字，' : ''}這一段會很快再出現。全部第一次就聽懂、而且沒有直接看字，才算通過。</p>`}
    <section class="stack" style="gap:8px"><p class="sec-title" style="margin:0">這段的關鍵字・還不熟就加入單字卡</p><div class="list">${DLG_W[ctx.sid][ctx.lv].map(wordRow).join('')}</div></section>
    <details class="card flat"><summary style="cursor:pointer;min-height:28px;font-weight:700">整段對話</summary>
      <div class="stack" style="gap:10px;margin-top:10px">
        ${[['你', d.me], [sc.who, sc.r1], ['你', g], [sc.who, sc.r2]].map(([w, l]) => `<div><p class="who">${esc(w)}</p><div class="row" style="align-items:flex-end"><div style="flex:1;min-width:0">${jline(l.jp, l.ro)}<p class="small muted">${esc(l.zh)}</p></div>${spkBtn(l.jp, 'ja-JP')}</div></div>`).join('')}
      </div></details>`;
  return [b, `<button class="btn primary block" data-a="next">${more ? '下一段對話' : '完成'}</button>`];
}

function finalizeDlg(ctx) {
  if (ctx.done) return; ctx.done = true;
  ctx.pass = ctx.ok === ctx.n && !ctx.peek;
  const st = dlgSt(ctx.sid), rec = st.rec[ctx.lv] || mkRec();
  grade(rec, ctx.pass); if (ctx.pass && rec.s < 2) { rec.s = 2; rec.due = Date.now() + IV[2]; } st.rec[ctx.lv] = rec;
  if (ctx.pass) { st.pass[ctx.lv] = (st.pass[ctx.lv] || 0) + 1; if (ctx.lv === st.un && ctx.lv < 5) { st.un++; ctx.unlocked = st.un; } }
  addXp(ctx.pass ? 20 : 5); persist();
}
function answerDq(v) {
  const c = curCard(), L = dlgLine(c), d = SES.d, [qi, oi] = v.split(':').map(Number);
  if (!d || d.ans[qi] !== undefined) return;
  d.ans[qi] = oi; const ok = oi === 0, q = L.q[qi], ctx = c.ctx;
  ctx.n++; if (ok) ctx.ok++; else { ctx.miss.push(q.tag); S.dlgMiss[q.tag] = (S.dlgMiss[q.tag] || 0) + 1; }
  SES.stats.n++; if (ok) SES.stats.ok++;
  const lg = L_(); lg.jp++; if (ok) lg.jpOk++;
  touchStreak(); addXp(ok ? 8 : 1); persist(); renderSes();
}
function answerFu(v) {
  const c = curCard(), d = SES.d; if (!d || d.pick !== null) return;
  const fu = dlgScript(c.ctx).fu, oi = +v, ok = !!fu.o[oi].ok, ctx = c.ctx;
  d.pick = oi; ctx.n++; if (ok) ctx.ok++; else { ctx.miss.push('fu'); S.dlgMiss.fu = (S.dlgMiss.fu || 0) + 1; }
  SES.stats.n++; if (ok) SES.stats.ok++;
  const lg = L_(); lg.jp++; if (ok) lg.jpOk++;
  touchStreak(); addXp(ok ? 8 : 1); persist(); renderSes();
  if (S.settings.autoSpeak) speak(fu.o.find(o => o.ok).jp, 'ja-JP', 0.9);
  requestAnimationFrame(() => { const fb = document.querySelector('#sesBody .fb'); fb && fb.scrollIntoView({behavior:'smooth', block:'nearest'}); });
}
function L_() { return L(); }

/* ---- 日文頁：對話清單 ---- */
function dlgListHtml() {
  const miss = Object.entries(S.dlgMiss).sort((a, b) => b[1] - a[1]).slice(0, 3);
  return `<p class="muted small">你先開口，日本人用自然的日文回答。先只用聽的抓重點，再決定怎麼接。每個情境有 5 級，回答會越來越像真的日本人。</p>
    ${miss.length ? `<div class="card flat stack" style="gap:6px"><p class="sec-title" style="margin:0">你最常漏聽的</p><p>${miss.map(([t, n]) => `${TAG[t]} <span class="muted small">${n} 次</span>`).join('　')}</p></div>` : ''}
    <button class="btn jp-b block" data-a="lsOpen">${IC.speak}耳機模式：反覆聽練過的對話</button>
    <div class="list">${DLG.map(d => { const st = dlgSt(d.id);
      return `<button class="li" data-a="dlgSit" data-v="${d.id}"><div class="grow"><div style="font-weight:800">${esc(d.name)}</div><div class="zh">${esc(d.place)}</div>
        <div class="lvdots" aria-label="通過到第 ${st.un} 級">${[1, 2, 3, 4, 5].map(l => `<i class="${st.pass[l] ? 'pass' : l === st.un ? 'cur' : ''}"></i>`).join('')}</div></div>${IC.chev}</button>`; }).join('')}</div>
    <p class="small muted">接下來會加：餐廳、飯店、購物，以及數字和時間的聽力小練習。</p>`;
}
function dlgSitSheet(sid) {

  return `<h2 style="font-size:22px">${esc(d.name)}</h2><p class="muted">${esc(d.place)}・${esc(d.setup)}</p>
    <div class="list">${[1, 2, 3, 4, 5].map(l => { const lock = l > st.un, r = st.rec[l];
      return `<button class="li" data-a="dlgGo" data-v="${sid}:${l}" ${lock ? 'disabled style="opacity:.45"' : ''}><div class="grow"><div style="font-weight:800">第 ${l} 級・${LV_NAME[l]}</div>
        <div class="zh">${lock ? `先通過第 ${l - 1} 級` : st.pass[l] ? `通過 ${st.pass[l]} 次${r ? '・下次複習 ' + relDue(r.due) : ''}` : r ? '還沒通過' : '還沒練過'}</div></div>${lock ? '' : IC.chev}</button>`; }).join('')}</div>
    <button class="btn block" data-a="lsOpen" data-v="${sid}">${IC.speak}用耳機模式聽這個情境</button>
    <p class="small muted">通過＝每一題第一次就答對，而且沒有直接看字。請對方重說或說慢一點不扣分。</p>`;
}
function dlgHeroText() {
  const due = dlgDue().length, nx = dlgNext();
  return due ? `${due} 段對話要複習` : nx ? `下一段：${DLG_MAP[nx.sid].name}・第 ${nx.lv} 級` : '可以自由重練任何一級';
}

/* ================= 日文單字卡（從對話裡勾「不熟」的字） ================= */
function allDlgWords() {
  const m = new Map();
  for (const sid in DLG_W) DLG_W[sid].forEach(list => (list || []).forEach(([jp, ro, zh]) => { if (!m.has(jp)) m.set(jp, {jp, ro, zh}); }));
  return m;
}
function wordInfo(jp) { return S.jpw[jp] || allDlgWords().get(jp); }
function wordRow([jp, ro, zh]) {
  const on = !!S.jpw[jp];
  return `<div class="li" style="gap:10px"><div class="grow"><div class="jpf" style="font-weight:700;font-size:19px">${esc(jp)}</div><div class="small muted">${S.settings.romaji ? esc(ro) + '・' : ''}${esc(zh)}</div></div>
    ${spkBtn(jp.replace(/^〜/, ''), 'ja-JP')}<button class="chip" data-a="wMark" data-v="${esc(jp)}" aria-pressed="${on}" style="flex:none">${on ? '已加入' : '不熟'}</button></div>`;
}
function toggleWord(jp) {
  if (S.jpw[jp]) { delete S.jpw[jp]; toast('已從單字卡移除'); }
  else { const w = allDlgWords().get(jp); if (!w) return; S.jpw[jp] = Object.assign({jp:w.jp, ro:w.ro, zh:w.zh}, mkRec(), {due:Date.now()}); toast('已加入單字卡：' + jp); }
  persist();
}
function wordDue() { const t = Date.now(); return Object.keys(S.jpw).filter(k => S.jpw[k].s < 7 && S.jpw[k].due <= t); }
function wordWhere(jp) {
  const key = jp.replace(/^〜/, '').replace(/る$|ます$/, '');
  for (const d of DLG) for (let l = 1; l <= 5; l++) { const s = d.lv[l]; for (const r of [s.r1, s.r2]) if (r.jp.includes(key)) return r; }
  return null;
}
function startWords() {
  let ids = shuffle(wordDue()).slice(0, 12);
  if (!ids.length) ids = Object.keys(S.jpw).sort((a, b) => S.jpw[a].s - S.jpw[b].s).slice(0, 8);
  if (!ids.length) { toast('單字卡還是空的。練對話時把不熟的字按「不熟」'); return; }
  startSession('jp', ids.map(makeWq), '單字卡', {words:true});
}
function makeWq(jp) {
  const w = S.jpw[jp], pool = [...allDlgWords().values()].filter(x => x.jp !== jp && x.zh !== w.zh);
  const opts = shuffle([w.zh, ...shuffle(pool).slice(0, 3).map(x => x.zh)]);
  return {t:'wq', jp, mode:w.s >= 2 && Math.random() < 0.5 ? 'listen' : 'read', opts};
}
function sesWq(c) {
  const w = S.jpw[c.jp] || wordInfo(c.jp), res = SES.res, where = res ? wordWhere(c.jp) : null;
  const showText = c.mode === 'read' || res;
  let b = `<p class="small muted">${c.mode === 'listen' ? '只用聽的' : '看字'}・意思是？</p>
    <div class="card stack" style="align-items:center;gap:10px;padding:22px">
      ${showText ? jline(w.jp, w.ro, true) : '<p class="muted">先聽，不看字</p>'}
      ${canSpeak ? `<button class="btn jp-b" data-a="speak" data-v="${esc(w.jp.replace(/^〜/, ''))}" data-l="ja-JP">${IC.speak}再聽一次</button>` : ''}
    </div>
    <div class="opts">${c.opts.map((o, i) => `<button class="opt ${res ? (o === w.zh ? 'correct' : i === res.chosen ? 'wrong' : '') : ''}" data-a="wq" data-v="${i}" ${res ? 'disabled' : ''}>${esc(o)}</button>`).join('')}</div>`;
  if (res) b += `<div class="${res.ok ? 'fb ok' : 'fb no'}"><h3>${res.ok ? '對了' : '是「' + esc(w.zh) + '」'}</h3><p><b class="jpf">${esc(w.jp)}</b>（${esc(w.ro)}）＝${esc(w.zh)}</p>
      ${where ? `<p class="small">在對話裡是這樣出現的：</p>${jline(where.jp, where.ro)}<p class="small muted">${esc(where.zh)}</p>` : ''}</div>`;
  return [b, res ? `<button class="btn primary block" data-a="next">下一個</button>` : `<p class="small muted" style="text-align:center">選一個意思</p>`];
}
function answerWq(i) {
  const c = curCard(); if (!c || SES.res) return;
  const w = S.jpw[c.jp]; if (!w) { nextCard(); return; }
  const ok = c.opts[i] === w.zh; SES.res = {chosen:i, ok};
  if (!SES.graded.has(c.jp)) { SES.graded.add(c.jp); grade(w, ok); }
  if (!ok && !SES.requeued.has(c.jp)) { SES.requeued.add(c.jp); SES.cards.splice(Math.min(SES.i + 3, SES.cards.length), 0, makeWq(c.jp)); }
  SES.stats.n++; if (ok) SES.stats.ok++;
  const lg = L(); lg.jp++; if (ok) lg.jpOk++;
  touchStreak(); addXp(ok ? 5 : 1); persist(); renderSes();
  speak(w.jp.replace(/^〜/, ''), 'ja-JP', 0.85);
}
function wordListHtml() {
  const ids = Object.keys(S.jpw), due = wordDue().length;
  if (!ids.length) return `<div class="card flat empty">單字卡還是空的。<br>練對話時，在「先認識這幾個字」裡把不熟的按「不熟」，就會出現在這裡。</div>`;
  return `<button class="btn jp-b block" data-a="startWords">${due ? `練習單字卡（${due} 個要複習）` : '練習單字卡'}</button>
    <div class="list">${ids.map(k => { const w = S.jpw[k];
      return `<div class="li" style="gap:10px"><div class="grow"><div class="jpf" style="font-weight:700;font-size:18px">${esc(w.jp)}</div><div class="small muted">${S.settings.romaji ? esc(w.ro) + '・' : ''}${esc(w.zh)}</div></div>${pill(status(w))}${spkBtn(w.jp.replace(/^〜/, ''), 'ja-JP')}<button class="chip" data-a="wMark" data-v="${esc(w.jp)}" style="flex:none">移除</button></div>`; }).join('')}</div>
    <p class="small muted">答錯的字 10 分鐘後再出現，答對的越隔越久。熟了之後會改成「只用聽的」考你。</p>`;
}

/* ================= 耳機模式：不用操作手機，反覆聽練過的對話 ================= */
const LS = {open:false, playing:false, list:[], q:[], k:0, gen:0, zh:true, words:true, loop:true, lock:null, cur:null, sidOnly:null};
function lsPlaylist(sid) {
  const out = [];
  DLG.forEach(d => {
    if (sid && d.id !== sid) return;
    const st = dlgSt(d.id);
    for (let l = 1; l <= 5; l++) if (sid ? l <= st.un : st.rec[l]) out.push({sid:d.id, lv:l});
  });
  if (!out.length) DLG.forEach(d => out.push({sid:d.id, lv:1}));
  return out;
}
function lsBuild() {
  const q = [];
  LS.list.forEach((p, di) => {
    const d = DLG_MAP[p.sid], sc = d.lv[p.lv], rate = LV_RATE[p.lv], good = sc.fu.o.find(o => o.ok);
    const head = {d:di, title:`${d.name}・第 ${p.lv} 級`};
    q.push(Object.assign({say:`${d.name}，第 ${p.lv} 級。`, lang:'zh-TW', gap:600, show:{zh:d.setup}}, head));
    if (LS.words) DLG_W[p.sid][p.lv].forEach(([jp, ro, zh]) => {
      q.push(Object.assign({say:jp.replace(/^〜/, ''), lang:'ja-JP', rate:0.85, gap:500, show:{jp, ro, zh, who:'單字'}}, head));
      if (LS.zh) q.push(Object.assign({say:zh, lang:'zh-TW', gap:700, show:{jp, ro, zh, who:'單字'}}, head));
    });
    [['你', d.me], [sc.who, sc.r1], ['你', good], [sc.who, sc.r2]].forEach(([who, l]) => {
      const show = {jp:l.jp, ro:l.ro, zh:l.zh, who};
      q.push(Object.assign({say:l.jp, lang:'ja-JP', rate, gap:900, show}, head));
      if (LS.zh) q.push(Object.assign({say:l.zh, lang:'zh-TW', gap:700, show}, head));
      q.push(Object.assign({say:l.jp, lang:'ja-JP', rate:0.7, gap:900, show}, head));
      q.push(Object.assign({say:l.jp, lang:'ja-JP', rate, gap:1300, show}, head));
    });
    q.push(Object.assign({say:'', gap:1800, show:{zh:'（這段結束）'}}, head));
  });
  LS.q = q;
}
function lsOpen(sid) {
  closeSheet();
  LS.sidOnly = sid || null; LS.list = lsPlaylist(LS.sidOnly); lsBuild(); LS.k = 0; LS.open = true;
  let el = $('#lsv');
  if (!el) { el = document.createElement('div'); el.id = 'lsv'; el.className = 'overlay jpmode'; document.body.append(el); }
  el.hidden = false; document.body.style.overflow = 'hidden';
  lsRender();
}
function lsClose() {
  lsStop(); LS.open = false; const el = $('#lsv'); if (el) el.hidden = true; document.body.style.overflow = '';
  render();
}
async function lsWake(on) {
  try {
    if (on && !LS.lock && navigator.wakeLock) { LS.lock = await navigator.wakeLock.request('screen'); LS.lock.addEventListener?.('release', () => { LS.lock = null; }); }
    if (!on && LS.lock) { await LS.lock.release(); LS.lock = null; }
  } catch (e) { LS.lock = null; }
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && LS.playing) lsWake(true); });
function lsStop() { LS.playing = false; LS.gen++; try { speechSynthesis.cancel(); } catch (e) {} lsWake(false); }
function lsToggle() {
  if (LS.playing) { lsStop(); lsRender(); return; }
  if (!canSpeak) { toast('這台裝置不能播放聲音'); return; }
  LS.playing = true; LS.gen++; lsWake(true); lsStep(LS.gen); lsRender();
}
function lsStep(gen) {
  if (gen !== LS.gen || !LS.playing) return;
  if (LS.k >= LS.q.length) {
    if (!LS.loop) { lsStop(); LS.k = 0; lsRender(); return; }
    LS.k = 0;
  }
  const it = LS.q[LS.k], myK = LS.k; let fired = false;
  lsRender();
  const done = () => {
    if (fired) return; fired = true;
    if (gen !== LS.gen || !LS.playing || LS.k !== myK) return;
    setTimeout(() => { if (gen !== LS.gen || !LS.playing || LS.k !== myK) return; LS.k++; lsStep(gen); }, it.gap || 600);
  };
  if (!it.say) { done(); return; }
  speak(it.say, it.lang, it.rate, done);
  // fallback if the device never reports the end of speech
  setTimeout(done, 1500 + it.say.length * (it.lang.startsWith('ja') ? 260 : 330) / ((it.rate || 1) * S.settings.rate));
}
function lsSkip(dir) {
  const cur = LS.q[LS.k] ? LS.q[LS.k].d : 0, target = Math.max(0, Math.min(LS.list.length - 1, cur + dir));
  LS.k = LS.q.findIndex(x => x.d === target); if (LS.k < 0) LS.k = 0;
  if (LS.playing) { LS.gen++; try { speechSynthesis.cancel(); } catch (e) {} lsStep(LS.gen); } else lsRender();
}
function lsRebuild() {
  const cur = LS.q[LS.k] ? LS.q[LS.k].d : 0;
  lsBuild(); LS.k = Math.max(0, LS.q.findIndex(x => x.d === cur));
  if (LS.playing) { LS.gen++; try { speechSynthesis.cancel(); } catch (e) {} lsStep(LS.gen); } else lsRender();
}
function lsRender() {
  const el = $('#lsv'); if (!el || !LS.open) return;
  const it = LS.q[LS.k] || LS.q[0], s = it.show || {}, di = it.d;
  const opt = (k, label) => `<button class="chip" data-a="lsOpt" data-v="${k}" aria-pressed="${LS[k]}">${label}</button>`;
  el.innerHTML = `<div class="ov-head"><button class="icon-btn" data-a="lsClose" aria-label="關閉耳機模式">${IC.x}</button><div class="prog" aria-hidden="true"><i style="width:${(LS.k / Math.max(1, LS.q.length)) * 100}%"></i></div><span class="small muted tnum">${di + 1}/${LS.list.length} 段</span></div>
    <div class="ov-body"><div class="in">
      <div><p class="small muted">耳機模式${LS.sidOnly ? '・' + esc(DLG_MAP[LS.sidOnly].name) : '・練過的對話'}</p><h2 style="font-size:22px">${esc(it.title)}</h2></div>
      <section class="card stack" style="gap:8px;min-height:180px;justify-content:center">
        ${s.who ? `<p class="who">${esc(s.who)}</p>` : ''}
        ${s.jp ? jline(s.jp, s.ro, true) : ''}
        ${s.zh ? `<p class="muted" style="font-size:16px">${esc(s.zh)}</p>` : ''}
      </section>
      <div class="row" style="justify-content:center;gap:14px">
        <button class="btn" data-a="lsSkip" data-v="-1" aria-label="上一段">上一段</button>
        <button class="btn jp-b" style="min-width:140px;min-height:64px;font-size:19px" data-a="lsToggle">${LS.playing ? '暫停' : '開始播放'}</button>
        <button class="btn" data-a="lsSkip" data-v="1" aria-label="下一段">下一段</button>
      </div>
      <div class="chips" style="justify-content:center">${opt('words', '先念關鍵字')}${opt('zh', '中文解說')}${opt('loop', '全部循環')}</div>
      <div class="card flat stack" style="gap:6px">
        <p class="small">每一句的播放順序：日文 → ${LS.zh ? '中文意思 → ' : ''}慢速日文 → 正常日文。</p>
        <p class="small muted">播放時請讓螢幕保持亮著，App 會盡量讓螢幕不暗下來。iPhone 鎖定螢幕或切到別的 App，聲音就會停。</p>
        <p class="small muted">騎車時音量開小一點，留意路況。</p>
      </div>
      <p class="sec-title">這次會播的對話（${LS.list.length} 段）</p>
      <div class="list">${LS.list.map((p, i) => `<div class="li" style="${i === di ? 'background:var(--jp-soft)' : ''}"><div class="grow"><div style="font-weight:700">${esc(DLG_MAP[p.sid].name)}</div><div class="zh">第 ${p.lv} 級・${LV_NAME[p.lv]}</div></div></div>`).join('')}</div>
    </div></div>`;
}
</script>
