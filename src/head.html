<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>按鈕與積木</title>
<meta name="description" content="個人用的 iPhone 學習 App：看懂 AI 工具介面的英文；去日本獨旅時聽懂回答、把一段對話走完（五十音、口語聽力、鎖屏聽力）。">
<meta name="theme-color" content="#EEF1F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10141C" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="按鈕與積木">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" sizes="any" href="favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Zen+Maru+Gothic:wght@500;700&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Zen+Maru+Gothic:wght@500;700&display=swap"></noscript>
<style>
/* Layout: one-handed phone app — content column, fixed bottom tab bar, full-screen practice overlay, bottom sheets.
   English = cobalt "button" world; Japanese = deep teal "block" world; block roles each keep one color everywhere. */
:root{
  --bg:#EEF1F6; --surface:#FFFFFF; --surface2:#F6F8FB; --ink:#18202F; --muted:#5B6479; --line:#D8DDE8;
  --en:#2F55E4; --en-soft:#E3E9FF; --en-ink:#1D3BB0; --en-hero:#2F55E4;
  --jp:#0B7F6A; --jp-soft:#D9F1EB; --jp-ink:#075D4E; --jp-hero:#0B7F6A;
  --ok:#1B8F4E; --ok-soft:#DDF3E6; --bad:#CC3B3B; --bad-soft:#FBE3E3; --warn:#B7790E; --warn-soft:#FBF0D8;
  --r-purpose:#9A5B00; --r-purpose-bg:#FFEBC9;
  --r-place:#08756E; --r-place-bg:#D5F1EE;
  --r-thing:#5A3CC4; --r-thing-bg:#E8E1FF;
  --r-num:#1467B8; --r-num-bg:#DAEBFF;
  --r-way:#B03570; --r-way-bg:#FCE0EE;
  --r-qual:#4F7A0B; --r-qual-bg:#E6F3CF;
  --r-pt:#56607A; --r-pt-bg:#E6E9F1;
  --r-end:#18202F; --r-end-bg:#D9DEEA;
  --r-reply:#8A4B12; --r-reply-bg:#F6E4D3;
  --shadow:0 1px 2px rgba(24,32,47,.06),0 4px 14px rgba(24,32,47,.06);
  --f-body:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  --f-en:"Atkinson Hyperlegible",-apple-system,"Helvetica Neue",Arial,sans-serif;
  --f-jp:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;
  --f-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --tab-h:66px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10141C; --surface:#1A202C; --surface2:#151A24; --ink:#E8ECF4; --muted:#9AA3B8; --line:#2A3242;
  --en:#7C98FF; --en-soft:#222C4E; --en-ink:#AFC0FF; --en-hero:#2C47B5;
  --jp:#3CC9A7; --jp-soft:#133A33; --jp-ink:#8EE6CF; --jp-hero:#0C6655;
  --ok:#4CC984; --ok-soft:#163726; --bad:#FF7B7B; --bad-soft:#3E1C1F; --warn:#F0B84A; --warn-soft:#3A2E14;
  --r-purpose:#FFC56B; --r-purpose-bg:#3B2C12; --r-place:#6BDDD2; --r-place-bg:#10332F; --r-thing:#B9A5FF; --r-thing-bg:#2A2150;
  --r-num:#8CC4FF; --r-num-bg:#15304D; --r-way:#FF9CC9; --r-way-bg:#40172B; --r-qual:#B5E36B; --r-qual-bg:#253312;
  --r-pt:#B7BFD3; --r-pt-bg:#2A3140; --r-end:#E8ECF4; --r-end-bg:#343D50; --r-reply:#F2B77E; --r-reply-bg:#3D2814;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10141C; --surface:#1A202C; --surface2:#151A24; --ink:#E8ECF4; --muted:#9AA3B8; --line:#2A3242;
  --en:#7C98FF; --en-soft:#222C4E; --en-ink:#AFC0FF; --en-hero:#2C47B5;
  --jp:#3CC9A7; --jp-soft:#133A33; --jp-ink:#8EE6CF; --jp-hero:#0C6655;
  --ok:#4CC984; --ok-soft:#163726; --bad:#FF7B7B; --bad-soft:#3E1C1F; --warn:#F0B84A; --warn-soft:#3A2E14;
  --r-purpose:#FFC56B; --r-purpose-bg:#3B2C12; --r-place:#6BDDD2; --r-place-bg:#10332F; --r-thing:#B9A5FF; --r-thing-bg:#2A2150;
  --r-num:#8CC4FF; --r-num-bg:#15304D; --r-way:#FF9CC9; --r-way-bg:#40172B; --r-qual:#B5E36B; --r-qual-bg:#253312;
  --r-pt:#B7BFD3; --r-pt-bg:#2A3140; --r-end:#E8ECF4; --r-end-bg:#343D50; --r-reply:#F2B77E; --r-reply-bg:#3D2814;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark}

[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
button:focus-visible,[tabindex]:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--en);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.25}
p{margin:0}
.en{font-family:var(--f-en)}
.jpf{font-family:var(--f-jp)}
.muted{color:var(--muted)}
.small{font-size:13px}
.tnum{font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
.app{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:12px calc(var(--tab-h) + 28px + env(safe-area-inset-bottom,0px))}
.topbar{display:flex;align-items:center;gap:12px;padding-block:6px 14px}
.topbar h1{font-size:20px;font-weight:800;letter-spacing:.02em}
.topbar .grow{flex:1;min-width:0}
.lv{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.xpbar{height:6px;border-radius:6px;background:var(--line);overflow:hidden;width:96px}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--en),var(--jp));border-radius:6px}
.streak{display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--muted);line-height:1.1}
.streak b{font-size:20px;color:var(--ink);font-family:var(--f-en)}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr);height:var(--tab-h);align-items:center}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);height:100%;justify-content:center}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--ink);font-weight:700}
.tab[aria-current="page"] svg{color:var(--en)}
.tab.jp[aria-current="page"] svg{color:var(--jp)}
.tab.look .dot{width:52px;height:52px;border-radius:18px;background:var(--ink);color:var(--bg);display:grid;place-items:center;margin-top:-18px;box-shadow:var(--shadow)}
.tab.look .dot svg{color:var(--bg)!important}

/* ---------- common blocks ---------- */
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:10px}
.row.wrap{flex-wrap:wrap}
.card{background:var(--surface);border-radius:20px;padding:18px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none;border:1px solid var(--line)}
.sec-title{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.06em;margin-block:6px 2px}
.hero-en{background:var(--en-hero);color:#fff}
.hero-jp{background:var(--jp-hero);color:#fff}
.hero-en .muted,.hero-jp .muted{color:rgba(255,255,255,.82)}
.big{font-size:34px;font-weight:800;font-family:var(--f-en);line-height:1}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 18px;border-radius:16px;font-weight:700;font-size:17px;background:var(--surface2);border:1px solid var(--line);transition:transform .08s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:transparent}
.btn.en-b{background:var(--en-hero);color:#fff;border-color:transparent}
.btn.jp-b{background:var(--jp-hero);color:#fff;border-color:transparent}
.btn.onhero{background:#fff;color:var(--en-hero);border:0}
.hero-jp .btn.onhero{color:var(--jp-hero)}
.overlay .btn.primary{background:var(--en-hero);color:#fff}
.overlay.jpmode .btn.primary{background:var(--jp-hero);color:#fff}
.btn svg{width:22px;height:22px;flex:none}
.lvdots{display:flex;gap:5px;margin-top:6px}
.lvdots i{width:16px;height:8px;border-radius:4px;background:var(--line)}
.lvdots i.pass{background:var(--jp)}
.lvdots i.cur{background:transparent;box-shadow:inset 0 0 0 2px var(--jp)}
.lvp{background:var(--jp-soft);color:var(--jp-ink)}
.repair{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rep{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:10px 12px;border-radius:14px;background:var(--surface);border:1px solid var(--line);text-align:left;min-height:58px;min-width:0}
.rep .jpf{font-weight:700;font-size:15px;line-height:1.3}
.rep:active{transform:scale(.98)}
.opt .jline{display:flex}
.li.keych{background:var(--warn-soft)}
.btn.ghost{background:transparent}
.btn.sm{min-height:40px;font-size:15px;border-radius:12px;padding:0 14px}
.btn.block{width:100%}
.btn[disabled]{opacity:.45}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.seg button{min-height:40px;border-radius:10px;font-weight:700;font-size:15px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pill{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.st-new{background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.st-short{background:var(--warn-soft);color:var(--warn)}
.st-fam{background:var(--en-soft);color:var(--en-ink)}
.st-mast{background:var(--ok-soft);color:var(--ok)}
.st-conf{background:var(--bad-soft);color:var(--bad)}
.meter{height:10px;border-radius:10px;background:rgba(255,255,255,.25);overflow:hidden}
.meter i{display:block;height:100%;background:#fff;border-radius:10px;transition:width .6s}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.kpi{background:var(--surface);border-radius:16px;padding:14px;box-shadow:var(--shadow);min-width:0}
.kpi b{display:block;font-size:24px;font-family:var(--f-en)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:74px}
.week div{display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;font-size:11px;color:var(--muted)}
.week i{display:block;width:100%;max-width:26px;border-radius:6px 6px 3px 3px;background:var(--en);min-height:3px}
.week i.jpbar{background:var(--jp)}
.list{display:flex;flex-direction:column;background:var(--surface);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.li{display:flex;align-items:center;gap:12px;padding:12px 16px;min-height:58px;text-align:left;width:100%;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .w{font-family:var(--f-en);font-weight:700;font-size:18px}
.li .grow{flex:1;min-width:0}
.li .zh{color:var(--muted);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{padding:28px 18px;text-align:center;color:var(--muted)}
.icon-btn{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none}
.icon-btn svg{width:22px;height:22px}
.speak{background:var(--surface2);border:1px solid var(--line)}
.fakebtn{display:inline-flex;align-items:center;min-height:34px;padding:0 14px;border-radius:9px;font-family:var(--f-en);font-weight:700;font-size:15px;border:1px solid var(--line);background:var(--surface)}
.fakebtn.main{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.fakebtn.ring{box-shadow:0 0 0 3px var(--en)}

/* ---------- mock interface ---------- */
.mock{border:1px solid var(--line);border-radius:16px;background:var(--surface2);overflow:hidden}
.mock .bar{display:flex;gap:5px;padding:8px 12px;border-bottom:1px solid var(--line)}
.mock .bar i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.mock .body{padding:16px;display:flex;flex-direction:column;gap:14px}
.mock .msg{font-family:var(--f-en);font-size:19px;line-height:1.4}
.mock mark{background:var(--en-soft);color:var(--en-ink);padding:0 4px;border-radius:5px;font-weight:700}
.mock .btns{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}

/* ---------- Japanese blocks ---------- */
.blk{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:0;padding:7px 12px 8px;border-radius:12px;min-height:56px;background:var(--rb);color:var(--rc);font-family:var(--f-jp);font-weight:700;font-size:21px;line-height:1.15;border:2px solid transparent;position:relative}
.blk .ro{font-family:var(--f-en);font-weight:400;font-size:12px;opacity:.85;line-height:1.1;margin-bottom:2px}
.blk .rl{font-family:var(--f-body);font-size:10px;font-weight:700;opacity:.8;line-height:1;margin-top:3px}
.noro .blk .ro{display:none}
.noro .blk.peek .ro{display:block}
.blk.pt{min-width:44px}
.blk.bad{border-color:var(--bad);animation:shake .35s}
.blk.good{border-color:var(--ok)}
.blk.slot{border:2px dashed currentColor;background:transparent}
.role-purpose{--rb:var(--r-purpose-bg);--rc:var(--r-purpose)}
.role-place{--rb:var(--r-place-bg);--rc:var(--r-place)}
.role-thing{--rb:var(--r-thing-bg);--rc:var(--r-thing)}
.role-num{--rb:var(--r-num-bg);--rc:var(--r-num)}
.role-way{--rb:var(--r-way-bg);--rc:var(--r-way)}
.role-qual{--rb:var(--r-qual-bg);--rc:var(--r-qual)}
.role-pt{--rb:var(--r-pt-bg);--rc:var(--r-pt)}
.role-end{--rb:var(--r-end-bg);--rc:var(--r-end)}
.role-reply{--rb:var(--r-reply-bg);--rc:var(--r-reply)}
.sent{display:flex;flex-wrap:wrap;gap:6px;align-items:flex-end}
.jline{display:flex;flex-direction:column;gap:1px}
.jline .ro{font-family:var(--f-en);font-size:13px;color:var(--muted);line-height:1.2}
.jline .jp{font-family:var(--f-jp);font-size:21px;font-weight:700;line-height:1.35}
.noro .jline .ro{display:none}
.noro .jline.peek .ro{display:block}
.bubble{background:var(--surface);border-radius:4px 18px 18px 18px;padding:12px 14px;box-shadow:var(--shadow);display:flex;gap:10px;align-items:flex-start}
.bubble .grow{flex:1;min-width:0}
.who{font-size:12px;font-weight:700;color:var(--jp-ink)}
.answer-zone{min-height:78px;border:2px dashed var(--line);border-radius:16px;padding:10px;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start;background:var(--surface)}
.answer-zone:empty::before{content:'點下面的積木，依序放進來';color:var(--muted);font-size:14px;align-self:center;margin:auto}
.tray{display:flex;flex-wrap:wrap;gap:8px}
.tray .blk.used{opacity:.18;pointer-events:none}
.legend{display:flex;flex-wrap:wrap;gap:6px}
.legend span{font-size:12px;font-weight:700;padding:3px 8px;border-radius:8px;background:var(--rb);color:var(--rc)}
.parts{display:flex;flex-direction:column;gap:8px}
.part{display:flex;gap:10px;align-items:flex-start}
.part .blk{flex:none}
.part p{font-size:14px;padding-top:4px}

/* ---------- session overlay ---------- */
.overlay{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.ov-head{display:flex;align-items:center;gap:12px;padding:8px 16px;max-width:560px;width:100%;margin:0 auto}
.prog{flex:1;height:10px;border-radius:10px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;border-radius:10px;background:var(--en);transition:width .3s}
.overlay.jpmode .prog i{background:var(--jp)}
.ov-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.ov-body .in{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:8px 24px;display:flex;flex-direction:column;gap:16px}
.ov-foot{padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--surface)}
.ov-foot .in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.q{font-size:20px;font-weight:800}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:12px;min-height:60px;padding:10px 16px;border-radius:16px;background:var(--surface);border:2px solid var(--line);text-align:left;font-size:17px;width:100%}
.opt .en{font-weight:700;font-size:19px}
.opt .sub{display:block;font-size:13px;color:var(--muted);font-weight:400}
.opt.correct{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt[disabled]{cursor:default}
.fb{border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:8px;animation:up .25s ease-out}
.fb.ok{background:var(--ok-soft)}
.fb.no{background:var(--bad-soft)}
.fb h3{font-size:18px}
.fb.ok h3{color:var(--ok)}
.fb.no h3{color:var(--bad)}
.rule{border-left:3px solid var(--en);padding-left:10px;font-size:15px}
.jpmode .rule,.rule.j{border-left-color:var(--jp)}
.teach-word{display:flex;align-items:center;gap:12px}
.teach-word .fakebtn{font-size:26px;min-height:56px;padding:0 22px;border-radius:14px}
.cmp{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;align-items:baseline;font-size:15px}
.cmp .en{font-weight:700}
.cmp .me{color:var(--en-ink)}
.done-hero{text-align:center;padding:24px 0 8px;display:flex;flex-direction:column;align-items:center;gap:10px}

/* ---------- sheet ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,14,22,.45);z-index:50;animation:fade .2s}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;max-height:88%;overflow-y:auto;background:var(--bg);border-radius:22px 22px 0 0;padding:10px 16px calc(20px + env(safe-area-inset-bottom,0px));animation:up .25s ease-out}
.sheet .in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.grab{width:40px;height:5px;border-radius:5px;background:var(--line);margin:0 auto 4px}
textarea,input[type=text]{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
textarea{min-height:120px;resize:vertical;font-family:var(--f-en)}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:14px;font-weight:700;font-size:15px;box-shadow:var(--shadow);animation:drop .25s ease-out;max-width:calc(100% - 32px)}
.switch{position:relative;width:52px;height:32px;border-radius:16px;background:var(--line);flex:none;transition:background .2s}
