","ဆိုင်အပေါ်ထပ်","ကျောင်းအတွင်း"],"answer":0,"explanation":"အိမ်က ကျောင်းဘေးမှာပါ။ ကျောင်းအတွင်းမှာ မဟုတ်ပါဘူး။","evidence":"我家在學校旁邊"},{"id":"q-a1-10","level":"A1","wordId":"a1-10","passage":"爸爸在看書，媽媽在喝茶。我在寫字。","my":"အဖေ စာဖတ်နေတယ်။ အမေ လက်ဖက်ရည်သောက်နေတယ်။ ကျွန်တော် စာရေးနေတယ်။","question":"誰在看書？","options":["媽媽","我","爸爸","妹妹"],"optionsMy":["အမေ","ကျွန်တော်","အဖေ","ညီမ"],"answer":2,"explanation":"စာဖတ်နေတာ အဖေပါ။ အမေက လက်ဖက်ရည်သောက်နေပါတယ်။","evidence":"爸爸在看書"},{"id":"q-a1-11","level":"A1","wordId":"a1-11","passage":"老師說：請寫你的名字，不要寫電話。","my":"ဆရာက နာမည်ရေးပါ၊ ဖုန်းနံပါတ်မရေးပါနဲ့လို့ ပြောတယ်။","question":"老師要學生寫什麼？","options":["電話","名字","時間","學校"],"optionsMy":["ဖုန်းနံပါတ်","နာမည်","အချိန်","ကျောင်း"],"answer":1,"explanation":"နာမည်ရေးခိုင်းတာပါ။ ဖုန်းနံပါတ်ကို မရေးခိုင်းပါဘူး။","evidence":"請寫你的名字"},{"id":"q-a1-12","level":"A1","wordId":"a1-12","passage":"我早上六點起床。弟弟七點起床。我們八點出門。","my":"ကျွန်တော် မနက်ခြောက်နာရီမှာ အိပ်ရာထတယ်။ ညီက ခုနစ်နာရီမှာ ထတယ်။ ရှစ်နာရီမှာ အိမ်ကထွက်ကြတယ်။","question":"弟弟幾點起床？","options":["六點","八點","九點","七點"],"optionsMy":["ခြောက်နာရီ","ရှစ်နာရီ","ကိုးနာရီ","ခုနစ်နာရီ"],"answer":3,"explanation":"မေးထားတာ ညီရဲ့အိပ်ရာထချိန်ပါ။ ခုနစ်နာရီ ဖြစ်ပါတယ်။","evidence":"弟弟七點起床"},{"id":"q-a2-01","level":"A2","wordId":"a2-01","passage":"小安到了學校，才發現手機還在家裡。他想打電話給媽媽，可是沒有手機，所以先向老師借電話。","my":"ရှောင်အန်းက ကျောင်းရောက်မှ ဖုန်းအိမ်မှာကျန်ခဲ့တာ သိတယ်။ အမေ့ကို ဖုန်းခေါ်ချင်ပေမယ့် ဖုန်းမရှိလို့ ဆရာ့ဖုန်းကို အရင်ငှားတယ်။","question":"小安為什麼借電話？","options":["忘記帶手機","手機太舊","想買手機","媽媽沒有電話"],"optionsMy":["ဖုန်းယူဖို့မေ့ခဲ့လို့","ဖုန်းဟောင်းလို့","ဖုန်းဝယ်ချင်လို့","အမေ့မှာဖုန်းမရှိလို့"],"answer":0,"explanation":"ဖုန်းအိမ်မှာကျန်ခဲ့တာကြောင့် ငှားခြင်းပါ။ ဖုန်းပျက်ခြင်း၊ ဟောင်းခြင်းအကြောင်း မပါပါဘူး။","evidence":"手機還在家裡"},{"id":"q-a2-02","level":"A2","wordId":"a2-02","passage":"小美和朋友約好三點見面。她兩點五十分就到了車站。朋友還沒來，她買了一杯茶，坐下來等。","my":"ရှောင်မေနဲ့ သူငယ်ချင်းက သုံးနာရီတွေ့ဖို့ ချိန်းထားတယ်။ သူမက နှစ်နာရီငါးဆယ်မှာ ဘူတာရောက်ပြီး သူငယ်ချင်းမလာသေးလို့ လက်ဖက်ရည်ဝယ်ကာ စောင့်နေတယ်။","question":"小美為什麼在車站等？","options":["公車壞了","她忘記時間","朋友還沒到","她找不到車站"],"optionsMy":["ဘတ်စ်ကားပျက်လို့","အချိန်မေ့လို့","သူငယ်ချင်းမရောက်သေးလို့","ဘူတာမတွေ့လို့"],"answer":2,"explanation":"သူငယ်ချင်းမရောက်သေးလို့ စောင့်နေတာပါ။ သူမက ဘူတာရောက်နေပြီးသားပါ။","evidence":"朋友還沒來"},{"id":"q-a2-03","level":"A2","wordId":"a2-03","passage":"小明今天七點就出門，可是公車很晚才來。他到了教室，老師已經開始上課了。","my":"ရှောင်မင်က ဒီနေ့ ခုနစ်နာရီကတည်းက ထွက်ပေမယ့် ဘတ်စ်ကားနောက်ကျလာတယ်။ စာသင်ခန်းရောက်တော့ ဆရာက စာသင်နေပြီ။","question":"小明今天怎麼了？","options":["沒有上課","上課遲到","忘記教室","太早到學校"],"optionsMy":["အတန်းမတက်ဘူး","အတန်းနောက်ကျတယ်","စာသင်ခန်းမေ့တယ်","ကျောင်းစောလွန်းစွာရောက်တယ်"],"answer":1,"explanation":"အတန်းစပြီးမှ ရောက်တာကြောင့် နောက်ကျတာပါ။ အိမ်က စောထွက်ပေမယ့် စောမရောက်ခဲ့ပါဘူး။","evidence":"老師已經開始上課了"},{"id":"q-a2-04","level":"A2","wordId":"a2-04","passage":"我想買一本中文書。朋友說，學校附近有一家書店，從學校走過去只要五分鐘，不用坐車。","my":"ကျွန်တော် တရုတ်စာအုပ်ဝယ်ချင်တယ်။ ကျောင်းအနီးမှာ စာအုပ်ဆိုင်ရှိပြီး လမ်းလျှောက်ငါးမိနစ်ပဲကြာတယ်၊ ကားစီးဖို့မလိုဘူးလို့ သူငယ်ချင်းပြောတယ်။","question":"從學校去書店，怎麼去比較方便？","options":["坐飛機","坐一小時的車","開車去別的城市","走路"],"optionsMy":["လေယာဉ်စီး","တစ်နာရီကားစီး","အခြားမြို့ကိုကားမောင်း","လမ်းလျှောက်"],"answer":3,"explanation":"လမ်းလျှောက်ငါးမိနစ်သာကြာပြီး ကားစီးရန်မလိုတာကြောင့် လမ်းလျှောက်သွားရတာ အဆင်ပြေပါတယ်။","evidence":"走過去只要五分鐘"},{"id":"q-a2-05","level":"A2","wordId":"a2-05","passage":"同樣一杯紅茶，學校裡的店賣三十元，學校外的店賣二十五元。小華今天想少花一點錢。","my":"တူညီတဲ့ လက်ဖက်ရည်တစ်ခွက်ကို ကျောင်းထဲမှာ သုံးဆယ်၊ ကျောင်းအပြင်မှာ နှစ်ဆယ့်ငါးပေးရတယ်။ ရှောင်ဟွာက ဒီနေ့ ငွေနည်းနည်းပဲသုံးချင်တယ်။","question":"哪一家店的紅茶比較便宜？","options":["學校外的店","學校裡的店","兩家一樣","不知道價格"],"optionsMy":["ကျောင်းအပြင်ဆိုင်","ကျောင်းထဲဆိုင်","နှစ်ဆိုင်အတူတူ","ဈေးမသိဘူး"],"answer":0,"explanation":"နှစ်ဆယ့်ငါးက သုံးဆယ်ထက်နည်းလို့ ကျောင်းအပြင်ဆိုင်က ပိုသက်သာပါတယ်။","evidence":"學校外的店賣二十五元"},{"id":"q-a2-06","level":"A2","wordId":"a2-06","passage":"店員問小美需不需要袋子。小美說：不用，謝謝，我自己帶了袋子。她把買好的水果放進自己的袋子裡。","my":"ဆိုင်ဝန်ထမ်းက အိတ်လိုလားမေးရာ ရှောင်မေက ကိုယ့်အိတ်ပါလာလို့ မလိုဘူးလို့ ဖြေတယ်။ ဝယ်ထားတဲ့သစ်သီးကို ကိုယ့်အိတ်ထဲထည့်တယ်။","question":"小美為什麼不需要袋子？","options":["沒有買東西","不喜歡水果","自己帶了袋子","店裡沒有袋子"],"optionsMy":["ဘာမှမဝယ်လို့","သစ်သီးမကြိုက်လို့","ကိုယ့်အိတ်ပါလို့","ဆိုင်မှာအိတ်မရှိလို့"],"answer":2,"explanation":"ကိုယ်ပိုင်အိတ်ပါလာတာပါ။ သစ်သီးကို ဝယ်ပြီးသားဖြစ်ပါတယ်။","evidence":"我自己帶了袋子"},{"id":"q-a2-07","level":"A2","wordId":"a2-07","passage":"媽媽問我餓不餓，要不要一起吃晚餐。我說，我已經和同學吃過了，但是可以坐下來陪她。","my":"အမေက ဗိုက်ဆာလား၊ ညစာအတူစားမလားမေးတယ်။ ကျွန်တော်က အတန်းဖော်နဲ့ စားပြီးပြီ၊ ဒါပေမယ့် အတူထိုင်ပေးနိုင်တယ်လို့ ဖြေတယ်။","question":"他為什麼不吃晚餐？","options":["不喜歡媽媽做的菜","已經吃過了","沒有時間坐下","正在上課"],"optionsMy":["အမေ့ဟင်းမကြိုက်လို့","စားပြီးပြီဖြစ်လို့","ထိုင်ဖို့အချိန်မရှိလို့","အတန်းတက်နေဆဲမို့"],"answer":1,"explanation":"စားပြီးပြီလို့ ပြောပါတယ်။ ဟင်းမကြိုက်ခြင်းမဟုတ်ဘဲ အမေနဲ့ထိုင်ပေးနိုင်ပါသေးတယ်။","evidence":"我已經和同學吃過了"},{"id":"q-a2-08","level":"A2","wordId":"a2-08","passage":"今天晚上我們要一起做飯。小美買菜，我洗菜，小明煮飯。大家都不用一個人做完全部的事。","my":"ဒီည အတူချက်ပြုတ်ကြမယ်။ ရှောင်မေ ဈေးဝယ်၊ ကျွန်တော် ဟင်းသီးဟင်းရွက်ဆေး၊ ရှောင်မင် ထမင်းချက်မယ်။ တစ်ယောက်တည်း အကုန်လုပ်ဖို့မလိုဘူး။","question":"小明要做什麼？","options":["買菜","洗菜","洗衣服","煮飯"],"optionsMy":["ဈေးဝယ်","ဟင်းသီးဟင်းရွက်ဆေး","အဝတ်လျှော်","ထမင်းချက်"],"answer":3,"explanation":"ရှောင်မင်လုပ်မည့်အရာက ထမင်းချက်ခြင်းပါ။ ဈေးဝယ်သူက ရှောင်မေပါ။","evidence":"小明煮飯"},{"id":"q-a2-09","level":"A2","wordId":"a2-09","passage":"小美每天讀中文，也和同學練習說話。遇到不會的字，她先查意思，再用這個字說一句自己的話。","my":"ရှောင်မေက နေ့တိုင်း တရုတ်စာဖတ်ပြီး အတန်းဖော်နဲ့ စကားပြောလေ့ကျင့်တယ်။ မသိတဲ့စကားလုံးကို အဓိပ္ပာယ်ရှာပြီး ကိုယ့်ဝါကျနဲ့ပြန်သုံးတယ်။","question":"查完意思後，小美會做什麼？","options":["自己說一句話","馬上睡覺","不再看這個字","換一本書"],"optionsMy":["ကိုယ့်ဝါကျပြောမယ်","ချက်ချင်းအိပ်မယ်","ထိုစကားလုံးကိုမကြည့်တော့ဘူး","စာအုပ်ပြောင်းမယ်"],"answer":0,"explanation":"အဓိပ္ပာယ်ရှာပြီးနောက် မိမိဝါကျဖြင့် သုံးပါတယ်။ စာအုပ်ပြောင်းခြင်းမဟုတ်ပါဘူး။","evidence":"再用這個字說一句自己的話"},{"id":"q-a2-10","level":"A2","wordId":"a2-10","passage":"我們本來想去公園，可是下午開始下雨。因為大家都沒有帶傘，所以最後留在家裡看電影。","my":"မူလက ပန်းခြံသွားချင်ပေမယ့် မွန်းလွဲပိုင်းမှာ မိုးရွာလာတယ်။ ဘယ်သူမှ ထီးမပါလို့ နောက်ဆုံး အိမ်မှာရုပ်ရှင်ကြည့်ကြတယ်။","question":"他們為什麼留在家裡？","options":["電影票很便宜","公園很遠","下雨又沒帶傘","大家都不喜歡公園"],"optionsMy":["ရုပ်ရှင်လက်မှတ်သက်သာလို့","ပန်းခြံဝေးလို့","မိုးရွာပြီးထီးမပါလို့","ပန်းခြံကိုမကြိုက်လို့"],"answer":2,"explanation":"အပြင်မသွားသည့်အကြောင်းရင်းမှာ မိုးရွာပြီး ထီးမရှိခြင်းပါ။","evidence":"大家都沒有帶傘"},{"id":"q-a2-11","level":"A2","wordId":"a2-11","passage":"小安明天要考中文。今天晚上，他先準備好證件和筆，再聽一段中文，九點半就去睡覺。","my":"ရှောင်အန်း မနက်ဖြန် တရုတ်စာဖြေရမယ်။ ဒီည အထောက်အထားနဲ့ဘောပင်ပြင်ပြီး တရုတ်အသံတစ်ပိုဒ်နားထောင်ကာ ကိုးနာရီခွဲမှာ အိပ်တယ်။","question":"小安先準備了什麼？","options":["早餐和牛奶","證件和筆","電影票","新衣服"],"optionsMy":["မနက်စာနဲ့နွားနို့","အထောက်အထားနဲ့ဘောပင်","ရုပ်ရှင်လက်မှတ်","အဝတ်သစ်"],"answer":1,"explanation":"ဦးစွာပြင်ဆင်သည့်အရာမှာ အထောက်အထားနှင့် ဘောပင်ပါ။","evidence":"先準備好證件和筆"},{"id":"q-a2-12","level":"A2","wordId":"a2-12","passage":"小華想看一本書，可是今天帶的錢不夠。他沒有買書，而是去圖書館借，打算下星期還。","my":"ရှောင်ဟွာက စာအုပ်ဖတ်ချင်ပေမယ့် ဒီနေ့ငွေမလုံလောက်ဘူး။ မဝယ်ဘဲ စာကြည့်တိုက်မှာငှားပြီး နောက်အပတ်ပြန်အပ်ဖို့ စီစဉ်တယ်။","question":"小華最後怎麼得到這本書？","options":["請朋友買","在書店買","向老師拿","去圖書館借"],"optionsMy":["သူငယ်ချင်းကိုဝယ်ခိုင်း","စာအုပ်ဆိုင်မှာဝယ်","ဆရာ့ဆီကယူ","စာကြည့်တိုက်မှာငှား"],"answer":3,"explanation":"မဝယ်ဘဲ စာကြည့်တိုက်က ငှားတာပါ။ ငွေမလုံလောက်ခြင်းကို အကြောင်းရင်းအဖြစ် ပြောထားပါတယ်။","evidence":"去圖書館借"},{"id":"q-b1-01","level":"B1","wordId":"b1-01","passage":"小美以前總是等有空才讀中文，結果常常一整個星期都沒讀。她決定每天早餐後讀十分鐘。雖然時間不長，但是一個月後，她發現自己能看懂更多句子了。","my":"ရှောင်မေက အားမှတရုတ်စာဖတ်လေ့ရှိလို့ တစ်ပတ်လုံးမဖတ်ဖြစ်တာများတယ်။ နေ့တိုင်းမနက်စာစားပြီး ဆယ်မိနစ်ဖတ်ဖို့ ဆုံးဖြတ်တယ်။ တစ်လအကြာ ပိုများတဲ့ဝါကျတွေကို နားလည်လာတယ်။","question":"小美主要改變了什麼？","options":["固定每天讀一點","只在週末讀書","每天換一本書","完全不吃早餐"],"optionsMy":["နေ့တိုင်းပုံမှန်နည်းနည်းဖတ်","ပိတ်ရက်မှာသာဖတ်","နေ့တိုင်းစာအုပ်ပြောင်း","မနက်စာလုံးဝမစား"],"answer":0,"explanation":"အဓိကပြောင်းလဲမှုမှာ အားမှဖတ်ခြင်းမှ နေ့တိုင်းအချိန်မှန်ဖတ်ခြင်းသို့ ပြောင်းခြင်းပါ။","evidence":"每天早餐後讀十分鐘"},{"id":"q-b1-02","level":"B1","wordId":"b1-02","passage":"這家餐廳雖然離學校比較遠，但是價格合理，老闆也很親切。小安平常下課後沒有很多時間，所以只有星期六才會和朋友一起去。","my":"ဒီစားသောက်ဆိုင်က ကျောင်းနဲ့ဝေးပေမယ့် ဈေးသင့်ပြီး ဆိုင်ရှင်ဖော်ရွေတယ်။ ရှောင်အန်းက အတန်းပြီးရင် အချိန်နည်းလို့ စနေနေ့မှ သူငယ်ချင်းနဲ့သွားတယ်။","question":"小安平日比較少去的主要原因是什麼？","options":["老闆不親切","價格太高","路程遠又時間少","不喜歡這裡的菜"],"optionsMy":["ဆိုင်ရှင်မဖော်ရွေလို့","ဈေးကြီးလွန်းလို့","ဝေးပြီးအချိန်နည်းလို့","ဟင်းမကြိုက်လို့"],"answer":2,"explanation":"ဆိုင်၏အားနည်းချက်မှာ ဝေးခြင်း၊ သူ့အခြေအနေမှာ အချိန်နည်းခြင်းပါ။ ဈေးနဲ့ဆိုင်ရှင်အကြောင်းက ကောင်းတဲ့အချက်တွေပါ။","evidence":"平常下課後沒有很多時間"},{"id":"q-b1-03","level":"B1","wordId":"b1-03","passage":"小明背了很多生字，卻很少開口說中文。老師建議他每天選三個生字，說說自己今天做了什麼，並且錄下來聽。老師希望他把知道的詞用在生活裡。","my":"ရှောင်မင်က စကားလုံးများစွာကျက်ထားပေမယ့် တရုတ်လိုပြောတာနည်းတယ်။ ဆရာက နေ့တိုင်းစကားလုံးသုံးလုံးရွေးပြီး ဒီနေ့လုပ်ခဲ့တာကို ပြောကာ အသံသွင်းနားထောင်ဖို့ အကြံပြုတယ်။","question":"老師的建議主要是為了什麼？","options":["增加錄音設備","把生字用出來","停止學新詞","只練習寫字"],"optionsMy":["အသံသွင်းစက်တိုးဖို့","သိတဲ့စကားလုံးကိုအသုံးချဖို့","စကားလုံးအသစ်မသင်ဖို့","စာရေးပဲလေ့ကျင့်ဖို့"],"answer":1,"explanation":"ဆရာ့ရည်ရွယ်ချက်မှာ သိပြီးသားစကားလုံးကို နေ့စဉ်ဘဝတွင် ပြောဆိုအသုံးချစေဖို့ပါ။","evidence":"把知道的詞用在生活裡"},{"id":"q-b1-04","level":"B1","wordId":"b1-04","passage":"小華第一次聽中文新聞時，幾乎只聽得懂幾個字。三個月後，他還不能每一句都聽懂，但已經能說出新聞在談什麼。他覺得自己確實有進步。","my":"ရှောင်ဟွာက တရုတ်သတင်းစနားထောင်ချိန် စကားလုံးအနည်းငယ်ပဲနားလည်တယ်။ သုံးလအကြာ ဝါကျတိုင်းမသိသေးပေမယ့် ဘာအကြောင်းလဲ ပြောနိုင်လာလို့ တိုးတက်တယ်လို့ခံစားရတယ်။","question":"什麼表現說明小華進步了？","options":["每個字都會寫","不必再學中文","能翻譯所有新聞","能掌握新聞主題"],"optionsMy":["စာလုံးတိုင်းရေးတတ်","တရုတ်စာဆက်မသင်ရ","သတင်းအားလုံးဘာသာပြန်နိုင်","သတင်းအဓိကအကြောင်းသိနိုင်"],"answer":3,"explanation":"အဓိကအကြောင်းကို သိနိုင်လာခြင်းက တိုးတက်မှုပါ။ ဝါကျတိုင်းနားလည်ပြီဟု မဆိုပါဘူး။","evidence":"能說出新聞在談什麼"},{"id":"q-b1-05","level":"B1","wordId":"b1-05","passage":"我們原本安排早上爬山、下午逛市場。看到天氣預報說下午可能下大雨，大家討論後，決定上午逛市場，下午在室內看展覽，這次先不爬山。","my":"မူလက မနက်တောင်တက်၊ နေ့လယ်ဈေးလည်ဖို့ စီစဉ်ထားတယ်။ နေ့လယ်မိုးကြီးနိုင်လို့ မနက်ဈေးလည်ပြီး နေ့လယ်အဆောက်အအုံထဲက ပြပွဲကြည့်ဖို့ ပြောင်းကာ တောင်မတက်တော့ဘူး။","question":"他們最後怎麼安排？","options":["上午逛市場，下午看展覽","上午爬山，下午逛市場","全天爬山","下午才出門爬山"],"optionsMy":["မနက်ဈေးလည်၊နေ့လယ်ပြပွဲကြည့်","မနက်တောင်တက်၊နေ့လယ်ဈေးလည်","တစ်နေ့လုံးတောင်တက်","နေ့လယ်မှတောင်တက်ဖို့ထွက်"],"answer":0,"explanation":"「決定」နောက်က အစီအစဉ်သစ်ကို ရွေးရပါတယ်။ မူလအစီအစဉ်ကို မရွေးပါနဲ့။","evidence":"決定上午逛市場，下午在室內看展覽"},{"id":"q-b1-06","level":"B1","wordId":"b1-06","passage":"火車九點開，小美八點四十五分才出門。從她家到車站，走路要二十分鐘，坐計程車大約五分鐘。她不想錯過這班車，所以立刻叫了計程車。","my":"ရထားက ကိုးနာရီထွက်မယ်။ ရှောင်မေက ရှစ်နာရီလေးဆယ့်ငါးမှထွက်ပြီး ဘူတာအထိ လမ်းလျှောက်မိနစ်နှစ်ဆယ်၊ တက္ကစီငါးမိနစ်ကြာတယ်။ ရထားမလွတ်ချင်လို့ တက္ကစီခေါ်တယ်။","question":"小美為什麼不走路？","options":["走路比較貴","車站禁止走路","走路會來不及","她想晚一點到"],"optionsMy":["လမ်းလျှောက်ပိုဈေးကြီး","ဘူတာမှာလမ်းလျှောက်ခွင့်မရှိ","လမ်းလျှောက်ရင်မမီ","နောက်ကျရောက်ချင်"],"answer":2,"explanation":"ကျန်အချိန်က ဆယ့်ငါးမိနစ်သာရှိပြီး လမ်းလျှောက်ရင် မိနစ်နှစ်ဆယ်ကြာလို့ မမီပါဘူး။","evidence":"走路要二十分鐘"},{"id":"q-b1-07","level":"B1","wordId":"b1-07","passage":"小安每天要走很長的路。他看中一雙外表漂亮的鞋，但試穿後覺得腳不舒服。最後他買了另一雙比較普通、卻很舒服的鞋，因為那雙更適合每天穿。","my":"ရှောင်အန်း နေ့တိုင်းလမ်းအဝေးလျှောက်ရတယ်။ လှတဲ့ဖိနပ်ကို စမ်းစီးရာ မသက်သာလို့ နောက်ဆုံး သာမန်ပုံစံပေမယ့် သက်သာတဲ့ဖိနပ်ကို ရွေးတယ်။","question":"他選鞋子時最重視什麼？","options":["顏色特別","適合長時間走路","朋友都有買","外表最漂亮"],"optionsMy":["အရောင်ထူးခြားမှု","ကြာကြာလမ်းလျှောက်ရန်သင့်တော်မှု","သူငယ်ချင်းတွေဝယ်မှု","အလှဆုံးဖြစ်မှု"],"answer":1,"explanation":"နေ့တိုင်းလမ်းလျှောက်ရလို့ သက်သာပြီးအသုံးဝင်ခြင်းကို အလှထက်ပိုအလေးထားပါတယ်။","evidence":"因為那雙更適合每天穿"},{"id":"q-b1-08","level":"B1","wordId":"b1-08","passage":"以前小美都騎車上學，最近她搬到學校附近，走路十分鐘就到。她決定改變上學的方式，既省下油錢，也可以多活動身體。下雨時，她才會坐公車。","my":"အရင်က ဆိုင်ကယ်စီးကျောင်းသွားတဲ့ ရှောင်မေက ကျောင်းအနီးပြောင်းနေပြီး ဆယ်မိနစ်လမ်းလျှောက်ရင်ရောက်တယ်။ ဆီဖိုးချွေတာပြီး လှုပ်ရှားနိုင်ဖို့ လမ်းလျှောက်ကာ မိုးရွာမှ ဘတ်စ်ကားစီးတယ်။","question":"她現在平常怎麼上學？","options":["每天坐公車","開車","騎車","走路"],"optionsMy":["နေ့တိုင်းဘတ်စ်ကားစီး","ကားမောင်း","ဆိုင်ကယ်စီး","လမ်းလျှောက်"],"answer":3,"explanation":"ပုံမှန်က လမ်းလျှောက်တာပါ။ ဘတ်စ်ကားက မိုးရွာချိန်သာ စီးပါတယ်။","evidence":"走路十分鐘就到"},{"id":"q-b1-09","level":"B1","wordId":"b1-09","passage":"同學們想一起吃晚餐，有人不吃牛肉，有人不能吃太辣。小明沒有直接訂自己最喜歡的店，而是先找了幾家選擇比較多的餐廳，再請大家一起決定。","my":"အတန်းဖော်တွေညစာစားရာ အချို့အမဲသားမစား၊ အချို့အစပ်မစားနိုင်ဘူး။ ရှောင်မင်က ကိုယ်ကြိုက်တဲ့ဆိုင်ကို ချက်ချင်းမမှာဘဲ ရွေးချယ်စရာများတဲ့ဆိုင်တွေရှာပြီး အားလုံးအတူဆုံးဖြတ်ခိုင်းတယ်။","question":"小明為什麼找選擇多的餐廳？","options":["照顧不同人的需要","讓大家多花錢","他只喜歡牛肉","不想一起吃飯"],"optionsMy":["လူအမျိုးမျိုးရဲ့လိုအပ်ချက်ကိုဖြည့်ရန်","ငွေပိုသုံးစေရန်","အမဲသားသာကြိုက်လို့","အတူမစားချင်လို့"],"answer":0,"explanation":"တစ်ယောက်ချင်းစားသောက်မှုမတူတာကြောင့် အားလုံးအတွက်ရွေးစရာရှိအောင် လုပ်တာပါ။","evidence":"有人不吃牛肉，有人不能吃太辣"},{"id":"q-b1-10","level":"B1","wordId":"b1-10","passage":"小華剛來臺灣時，覺得早餐吃熱的食物很不習慣。他以前只吃麵包。住了半年後，他開始喜歡豆漿和蛋餅，現在每週都會去附近的早餐店。","my":"ရှောင်ဟွာက ထိုင်ဝမ်စရောက်တုန်း မနက်စာပူပူစားတာ မနေသားကျဘဲ အရင်က ပေါင်မုန့်ပဲစားတယ်။ ခြောက်လအကြာ ပဲနို့နဲ့ကြက်ဥပန်ကိတ်ကို ကြိုက်လာပြီး အပတ်တိုင်း မနက်စာဆိုင်သွားတယ်။","question":"小華的習慣有什麼變化？","options":["開始不吃早餐","只在家吃麵包","逐步接受當地早餐","不再喝任何飲料"],"optionsMy":["မနက်စာမစားတော့","အိမ်မှာပေါင်မုန့်ပဲစား","ဒေသမနက်စာကိုတဖြည်းဖြည်းလက်ခံ","အရည်လုံးဝမသောက်တော့"],"answer":2,"explanation":"အစပိုင်းမနေသားကျရာမှ ဒေသမနက်စာကို ကြိုက်လာတာပါ။ မနက်စာရပ်လိုက်ခြင်းမဟုတ်ပါဘူး။","evidence":"開始喜歡豆漿和蛋餅"},{"id":"q-b1-11","level":"B1","wordId":"b1-11","passage":"小美買水果前，先比較兩家店的價格。第一家比較便宜，但是水果已經不太新鮮；第二家貴一點，品質卻比較好。她最後買了第二家的水果，打算當天吃完。","my":"ရှောင်မေက ဆိုင်နှစ်ဆိုင်ကို နှိုင်းယှဉ်တယ်။ ပထမဆိုင်ဈေးသက်သာပေမယ့် မလတ်ဆတ်၊ ဒုတိယဆိုင်နည်းနည်းကြီးပေမယ့် ပိုကောင်းလို့ ဒုတိယဆိုင်ကို ရွေးတယ်။","question":"小美最後的選擇說明什麼？","options":["她完全不看價格","她也重視新鮮程度","她只買最便宜的","她不喜歡水果"],"optionsMy":["ဈေးကိုလုံးဝမကြည့်","လတ်ဆတ်မှုကိုလည်းအလေးထား","အသက်သာဆုံးပဲဝယ်","သစ်သီးမကြိုက်"],"answer":1,"explanation":"ဈေးကိုနှိုင်းယှဉ်ပေမယ့် လတ်ဆတ်မှုကိုပါ ထည့်စဉ်းစားပါတယ်။ ဈေးလုံးဝမကြည့်ဟု မဆိုနိုင်ပါဘူး။","evidence":"第二家貴一點，品質卻比較好"},{"id":"q-b1-12","level":"B1","wordId":"b1-12","passage":"小安以前常常一次買很多菜，結果來不及吃就壞了。為了不浪費食物，他現在先看冰箱裡有什麼，再寫下兩三天需要的東西，照著清單去買。","my":"ရှောင်အန်းက အရင်ဟင်းသီးဟင်းရွက်အများကြီးဝယ်လို့ မစားမီပျက်စီးတတ်တယ်။ အခုတော့ ရေခဲသေတ္တာစစ်ပြီး နှစ်ရက်သုံးရက်စာစာရင်းရေးကာ ဝယ်တယ်။","question":"他用什麼方法減少浪費？","options":["不再買任何菜","每天買更多","買最貴的食物","按需要列清單購買"],"optionsMy":["ဟင်းသီးဟင်းရွက်လုံးဝမဝယ်","နေ့တိုင်းပိုဝယ်","ဈေးအကြီးဆုံးဝယ်","လိုအပ်ချက်အလိုက်စာရင်းနဲ့ဝယ်"],"answer":3,"explanation":"ရှိပြီးသားပစ္စည်းကို စစ်ပြီး တကယ်လိုတာကိုသာ စာရင်းနဲ့ဝယ်ခြင်းပါ။","evidence":"照著清單去買"},{"id":"q-b2-01","level":"B2","wordId":"b2-01","passage":"小美曾經因為工作忙而中斷學習。後來她把每天的目標改成讀一小段文章，即使加班，也至少聽五分鐘中文。她認為，保持接觸比偶爾一次讀很久更重要；有空的週末，她才另外安排較長的練習。","my":"ရှောင်မေက အလုပ်များလို့ စာသင်ရပ်ဖူးတယ်။ အခု နေ့တိုင်းစာတိုတစ်ပိုဒ်ဖတ်ပြီး အချိန်ပိုဆင်းရင်တောင် ငါးမိနစ်နားထောင်တယ်။ ရံဖန်ရံခါအကြာကြီးဖတ်တာထက် မပြတ်ထိတွေ့ခြင်းကို အလေးထားတယ်။","question":"小美現在最重視哪一點？","options":["持續接觸中文","每天讀相同的時數","只在放假時學習","完全避免加班"],"optionsMy":["တရုတ်စာနဲ့မပြတ်ထိတွေ့မှု","နေ့တိုင်းအချိန်တူတူဖတ်မှု","အားလပ်ရက်မှာသာသင်မှု","အချိန်ပိုလုံးဝရှောင်မှု"],"answer":0,"explanation":"အချိန်များနည်းကွာနိုင်ပေမယ့် နေ့တိုင်းမပြတ်လုပ်ခြင်းက သူမ၏ဦးစားပေးပါ။","evidence":"保持接觸比偶爾一次讀很久更重要"},{"id":"q-b2-02","level":"B2","wordId":"b2-02","passage":"小明以為坐在書桌前越久，學習效果就越好，所以常常連續讀四個小時。後來他發現後半段幾乎記不住，便改成每讀半小時休息五分鐘。總時間變短了，能記住的內容卻增加了。","my":"ရှောင်မင်က စာကြည့်စားပွဲမှာကြာကြာထိုင်လေလေ ကောင်းလေလေထင်လို့ လေးနာရီဆက်ဖတ်တယ်။ နောက်ပိုင်းမမှတ်မိလို့ နာရီဝက်ဖတ်၊ ငါးမိနစ်နားသည့်ပုံစံပြောင်းရာ အချိန်တိုပေမယ့် ပိုမှတ်မိလာတယ်။","question":"這段話主要說明什麼？","options":["學習時間越長越好","休息一定浪費時間","調整方法能提高效率","記憶完全不受方法影響"],"optionsMy":["ကြာကြာသင်လေကောင်းလေ","နားခြင်းကအမြဲအချိန်ဖြုန်း","နည်းလမ်းပြောင်းလဲခြင်းကထိရောက်မှုပိုစေ","မှတ်ဉာဏ်ကနည်းလမ်းနဲ့မဆိုင်"],"answer":2,"explanation":"အချိန်ပမာဏထက် နည်းလမ်းပြောင်းခြင်းက ရလဒ်ကိုတိုးတက်စေတယ်လို့ ဆိုပါတယ်။","evidence":"總時間變短了，能記住的內容卻增加了"},{"id":"q-b2-03","level":"B2","wordId":"b2-03","passage":"小華剛開始和臺灣朋友聊天時，總要先在心裡翻譯。隨著日常對話增加，一些常用句子逐漸不需要翻譯就能說出來。不過，遇到不熟悉的話題，他仍然需要更多時間整理想法。","my":"ရှောင်ဟွာက အစပိုင်း တရုတ်လိုပြောတိုင်း စိတ်ထဲဘာသာပြန်ရတယ်။ နေ့စဉ်ပြောဆိုမှုများလာရာ အသုံးများဝါကျတွေကို တိုက်ရိုက်ပြောနိုင်လာပေမယ့် မရင်းနှီးတဲ့အကြောင်းအရာမှာ စဉ်းစားချိန်လိုနေသေးတယ်။","question":"對小華目前的能力，哪個描述最適當？","options":["所有話題都很流利","熟悉情境中反應更自然","已經不需要再練習","完全無法直接說中文"],"optionsMy":["အကြောင်းအရာအားလုံးကျွမ်းကျင်","ရင်းနှီးတဲ့အခြေအနေမှာပိုသဘာဝကျ","ဆက်မလေ့ကျင့်ရတော့","တရုတ်လိုတိုက်ရိုက်လုံးဝမပြောနိုင်"],"answer":1,"explanation":"တိုးတက်မှုက ရင်းနှီးသည့်အကြောင်းအရာတွင် ဖြစ်ပြီး အားလုံးကျွမ်းကျင်သွားပြီ မဟုတ်ပါဘူး။","evidence":"一些常用句子逐漸不需要翻譯"},{"id":"q-b2-04","level":"B2","wordId":"b2-04","passage":"小安很怕考試時遇到難題，因此練習時只挑自己會的題目。老師請他試著完成幾題較難的題目，即使不確定也繼續往下做。幾次以後，他發現不必每一題都答對，反而能更專心處理眼前的問題。","my":"ရှောင်အန်းက ခက်တဲ့မေးခွန်းကြောက်လို့ သိပြီးသားပဲရွေးဖြေတယ်။ ဆရာက ခက်တဲ့မေးခွန်းတွေကို မသေချာလည်း ဆက်ဖြေခိုင်းတယ်။ အကြိမ်အနည်းငယ်ပြီးနောက် တိုင်းမှန်ဖို့မလိုဘူးလို့သိပြီး လက်ရှိမေးခွန်းကို ပိုအာရုံစိုက်နိုင်လာတယ်။","question":"小安後來比較能專心的原因是什麼？","options":["所有題目都變簡單","老師直接告訴他答案","他不再參加考試","不再要求每題都答對"],"optionsMy":["အားလုံးလွယ်လာလို့","ဆရာကအဖြေပေးလို့","စာမေးပွဲမဖြေတော့လို့","တိုင်းမှန်ရန်မတောင်းဆိုတော့လို့"],"answer":3,"explanation":"မသေချာမှုကို လက်ခံပြီး ဆက်လုပ်နိုင်လာတာပါ။ မေးခွန်းအားလုံးလွယ်သွားခြင်း မဟုတ်ပါဘူး။","evidence":"不必每一題都答對"},{"id":"q-b2-05","level":"B2","wordId":"b2-05","passage":"小美考慮搬到離學校較近的房子。新住處的房租雖然比較高，但每天可以少花一小時通勤，也能減少交通費。她沒有立刻決定，而是把增加的房租、節省的費用和時間一起比較。","my":"ရှောင်မေက ကျောင်းနီးအိမ်ပြောင်းဖို့ စဉ်းစားတယ်။ အိမ်လခပိုကြီးပေမယ့် နေ့တိုင်းခရီးသွားချိန်တစ်နာရီနဲ့ ယာဉ်စရိတ်လျော့မယ်။ အိမ်လခ၊ သက်သာငွေနဲ့ အချိန်ကို အတူနှိုင်းယှဉ်တယ်။","question":"小美如何考慮搬家的問題？","options":["同時衡量金錢與時間","只選租金最低的","只看房子的外表","完全不考慮交通"],"optionsMy":["ငွေနဲ့အချိန်ကိုအတူချင့်ချိန်","လခအသက်သာဆုံးသာရွေး","အပြင်ပန်းသာကြည့်","သွားလာရေးလုံးဝမစဉ်းစား"],"answer":0,"explanation":"အိမ်လခတစ်ခုတည်းကို မကြည့်ဘဲ စုစုပေါင်းကုန်ကျစရိတ်နှင့် အချိန်တန်ဖိုးကိုပါ ထည့်တွက်ပါတယ်။","evidence":"費用和時間一起比較"},{"id":"q-b2-06","level":"B2","wordId":"b2-06","passage":"連續幾天的大雨讓市場部分蔬菜的價格上漲。餐廳老闆沒有立刻調高所有餐點的價格，而是暫時更換幾道配菜，並在菜單上說明原因。他希望減少天氣對成本的影響，同時維持客人的用餐體驗。","my":"ရက်ဆက်မိုးကြောင့် ဟင်းသီးဟင်းရွက်ဈေးအချို့တက်တယ်။ ဆိုင်ရှင်က အားလုံးဈေးမတင်ဘဲ အရံဟင်းအချို့ယာယီပြောင်းပြီး မီနူးမှာရှင်းပြတယ်။ ကုန်ကျစရိတ်ကိုထိန်းကာ စားသုံးသူအတွေ့အကြုံကို ထိန်းလိုတယ်။","question":"老闆的做法主要考慮了什麼？","options":["完全停止營業","只追求更高價格","兼顧成本與顧客感受","不讓客人知道任何改變"],"optionsMy":["ဆိုင်လုံးဝပိတ်","ဈေးတင်ရန်သာ","ကုန်ကျစရိတ်နှင့်ဖောက်သည်ခံစားချက်နှစ်မျိုးလုံး","အပြောင်းအလဲလုံးဝမသိစေ"],"answer":2,"explanation":"ကုန်ကျစရိတ်လျှော့ချခြင်းနှင့် ဖောက်သည်အတွေ့အကြုံကို တစ်ပြိုင်နက်ထိန်းခြင်းပါ။ အကြောင်းရင်းကိုလည်း ရှင်းပြထားပါတယ်။","evidence":"同時維持客人的用餐體驗"},{"id":"q-b2-07","level":"B2","wordId":"b2-07","passage":"有些人認為，線上課程方便又便宜，可以完全取代實體課程。小華卻覺得，線上適合反覆觀看講解，實體課則方便即時和同學互動。他安排兩種課程交替進行，依照不同的學習需要使用。","my":"အွန်လိုင်းသင်တန်းက အတန်းကိုလုံးဝအစားထိုးနိုင်တယ်လို့ အချို့ထင်တယ်။ ရှောင်ဟွာက အွန်လိုင်းမှာပြန်ကြည့်နိုင်ပြီး အပြင်အတန်းမှာ ချက်ချင်းအပြန်အလှန်ပြောနိုင်လို့ လိုအပ်ချက်အလိုက် နှစ်မျိုးတွဲသုံးတယ်။","question":"小華對兩種課程的看法是什麼？","options":["實體課完全沒有用","可以互相補充","線上課只能娛樂","必須只選一種"],"optionsMy":["အပြင်အတန်းအသုံးမဝင်","အချင်းချင်းဖြည့်ဆည်းနိုင်","အွန်လိုင်းကဖျော်ဖြေရေးသာ","တစ်မျိုးပဲရွေးရမယ်"],"answer":1,"explanation":"နှစ်မျိုး၏အားသာချက်မတူတာကြောင့် လိုအပ်ချက်အလိုက် တွဲသုံးနိုင်တယ်လို့ မြင်ပါတယ်။","evidence":"依照不同的學習需要使用"},{"id":"q-b2-08","level":"B2","wordId":"b2-08","passage":"大家已經訂好旅館，也買好了火車票。出發前一天，有人提議因為可能下雨就取消。小美說，既然主要安排都完成了，不如先準備室內行程，再依天氣調整，沒有必要現在就全部放棄。","my":"ဟိုတယ်နဲ့ရထားလက်မှတ်စီစဉ်ပြီးပေမယ့် မိုးရွာနိုင်လို့ ဖျက်ဖို့တစ်ယောက်အကြံပေးတယ်။ ရှောင်မေက စီစဉ်ပြီးသားဆိုတော့ အတွင်းခရီးစဉ်အရန်ပြင်ပြီး ရာသီဥတုအလိုက်ပြောင်းဖို့ ပြောတယ်။","question":"小美主張怎麼做？","options":["不管天氣都爬山","馬上取消所有安排","再買一次車票","保留旅行並準備替代行程"],"optionsMy":["မိုးဘယ်လိုဖြစ်ဖြစ်တောင်တက်","အားလုံးချက်ချင်းဖျက်","လက်မှတ်ထပ်ဝယ်","ခရီးကိုထိန်းပြီးအရန်စီစဉ်"],"answer":3,"explanation":"ခရီးမဖျက်ဘဲ အခြေအနေအလိုက် ပြောင်းနိုင်သောအစီအစဉ် ပြင်ဖို့ပါ။ မိုးကိုလျစ်လျူရှုခြင်းမဟုတ်ပါဘူး။","evidence":"先準備室內行程，再依天氣調整"},{"id":"q-b2-09","level":"B2","wordId":"b2-09","passage":"小安以前覺得自己做飯太花時間，後來開始在週末準備幾份餐點。雖然少了一些休息時間，平日卻不用每天想要吃什麼，也比較容易控制花費。他認為這樣的安排值得繼續，但不要求自己每餐都煮。","my":"ရှောင်အန်းက ချက်ပြုတ်ခြင်းအချိန်ကုန်တယ်လို့ထင်ခဲ့ပေမယ့် ပိတ်ရက်မှာ အစာအချို့ကြိုပြင်တယ်။ နားချိန်လျော့ပေမယ့် ရုံးဖွင့်ရက်မှာ စားစရာစဉ်းစားရတာနည်းပြီး ငွေထိန်းနိုင်လို့ ဆက်လုပ်ဖို့တန်တယ်လို့ထင်တယ်။","question":"他為什麼認為這樣值得？","options":["能減少平日的負擔","完全不需要花時間","每一餐都必須自己煮","外食一定不健康"],"optionsMy":["ရုံးဖွင့်ရက်ဝန်ထုပ်လျော့နိုင်","အချိန်လုံးဝမလို","ထမင်းတိုင်းကိုယ်ချက်ရမယ်","အပြင်စာအမြဲမကျန်းမာ"],"answer":0,"explanation":"ပိတ်ရက်အချိန်ပေးခြင်းက ရုံးဖွင့်ရက်စီမံမှုနှင့် ငွေကြေးဝန်ထုပ်ကို လျော့စေလို့တန်ပါတယ်။","evidence":"平日卻不用每天想要吃什麼"},{"id":"q-b2-10","level":"B2","wordId":"b2-10","passage":"這家早餐店不但提供不同份量的餐點，還讓客人選擇要不要加糖。附近學生喜歡它，並不是因為它最便宜，而是大家能依照自己的食量和口味調整。老闆說，讓客人吃得剛好，比一律給大份更重要。","my":"ဒီမနက်စာဆိုင်မှာ အရွယ်အစားမျိုးစုံအပြင် သကြားထည့်မထည့်ပါ ရွေးနိုင်တယ်။ ကျောင်းသားတွေက အသက်သာဆုံးမို့မဟုတ်ဘဲ ကိုယ့်စားနိုင်ပမာဏနဲ့အရသာအလိုက် ပြောင်းနိုင်လို့ ကြိုက်ကြတယ်။","question":"這家店受歡迎的主要原因是什麼？","options":["所有餐點最大份","價格一定最低","能配合個人的需要","每道菜都加很多糖"],"optionsMy":["အားလုံးအကြီးဆုံး","ဈေးအနည်းဆုံးသေချာ","တစ်ဦးချင်းလိုအပ်ချက်နဲ့ကိုက်","ဟင်းတိုင်းသကြားများ"],"answer":2,"explanation":"ပမာဏနှင့် အရသာကို ကိုယ်ပိုင်လိုအပ်ချက်အလိုက် ရွေးနိုင်ခြင်းက အဓိကပါ။ ဈေးအသက်သာဆုံးလို့ မဆိုပါဘူး။","evidence":"依照自己的食量和口味調整"},{"id":"q-b2-11","level":"B2","wordId":"b2-11","passage":"學校鼓勵學生自備杯子，部分店家也提供小額折扣。小美一開始是為了省錢，後來發現每天少用一個紙杯，長期累積也能減少不少垃圾。即使沒有折扣，她現在也會帶自己的杯子。","my":"ကျောင်းက ကိုယ့်ခွက်ယူဖို့တိုက်တွန်းပြီး ဆိုင်အချို့လျှော့ဈေးပေးတယ်။ ရှောင်မေက အစပိုင်းငွေချွေတာဖို့လုပ်ပေမယ့် နေ့တိုင်းစက္ကူခွက်တစ်ခွက်လျှော့ခြင်းက အမှိုက်လျော့စေလို့ လျှော့ဈေးမရှိလည်း ကိုယ့်ခွက်ယူတယ်။","question":"小美的想法發生了什麼變化？","options":["只在折扣大時帶杯子","開始重視減少垃圾","覺得自備杯子沒用","不再購買任何飲料"],"optionsMy":["လျှော့ဈေးများမှယူ","အမှိုက်လျှော့မှုကိုအလေးထားလာ","ကိုယ့်ခွက်အသုံးမဝင်ထင်","အရည်လုံးဝမဝယ်တော့"],"answer":1,"explanation":"အစပိုင်းငွေချွေတာခြင်းမှ ပတ်ဝန်းကျင်အကျိုးကိုပါ အလေးထားလာခြင်းပါ။","evidence":"即使沒有折扣，她現在也會帶自己的杯子"},{"id":"q-b2-12","level":"B2","wordId":"b2-12","passage":"小華想買一個每天使用的背包。他看了價格，也比較布料、拉鍊和售後服務。最後選的並不是最貴的款式，而是在預算內品質穩定、背起來舒服的一款。他認為適合自己的產品，未必需要最高的價格。","my":"ရှောင်ဟွာက နေ့တိုင်းသုံးမည့်ကျောပိုးအိတ်ကို ဈေးအပြင် အထည်၊ ဇစ်နဲ့ဝယ်ပြီးဝန်ဆောင်မှုပါနှိုင်းယှဉ်တယ်။ အသုံးစရိတ်အတွင်း အရည်အသွေးကောင်း၊ သက်သာတဲ့အိတ်ကို ရွေးပြီး ဈေးအကြီးဆုံးဖြစ်ရန်မလိုဟု ထင်တယ်။","question":"小華的消費原則是什麼？","options":["最貴的就是最好的","完全不考慮價格","只看品牌名稱","在預算內兼顧品質與需要"],"optionsMy":["အကြီးဆုံးကအကောင်းဆုံး","ဈေးလုံးဝမစဉ်းစား","အမှတ်တံဆိပ်သာကြည့်","အသုံးစရိတ်အတွင်းအရည်အသွေးနှင့်လိုအပ်ချက်ကိုချိန်"],"answer":3,"explanation":"အသုံးစရိတ်၊ အရည်အသွေး၊ ကိုယ်ပိုင်လိုအပ်ချက်ကို အတူချိန်တာပါ။ ဈေးကြီးလေကောင်းလေဟု မထင်ပါဘူး။","evidence":"在預算內品質穩定"},{"id":"q-b1-13","level":"B1","wordId":"b1-13","passage":"小安今天遲到了。老師以為他睡過頭，可是他說自己很早就出門了，只是路上公車壞了，等下一班車等了二十分鐘。老師聽完才了解原因。","my":"ရှောင်အန်းနောက်ကျလို့ ဆရာက အိပ်ရာထနောက်ကျတယ်ထင်တယ်။ တကယ်တော့ စောစောထွက်ခဲ့ပေမယ့် ဘတ်စ်ကားပျက်လို့ နောက်တစ်စီးကို မိနစ်နှစ်ဆယ်စောင့်ရတာပါ။","question":"小安遲到的原因是什麼？","options":["出門太晚","公車出了問題","不知道上課時間","走錯了教室"],"optionsMy":["အိမ်ကထွက်တာနောက်ကျ","ဘတ်စ်ကားပြဿနာဖြစ်","အတန်းချိန်မသိ","စာသင်ခန်းမှားသွား"],"answer":1,"explanation":"「只是」နောက်က ဘတ်စ်ကားပျက်ကြောင်းဟာ တကယ့်အကြောင်းရင်းပါ။ အိပ်ရာထနောက်ကျတယ်ဆိုတာ ဆရာ့အထင်ပါ။","evidence":"路上公車壞了"},{"id":"q-b1-14","level":"B1","wordId":"b1-14","passage":"小美以前每天都喝含糖飲料。這個月她改成自己帶水，結果月底多存了五百元。她沒有換工作，也沒有增加工作時間。","my":"ရှောင်မေက အရင် နေ့တိုင်းသကြားပါတဲ့အရည်သောက်တယ်။ ဒီလ ရေကိုယ်တိုင်ယူလာတော့ လကုန်မှာ ဒေါ်လာငါးရာ ပိုစုနိုင်တယ်။ အလုပ်နဲ့ အလုပ်ချိန်က မပြောင်းဘူး။","question":"小美多存了錢，主要是什麼改變的結果？","options":["工作時間變長","朋友幫她付錢","薪水提高","少買含糖飲料"],"optionsMy":["အလုပ်ချိန်ပိုရှည်","သူငယ်ချင်းကပေး","လစာတိုး","သကြားပါတဲ့အရည်ဝယ်တာနည်းသွား"],"answer":3,"explanation":"အရည်ဝယ်တာနည်းသွားလို့ ငွေပိုစုနိုင်တာပါ။ လစာတိုးတယ်လို့ မပြောထားပါ။","evidence":"改成自己帶水"},{"id":"q-b1-15","level":"B1","wordId":"b1-15","passage":"老師請同學兩人一組，輪流介紹自己喜歡的餐廳。他說不用查很難的詞，也不用寫長報告，這個活動的目的是練習把想法說清楚。","my":"ဆရာက နှစ်ယောက်တစ်ဖွဲ့စီ ကြိုက်တဲ့ဆိုင်ကို အလှည့်ကျမိတ်ဆက်ခိုင်းတယ်။ ခက်တဲ့စကားလုံးရှာဖို့၊ အစီရင်ခံစာရှည်ရေးဖို့မလိုဘူး။ ရည်ရွယ်ချက်က ကိုယ့်အမြင်ကို ရှင်းရှင်းပြောနိုင်ဖို့ပါ။","question":"這個活動主要想讓學生練習什麼？","options":["清楚表達想法","記住餐廳地址","寫長篇報告","查很多難詞"],"optionsMy":["အတွေးကိုရှင်းရှင်းပြော","ဆိုင်လိပ်စာမှတ်","အစီရင်ခံစာရှည်ရေး","ခက်တဲ့စကားလုံးများများရှာ"],"answer":0,"explanation":"「目的」နောက်က စကားဟာ လှုပ်ရှားမှုလုပ်ရတဲ့ ရည်ရွယ်ချက်ပါ။","evidence":"練習把想法說清楚"},{"id":"q-b1-16","level":"B1","wordId":"b1-16","passage":"小文想找餐廳工作。他擔心自己沒有經驗，老闆卻說可以先從整理桌子開始，熟悉以後再學點餐，只要願意學就可以來試試。","my":"ရှောင်ဝင်က ဆိုင်အလုပ်လုပ်ချင်ပေမယ့် အတွေ့အကြုံမရှိလို့ စိတ်ပူတယ်။ ဆိုင်ရှင်က စားပွဲရှင်းတာကစပြီး နောက်မှအော်ဒါယူတာသင်လို့ရတယ်၊ သင်ချင်ရင် လာစမ်းလို့ရတယ်လို့ပြောတယ်။","question":"老闆對沒有經驗的人有什麼態度？","options":["一定不錄用","必須先會點餐","願意讓他慢慢學","只能做一天"],"optionsMy":["လုံးဝမခန့်","အော်ဒါယူတတ်ပြီးသားဖြစ်ရ","ဖြည်းဖြည်းသင်ခွင့်ပေး","တစ်ရက်ပဲလုပ်လို့ရ"],"answer":2,"explanation":"စားပွဲရှင်းတာကစပြီး သင်လို့ရလို့ အတွေ့အကြုံမရှိသူကိုလည်း အခွင့်အရေးပေးတယ်။","evidence":"只要願意學就可以來試試"},{"id":"q-b1-17","level":"B1","wordId":"b1-17","passage":"社區每星期六都有免費的中文聊天活動。小安平日上班很忙，所以決定利用週末參加。他覺得這是認識附近鄰居、練習說話的好機會。","my":"ရပ်ကွက်မှာ စနေနေ့တိုင်း အခမဲ့တရုတ်စကားဝိုင်းရှိတယ်။ ရှောင်အန်းက ရုံးဖွင့်ရက်အလုပ်များလို့ ပိတ်ရက်တက်မယ်။ အိမ်နီးချင်းတွေသိကျွမ်းပြီး စကားပြောလေ့ကျင့်ဖို့ အခွင့်အရေးကောင်းလို့ထင်တယ်။","question":"小安希望透過活動得到什麼？","options":["找到新的辦公室","認識鄰居並練習中文","每天不用上班","學習付費課程"],"optionsMy":["ရုံးအသစ်ရှာ","အိမ်နီးချင်းသိကျွမ်းပြီးတရုတ်လိုလေ့ကျင့်","နေ့တိုင်းအလုပ်မသွားရ","အခကြေးငွေပေးရတဲ့အတန်းတက်"],"answer":1,"explanation":"သူ့ရည်ရွယ်ချက်နှစ်ခုက အိမ်နီးချင်းသိကျွမ်းဖို့နဲ့ စကားပြောလေ့ကျင့်ဖို့ပါ။","evidence":"認識附近鄰居、練習說話"},{"id":"q-b1-18","level":"B1","wordId":"b1-18","passage":"小美以前把生字寫十次，隔天卻常常忘記。現在她換了方法：先聽例句，再用生字說自己的事情。她發現這樣比較容易記住。","my":"ရှောင်မေက အရင် စကားလုံးကို ဆယ်ခါရေးပေမယ့် နောက်နေ့မေ့တတ်တယ်။ အခု ဥပမာဝါကျနားထောင်ပြီး စကားလုံးနဲ့ ကိုယ့်အကြောင်းပြောတဲ့နည်းကို ပြောင်းလိုက်တော့ ပိုမှတ်မိတယ်။","question":"小美現在用什麼方法記生字？","options":["只看中文電影","把字寫更多次","完全不看例句","聽例句後自己造句"],"optionsMy":["တရုတ်ရုပ်ရှင်ပဲကြည့်","စာလုံးပိုများများရေး","ဥပမာလုံးဝမကြည့်","ဥပမာနားထောင်ပြီးကိုယ့်ဝါကျပြော"],"answer":3,"explanation":"နည်းအသစ်က နားထောင်ပြီး ကိုယ်တိုင်အသုံးချတာပါ။ ရေးတဲ့အကြိမ်တိုးတာ မဟုတ်ပါ။","evidence":"先聽例句，再用生字說自己的事情"},{"id":"q-b1-19","level":"B1","wordId":"b1-19","passage":"小華能和朋友用中文聊天，可是看學校通知時，常常需要別人幫忙。他想提高閱讀能力，所以每天選一則短通知，先找時間、地點和要做的事。","my":"ရှောင်ဟွာက တရုတ်လိုစကားပြောနိုင်ပေမယ့် ကျောင်းကြေညာချက်ဖတ်ရင် အကူအညီလိုတယ်။ စာဖတ်စွမ်းရည်တိုးဖို့ နေ့တိုင်း ကြေညာချက်တိုတစ်ခုက အချိန်၊ နေရာနဲ့ လုပ်ရမယ့်ကိစ္စကို ရှာတယ်။","question":"小華目前最想加強哪一種能力？","options":["看懂生活通知","和朋友打招呼","唱中文歌曲","記住朋友名字"],"optionsMy":["နေ့စဉ်ကြေညာချက်နားလည်","သူငယ်ချင်းနှုတ်ဆက်","တရုတ်သီချင်းဆို","သူငယ်ချင်းနာမည်မှတ်"],"answer":0,"explanation":"သူက စကားပြောတတ်ပြီးသား၊ အခက်အခဲက ကြေညာချက်ဖတ်ခြင်းပါ။","evidence":"想提高閱讀能力"},{"id":"q-b1-20","level":"B1","wordId":"b1-20","passage":"明天有小考。小安沒有一直學新詞，而是先把這星期錯過的題目再做一次，還用不熟的生字各說一句話。他覺得這樣複習比較有效。","my":"မနက်ဖြန်စာမေးပွဲတိုရှိတယ်။ ရှောင်အန်းက စကားလုံးအသစ်ပဲဆက်မသင်ဘဲ ဒီအပတ်မှားခဲ့တဲ့မေးခွန်းတွေကို ပြန်ဖြေပြီး မရသေးတဲ့စကားလုံးနဲ့ တစ်ကြောင်းစီပြောတယ်။ ဒီလိုပြန်လေ့လာတာ ပိုထိရောက်လို့ထင်တယ်။","question":"小安怎麼準備明天的小考？","options":["只學沒看過的詞","把所有課本收起來","重做錯題並運用生字","只讀下星期的課文"],"optionsMy":["မမြင်ဖူးတဲ့စကားလုံးပဲသင်","စာအုပ်အားလုံးသိမ်း","မှားတဲ့ပုစ္ဆာပြန်ဖြေပြီးစကားလုံးအသုံးချ","နောက်အပတ်သင်ခန်းစာပဲဖတ်"],"answer":2,"explanation":"「複習」မှာ သင်ပြီးသားကို ပြန်ကြည့်ပြီး မရသေးတာကို လေ့ကျင့်ပါတယ်။","evidence":"把這星期錯過的題目再做一次"},{"id":"q-b1-21","level":"B1","wordId":"b1-21","passage":"小文看不懂表格上的一句話，就請老師解釋。老師沒有換成更難的詞，而是用買早餐的例子說明。小文聽完說，現在知道該怎麼填了。","my":"ရှောင်ဝင်က ဖောင်မှာပါတဲ့ဝါကျကို နားမလည်လို့ ဆရာ့ကိုရှင်းပြခိုင်းတယ်။ ဆရာက ပိုခက်တဲ့စကားမသုံးဘဲ မနက်စာဝယ်တဲ့ဥပမာနဲ့ရှင်းပြတော့ ဘယ်လိုဖြည့်ရမလဲ နားလည်သွားတယ်။","question":"老師用了什麼方式幫助小文？","options":["請他放棄填表","用生活例子解釋","要求他背下整張表","只給他更多表格"],"optionsMy":["ဖောင်ဖြည့်တာလက်လျှော့ခိုင်း","နေ့စဉ်ဥပမာနဲ့ရှင်းပြ","ဖောင်တစ်ခုလုံးကျက်ခိုင်း","ဖောင်ထပ်ပေးရုံပဲ"],"answer":1,"explanation":"မနက်စာဝယ်တာဟာ ရင်းနှီးတဲ့နေ့စဉ်ဥပမာဖြစ်လို့ နားလည်ဖို့ကူညီတယ်။","evidence":"用買早餐的例子說明"},{"id":"q-b1-22","level":"B1","wordId":"b1-22","passage":"點餐時，小美不知道「不要香菜」怎麼說，就指著圖片說：「這個菜，我不要加。」店員聽懂了。朋友說，詞不夠的時候，也可以用簡單的話表達。","my":"အော်ဒါမှာတဲ့အခါ ရှောင်မေက နံနံပင်မထည့်ဖို့ ဘယ်လိုပြောရမလဲ မသိလို့ ပုံကိုညွှန်ပြီး ဒီအရွက်မထည့်ချင်ဘူးလို့ပြောတယ်။ ဆိုင်ဝန်ထမ်းနားလည်တယ်။ သူငယ်ချင်းက ရိုးရိုးစကားနဲ့လည်း ဖော်ပြလို့ရတယ်လို့ပြောတယ်။","question":"這件事告訴我們什麼？","options":["每個詞都會才能說話","點餐一定要寫字","不懂的時候不能開口","簡單的說法也能讓人理解"],"optionsMy":["စကားလုံးအားလုံးသိမှပြောလို့ရ","အော်ဒါမှာရင်စာရေးရ","မသိရင်မပြောရ","ရိုးရှင်းတဲ့စကားနဲ့လည်းနားလည်စေနိုင်"],"answer":3,"explanation":"သူက စကားလုံးမသိပေမယ့် ပုံနဲ့ရိုးရှင်းတဲ့စကားကိုသုံးပြီး လိုချင်တာကို ပြောနိုင်ခဲ့တယ်။","evidence":"用簡單的話表達"},{"id":"q-b1-23","level":"B1","wordId":"b1-23","passage":"三位同學要一起做報告。小安想介紹夜市，小美想介紹早餐。討論之後，大家決定用「臺灣的一天」當主題，兩種食物都可以介紹。","my":"ကျောင်းသားသုံးယောက် အစီရင်ခံစာအတူလုပ်မယ်။ ရှောင်အန်းက ညဈေး၊ ရှောင်မေက မနက်စာကို မိတ်ဆက်ချင်တယ်။ ဆွေးနွေးပြီးတော့ ထိုင်ဝမ်ရဲ့တစ်နေ့တာဆိုတဲ့ခေါင်းစဉ်နဲ့ နှစ်မျိုးလုံးမိတ်ဆက်ဖို့ ဆုံးဖြတ်တယ်။","question":"討論後，大家做了什麼決定？","options":["把兩個想法放進同一主題","各自交一份報告","只介紹夜市","取消這次報告"],"optionsMy":["အကြံနှစ်ခုကိုခေါင်းစဉ်တစ်ခုထဲထည့်","တစ်ယောက်တစ်စောင်စီတင်","ညဈေးပဲမိတ်ဆက်","အစီရင်ခံစာပယ်ဖျက်"],"answer":0,"explanation":"ခေါင်းစဉ်အသစ်က အကြံနှစ်ခုလုံးကို ထည့်နိုင်ပါတယ်။","evidence":"兩種食物都可以介紹"},{"id":"q-b1-24","level":"B1","wordId":"b1-24","passage":"小華第一次去這家圖書館，不了解借書規定。他先看了門口的說明，再向服務人員確認，才知道一次可以借五本，兩個星期內要還。","my":"ရှောင်ဟွာက ဒီစာကြည့်တိုက်ကို ပထမဆုံးသွားလို့ စာအုပ်ငှားစည်းကမ်းမသိဘူး။ ဝင်ပေါက်စာကိုဖတ်ပြီး ဝန်ထမ်းကိုမေးတော့ တစ်ကြိမ်ငါးအုပ်၊ နှစ်ပတ်အတွင်းပြန်အပ်ရမယ်လို့သိတယ်။","question":"小華為什麼先看說明、再問工作人員？","options":["他想在圖書館工作","他已經借了太多書","他想了解借書規定","他找不到回家的路"],"optionsMy":["စာကြည့်တိုက်မှာအလုပ်လုပ်ချင်","စာအုပ်အများကြီးငှားထားပြီး","စာအုပ်ငှားစည်းကမ်းသိချင်","အိမ်ပြန်လမ်းမတွေ့"],"answer":2,"explanation":"မေးတာက စည်းကမ်းကို သေချာနားလည်ချင်လို့ပါ။","evidence":"不了解借書規定"},{"id":"q-b1-25","level":"B1","wordId":"b1-25","passage":"小安想申請宿舍。通知寫著，先填表，再交學生證影本，星期五以前送到辦公室。小安填好表，卻發現還沒印學生證，決定下午先去影印。","my":"ရှောင်အန်းက အဆောင်လျှောက်ချင်တယ်။ ကြေညာချက်မှာ ဖောင်ဖြည့်ပြီး ကျောင်းသားကတ်မိတ္တူနဲ့ သောကြာမတိုင်ခင် ရုံးကိုတင်ဖို့ရေးထားတယ်။ ဖောင်ဖြည့်ပြီးပေမယ့် ကတ်မိတ္တူမရှိသေးလို့ နေ့လယ်သွားကူးမယ်။","question":"小安送出申請前還需要做什麼？","options":["重新申請學生證","影印學生證","先搬進宿舍","等到下星期五"],"optionsMy":["ကျောင်းသားကတ်အသစ်လျှောက်","ကျောင်းသားကတ်မိတ္တူကူး","အဆောင်အရင်ပြောင်းဝင်","နောက်သောကြာအထိစောင့်"],"answer":1,"explanation":"ဖောင်ပြီးပြီ၊ လိုနေသေးတာက ကျောင်းသားကတ်မိတ္တူပါ။","evidence":"還沒印學生證"},{"id":"q-b1-26","level":"B1","wordId":"b1-26","passage":"學校週六有做菜活動。小美本來不想參加，因為她不會做菜。看到通知說初學者也歡迎，而且會有人一步一步教，她就報名了。","my":"စနေနေ့ ကျောင်းမှာ ချက်ပြုတ်လှုပ်ရှားမှုရှိတယ်။ ရှောင်မေက မချက်တတ်လို့ မတက်ချင်ဘူး။ အစသင်သူလည်းတက်လို့ရပြီး တစ်ဆင့်ချင်းသင်ပေးမယ်လို့ ဖတ်ရတော့ စာရင်းပေးလိုက်တယ်။","question":"什麼讓小美改變主意去參加？","options":["活動不用做菜","只有朋友可以參加","她已經很會做菜","初學者也有人帶著學"],"optionsMy":["ချက်ပြုတ်စရာမလို","သူငယ်ချင်းတွေပဲပါဝင်လို့ရ","သူမချက်ပြုတ်ကျွမ်းကျင်ပြီး","အစသင်သူကိုလည်းသင်ပေးမယ်"],"answer":3,"explanation":"အစသင်သူကို သင်ပေးမယ်လို့သိတော့ မချက်တတ်တဲ့စိုးရိမ်မှု လျော့သွားတယ်။","evidence":"會有人一步一步教"},{"id":"q-b1-27","level":"B1","wordId":"b1-27","passage":"報告星期五要交。小文星期三已經寫完內容，但還沒加圖片，也沒檢查錯字。他打算星期四做完這兩件事，才算真正完成報告。","my":"အစီရင်ခံစာကို သောကြာတင်ရမယ်။ ရှောင်ဝင်က ဗုဒ္ဓဟူးမှာ စာရေးပြီးပေမယ့် ပုံမထည့်၊ စာလုံးပေါင်းမစစ်ရသေးဘူး။ ကြာသပတေးမှာ နှစ်ခုလုံးလုပ်ပြီးမှ အပြည့်အစုံပြီးမယ်။","question":"星期三時，小文的報告怎麼樣？","options":["內容寫好了，還有整理工作","已經全部完成並交出","一個字都還沒寫","只剩下決定主題"],"optionsMy":["စာရေးပြီးပြီပြင်ဆင်စရာရှိသေး","အကုန်ပြီးတင်ပြီးပြီ","တစ်လုံးမှမရေးရသေး","ခေါင်းစဉ်ရွေးဖို့ပဲကျန်"],"answer":0,"explanation":"စာရေးပြီးတာနဲ့ အစီရင်ခံစာတစ်ခုလုံး ပြီးတာကို ခွဲသိရပါတယ်။","evidence":"還沒加圖片，也沒檢查錯字"},{"id":"q-b1-28","level":"B1","wordId":"b1-28","passage":"小美明天要去面試，擔心忘記帶資料。她把資料放進包包，又在手機設了提醒，寫著「出門前檢查證件」。她希望明天不用匆忙找東西。","my":"ရှောင်မေ မနက်ဖြန်အင်တာဗျူးသွားရမယ်။ စာရွက်စာတမ်းမေ့မှာစိုးလို့ အိတ်ထဲထည့်ပြီး ဖုန်းမှာ မထွက်ခင်အထောက်အထားစစ်ဖို့ သတိပေးချက်ထားတယ်။ မနက်ဖြန်အလျင်စလိုမရှာချင်ဘူး။","question":"小美設手機提醒的目的是什麼？","options":["請朋友替她面試","改變面試地點","出門前記得檢查證件","延後準備資料"],"optionsMy":["သူငယ်ချင်းကိုအစားအင်တာဗျူးခိုင်း","အင်တာဗျူးနေရာပြောင်း","မထွက်ခင်အထောက်အထားစစ်ဖို့မှတ်မိ","စာရွက်ပြင်ဆင်ချိန်နောက်ရွှေ့"],"answer":2,"explanation":"သတိပေးချက်က အထောက်အထားတွေ မမေ့အောင် ကူညီဖို့ပါ။","evidence":"出門前檢查證件"},{"id":"q-b1-29","level":"B1","wordId":"b1-29","passage":"小安在網路上訂了一個包包，收到後發現顏色不對。他沒有立刻再買一個，而是先聯絡店家，提供訂單號碼，詢問能不能換貨。","my":"ရှောင်အန်းက အွန်လိုင်းအိတ်မှာပြီး ရောက်လာတဲ့အရောင်မှားနေတာတွေ့တယ်။ နောက်တစ်လုံးချက်ချင်းမဝယ်ဘဲ ဆိုင်ကိုဆက်သွယ်၊ အော်ဒါနံပါတ်ပေးပြီး လဲလို့ရမလားမေးတယ်။","question":"小安聯絡店家是為了什麼？","options":["詢問換貨方式","申請在店裡工作","訂購更多同色包包","取消所有訂單"],"optionsMy":["ပစ္စည်းလဲနည်းမေး","ဆိုင်အလုပ်လျှောက်","အရောင်တူအိတ်ထပ်မှာ","အော်ဒါအားလုံးပယ်ဖျက်"],"answer":0,"explanation":"ရလာတဲ့အရောင်မှားလို့ ပစ္စည်းလဲဖို့ ဆက်သွယ်တာပါ။","evidence":"詢問能不能換貨"},{"id":"q-b1-30","level":"B1","wordId":"b1-30","passage":"小文和朋友約下午三點見面。出門前，他傳訊息確認地點，才發現朋友說的是車站前面的咖啡店，不是學校旁邊那家。他及時改了路線。","my":"ရှောင်ဝင်က သူငယ်ချင်းနဲ့ ညနေသုံးနာရီချိန်းထားတယ်။ မထွက်ခင်နေရာကိုစာပို့စစ်တော့ ကျောင်းဘေးဆိုင်မဟုတ်ဘဲ ဘူတာရှေ့ကော်ဖီဆိုင်မှန်းသိပြီး လမ်းကြောင်းအချိန်မီပြောင်းလိုက်တယ်။","question":"出門前確認地點，幫小文避免了什麼？","options":["忘記帶錢","去錯咖啡店","太早起床","錯過學校考試"],"optionsMy":["ပိုက်ဆံမေ့","ကော်ဖီဆိုင်မှားသွား","အိပ်ရာအရမ်းစောထ","ကျောင်းစာမေးပွဲလွတ်"],"answer":1,"explanation":"မစစ်ခဲ့ရင် ကျောင်းဘေးဆိုင်ကို သွားမိနိုင်တယ်။","evidence":"不是學校旁邊那家"},{"id":"q-b1-31","level":"B1","wordId":"b1-31","passage":"今天的戶外電影因為大雨取消了。主辦單位說，已經買票的人可以退票，之後如果有新活動，會另外通知。小美因此不用出門看電影了。","my":"ဒီနေ့ပြင်ပရုပ်ရှင်ပွဲကို မိုးကြီးလို့ပယ်ဖျက်တယ်။ လက်မှတ်ဝယ်ထားသူတွေ ငွေပြန်ရနိုင်ပြီး နောက်ပွဲရှိရင် သီးခြားအကြောင်းကြားမယ်။ ရှောင်မေ ဒီနေ့ရုပ်ရှင်သွားကြည့်စရာမလိုတော့ဘူး။","question":"「取消」在這裡是什麼意思？","options":["改成室內舉行","一定改到明天","今天不再舉行","只晚半小時開始"],"optionsMy":["အိမ်တွင်းပြောင်းကျင်းပ","မနက်ဖြန်သို့သေချာပြောင်း","ဒီနေ့မကျင်းပတော့","နာရီဝက်ပဲနောက်ကျစ"],"answer":2,"explanation":"ပွဲကို မကျင်းပတော့ဘူး။ နေရာပြောင်းတာ၊ နာရီဝက်နောက်ရွှေ့တာ မဟုတ်ပါ။","evidence":"不用出門看電影了"},{"id":"q-b1-32","level":"B1","wordId":"b1-32","passage":"會議原本下午兩點開始，因為前一個活動還沒結束，延後到兩點半。小安收到通知後，利用多出來的時間整理資料，仍然會參加會議。","my":"အစည်းအဝေးက မူလနှစ်နာရီ၊ ရှေ့ပွဲမပြီးသေးလို့ နှစ်နာရီခွဲကို နောက်ရွှေ့တယ်။ ရှောင်အန်းက ပိုရတဲ့အချိန်မှာ စာရွက်တွေစီစဉ်ပြီး အစည်းအဝေးတက်မယ်။","question":"這次會議有什麼改變？","options":["提早半小時","完全取消","換到下星期","晚半小時開始"],"optionsMy":["နာရီဝက်စော","လုံးဝပယ်ဖျက်","နောက်အပတ်ပြောင်း","နာရီဝက်နောက်ကျစ"],"answer":3,"explanation":"နှစ်နာရီကနေ နှစ်နာရီခွဲဖြစ်လို့ နာရီဝက်နောက်ရွှေ့တာပါ။","evidence":"延後到兩點半"},{"id":"q-b1-33","level":"B1","wordId":"b1-33","passage":"小美預約星期六下午剪頭髮，後來下午有事，就打電話問能不能提前。店員說早上十點有空，她同意改到那個時間，日期沒有變。","my":"ရှောင်မေက စနေနေ့လယ်ဆံပင်ညှပ်ဖို့ချိန်းထားတယ်။ နေ့လယ်မအားတော့လို့ စောလို့ရမလားမေးတယ်။ မနက်ဆယ်နာရီအားလို့ အဲဒီအချိန်ပြောင်းတယ်၊ ရက်ကမပြောင်းဘူး။","question":"小美把預約改成什麼時候？","options":["同一天上午","前一天晚上","下一個星期六","同一天下午更晚"],"optionsMy":["အဲဒီနေ့မနက်","ရှေ့တစ်ရက်ည","နောက်စနေနေ့","အဲဒီနေ့နေ့လယ်ပိုနောက်ကျ"],"answer":0,"explanation":"「提前」က စောအောင်ရွှေ့တာ၊ ဒီပုဒ်မှာ ရက်မပြောင်းဘဲ မနက်ပိုင်းပြောင်းပါတယ်။","evidence":"早上十點有空"},{"id":"q-b1-34","level":"B1","wordId":"b1-34","passage":"小安要去超市買菜。室友問他能不能順便買一瓶牛奶，小安說沒問題，因為牛奶也在同一家超市。他不用另外去別的地方。","my":"ရှောင်အန်းက စူပါမားကတ်မှာ ဟင်းချက်စရာဝယ်မယ်။ အခန်းဖော်က နွားနို့ပါ တစ်လက်စတည်းဝယ်ပေးဖို့ပြောတော့ ဆိုင်တစ်ဆိုင်တည်းမှာရှိလို့ ရတယ်လို့ပြောတယ်။ တခြားနေရာထပ်မသွားရဘူး။","question":"小安原本出門要做什麼？","options":["只幫室友買牛奶","到超市買菜","去找新的室友","到另一家店上班"],"optionsMy":["အခန်းဖော်အတွက်နွားနို့ပဲဝယ်","စူပါမားကတ်မှာဟင်းချက်စရာဝယ်","အခန်းဖော်အသစ်ရှာ","အခြားဆိုင်အလုပ်သွား"],"answer":1,"explanation":"အဓိကက ဟင်းချက်စရာဝယ်တာ၊ နွားနို့က「順便」တစ်လက်စတည်းဝယ်တာပါ။","evidence":"要去超市買菜"},{"id":"q-b1-35","level":"B1","wordId":"b1-35","passage":"小文抱著一大箱東西，走到門口時沒辦法拿鑰匙。他對室友說：「麻煩你幫我開一下門。」室友開門後，他說了謝謝。","my":"ရှောင်ဝင်က သေတ္တာကြီးမထားလို့ တံခါးဝမှာ သော့မယူနိုင်ဘူး။ အခန်းဖော်ကို တစ်ဆိတ်လောက်တံခါးဖွင့်ပေးဖို့ပြောပြီး ဖွင့်ပေးတော့ ကျေးဇူးတင်တယ်လို့ပြောတယ်။","question":"小文說「麻煩你」是在做什麼？","options":["責怪室友關門","表示不想回家","禮貌地請求幫忙","拒絕室友的要求"],"optionsMy":["တံခါးပိတ်လို့အပြစ်တင်","အိမ်မပြန်ချင်လို့ပြော","ယဉ်ကျေးစွာအကူအညီတောင်း","အခန်းဖော်တောင်းဆိုတာငြင်း"],"answer":2,"explanation":"「麻煩你＋動作」က ယဉ်ကျေးစွာ အကူအညီတောင်းတဲ့ပြောပုံပါ။","evidence":"麻煩你幫我開一下門"},{"id":"q-b1-36","level":"B1","wordId":"b1-36","passage":"小安打電話給朋友，先問：「你現在方便說話嗎？」朋友正在搭車，旁邊很吵，請他十分鐘後再打。小安答應晚一點聯絡。","my":"ရှောင်အန်းက သူငယ်ချင်းကိုဖုန်းခေါ်ပြီး အခုစကားပြောလို့အဆင်ပြေလားမေးတယ်။ သူငယ်ချင်းက ကားပေါ်မှာဆူညံလို့ ဆယ်မိနစ်နောက်မှခေါ်ပေးဖို့ပြောတော့ သဘောတူတယ်။","question":"小安為什麼要晚一點再打？","options":["他忘了朋友的電話","朋友不想再聯絡","電話費太貴","朋友目前不適合通話"],"optionsMy":["ဖုန်းနံပါတ်မေ့","သူငယ်ချင်းဆက်မသွယ်ချင်","ဖုန်းခဈေးကြီး","လက်ရှိဖုန်းပြောဖို့အဆင်မပြေ"],"answer":3,"explanation":"ကားပေါ်ဆူညံတာကြောင့် လက်ရှိအချိန်မှာ စကားပြောရအဆင်မပြေပါ။","evidence":"旁邊很吵"},{"id":"q-b1-37","level":"B1","wordId":"b1-37","passage":"雨後路面很滑，小美本來想騎車趕去車站。朋友提醒她，晚幾分鐘還能搭下一班車，為了安全不要騎太快。她決定慢慢騎。","my":"မိုးပြီးလမ်းချော်နေလို့ ရှောင်မေက ဘူတာကို ဆိုင်ကယ်အမြန်စီးချင်တယ်။ သူငယ်ချင်းက နောက်ကားစီးလို့ရတာကြောင့် ဘေးကင်းဖို့ မမြန်နဲ့လို့သတိပေးတော့ ဖြည်းဖြည်းစီးဖို့ဆုံးဖြတ်တယ်။","question":"小美最後怎麼做？","options":["為了安全放慢速度","為了趕車騎更快","請朋友取消所有車班","在路中央等雨停"],"optionsMy":["ဘေးကင်းဖို့နှေးနှေးစီး","ကားမီဖို့ပိုမြန်စီး","ကားအားလုံးပယ်ဖျက်ခိုင်း","လမ်းလယ်မိုးတိတ်တာစောင့်"],"answer":0,"explanation":"သူက အချိန်နည်းနည်းနောက်ကျတာထက် ဘေးကင်းမှုကို ဦးစားပေးတယ်။","evidence":"決定慢慢騎"},{"id":"q-b1-38","level":"B1","wordId":"b1-38","passage":"小華看了兩間房子。一間便宜，但是樓下的車很多；另一間貴一點，周圍安靜，也靠近公園。他需要在家讀書，最後選了環境安靜的那間。","my":"ရှောင်ဟွာက အိမ်နှစ်ခန်းကြည့်တယ်။ တစ်ခန်းဈေးသက်သာပေမယ့် အောက်မှာကားများတယ်။ နောက်တစ်ခန်းနည်းနည်းဈေးကြီးပေမယ့် တိတ်ဆိတ်ပြီးပန်းခြံနီးတယ်။ အိမ်မှာစာဖတ်ဖို့လိုလို့ တိတ်ဆိတ်တဲ့အခန်းရွေးတယ်။","question":"小華選房時最重視什麼？","options":["樓下車輛很多","適合讀書的環境","一定要最便宜","離公園越遠越好"],"optionsMy":["အောက်မှာကားများ","စာဖတ်ဖို့သင့်တဲ့ပတ်ဝန်းကျင်","ဈေးအသက်သာဆုံးဖြစ်ရ","ပန်းခြံနဲ့ပိုဝေးလေကောင်းလေ"],"answer":1,"explanation":"အိမ်မှာစာဖတ်ဖို့လိုတဲ့အတွက် တိတ်ဆိတ်မှုကို အဓိကထားရွေးပါတယ်။","evidence":"需要在家讀書"},{"id":"q-b1-39","level":"B1","wordId":"b1-39","passage":"班上準備辦聚餐。小安負責訂餐廳，小美負責通知同學，小文負責記錄人數。老師請大家先把自己負責的部分做好，再一起確認。","my":"အတန်းက စားပွဲလုပ်မယ်။ ရှောင်အန်းက ဆိုင်ဘိုကင်၊ ရှောင်မေက အတန်းဖော်တွေကိုအကြောင်းကြား၊ ရှောင်ဝင်က လူဦးရေမှတ်ဖို့တာဝန်ယူတယ်။ ကိုယ့်အပိုင်းအရင်လုပ်ပြီးမှ အတူစစ်ဖို့ဆရာပြောတယ်။","question":"小美應該先做哪一件事？","options":["記錄餐廳收入","替老師寫報告","通知同學聚餐消息","決定所有人的工作"],"optionsMy":["ဆိုင်ဝင်ငွေမှတ်","ဆရာ့အတွက်အစီရင်ခံစာရေး","အတန်းဖော်တွေကိုစားပွဲအကြောင်းကြား","လူတိုင်းရဲ့အလုပ်ဆုံးဖြတ်"],"answer":2,"explanation":"「負責」နောက်ကအလုပ်ကို လူနာမည်နဲ့ ချိတ်ဖတ်ပါ။ ရှောင်မေက အကြောင်းကြားရမယ်။","evidence":"小美負責通知同學"},{"id":"q-b1-40","level":"B1","wordId":"b1-40","passage":"做報告時，小文擅長找資料，小美擅長畫圖。他們合作後，小文先整理重點，再交給小美做成圖片。兩個人都不用一個人做完所有事情。","my":"အစီရင်ခံစာလုပ်ရာမှာ ရှောင်ဝင်က အချက်အလက်ရှာတော်ပြီး ရှောင်မေက ပုံဆွဲတော်တယ်။ ပူးပေါင်းတော့ ရှောင်ဝင်က အဓိကအချက်စုပြီး ရှောင်မေကို ပုံလုပ်ခိုင်းတယ်။ တစ်ယောက်တည်းအားလုံးမလုပ်ရဘူး။","question":"他們合作的方式是什麼？","options":["每個人做一模一樣的事","把工作全部交給老師","只讓一個人完成報告","依照各自擅長的部分分工"],"optionsMy":["နှစ်ယောက်အလုပ်တူတူလုပ်","အလုပ်အားလုံးဆရာ့ကိုပေး","တစ်ယောက်တည်းအစီရင်ခံစာလုပ်","တော်တဲ့အပိုင်းအလိုက်တာဝန်ခွဲ"],"answer":3,"explanation":"ကိုယ်ကျွမ်းကျင်တဲ့အပိုင်းကို လုပ်ပြီး အချင်းချင်းကူညီတာပါ။","evidence":"小文先整理重點，再交給小美做成圖片"},{"id":"q-b1-41","level":"B1","wordId":"b1-41","passage":"大家想星期五晚上吃飯，但小安那天要上班。他建議改成星期六中午，其他人都說有空，也同意這個建議。於是小安開始訂位。","my":"အားလုံးသောကြာညစားချင်ပေမယ့် ရှောင်အန်းအလုပ်ရှိတယ်။ စနေနေ့လယ်ပြောင်းဖို့အကြံပြုတော့ တခြားလူတွေလည်းအားလို့ သဘောတူတယ်။ ဒါကြောင့် သူဘိုကင်စလုပ်တယ်။","question":"最後大家約好什麼時候吃飯？","options":["星期六中午","星期五晚上","星期六晚上","星期五中午"],"optionsMy":["စနေနေ့လယ်","သောကြာည","စနေည","သောကြာနေ့လယ်"],"answer":0,"explanation":"အားလုံးက ရှောင်အန်းအကြံပြုတဲ့အချိန်ကို သဘောတူလို့ စနေနေ့လယ်ဖြစ်တယ်။","evidence":"改成星期六中午"},{"id":"q-b1-42","level":"B1","wordId":"b1-42","passage":"朋友約小美星期天去爬山，但她已經答應陪媽媽買東西。她說：「謝謝你找我，這次不行，下次再一起去。」她希望拒絕邀請時也讓朋友感到被尊重。","my":"သူငယ်ချင်းက တနင်္ဂနွေတောင်တက်ဖို့ခေါ်ပေမယ့် ရှောင်မေက အမေနဲ့ဈေးဝယ်ဖို့ကတိပေးထားတယ်။ ဖိတ်လို့ကျေးဇူးတင်တယ်၊ ဒီတစ်ခေါက်မရဘူး၊ နောက်မှအတူသွားမယ်လို့ ယဉ်ကျေးစွာငြင်းတယ်။","question":"小美為什麼拒絕這次邀請？","options":["她不想再見朋友","她已有其他安排","她完全不喜歡戶外","朋友沒有說地點"],"optionsMy":["သူငယ်ချင်းကိုထပ်မတွေ့ချင်","တခြားအစီအစဉ်ရှိပြီး","ပြင်ပလှုပ်ရှားမှုလုံးဝမကြိုက်","သူငယ်ချင်းနေရာမပြော"],"answer":1,"explanation":"ဒီတစ်ခေါက်ငြင်းတာက အမေနဲ့အချိန်ချိန်းထားပြီးသားမို့ပါ။ သူငယ်ချင်းကို မကြိုက်တာ မဟုတ်ပါ။","evidence":"已經答應陪媽媽買東西"},{"id":"q-b1-43","level":"B1","wordId":"b1-43","passage":"小安在中文課上說錯了幾個詞，覺得很不好意思。老師沒有叫他停止，而是鼓勵他先把意思說完，再一起改。他下次比較敢開口了。","my":"ရှောင်အန်းက အတန်းမှာ စကားလုံးတချို့မှားလို့ ရှက်တယ်။ ဆရာက ရပ်ခိုင်းမယ့်အစား အဓိပ္ပာယ်အရင်ပြောပြီးမှ အတူပြင်ဖို့အားပေးတော့ နောက်တစ်ခေါက်ပိုပြောရဲလာတယ်။","question":"老師的做法帶來什麼結果？","options":["小安決定不再上課","小安只願意寫字","小安比較有勇氣說話","小安以後不必改錯"],"optionsMy":["အတန်းမတက်တော့ဖို့ဆုံးဖြတ်","စာပဲရေးချင်","စကားပြောဖို့ပိုရဲလာ","နောက်ဆိုအမှားပြင်စရာမလို"],"answer":2,"explanation":"အားပေးမှုက သူ့ကို ပိုပြောရဲစေတယ်။ အမှားမပြင်တော့ဘူးလို့ မဆိုလိုပါ။","evidence":"下次比較敢開口了"},{"id":"q-b1-44","level":"B1","wordId":"b1-44","passage":"小文第一次一個人搭火車，擔心坐錯方向。他提早到站，先看月臺上的終點站，再向站務人員確認。確認後，他比較放心地上車了。","my":"ရှောင်ဝင်က ပထမဆုံးတစ်ယောက်တည်းရထားစီးလို့ လမ်းကြောင်းမှားမှာစိတ်ပူတယ်။ ဘူတာစောရောက်ပြီး စင်္ကြံပေါ်ဆုံးဘူတာအမည်ဖတ်ကာ ဝန်ထမ်းကိုမေးတော့ စိတ်အေးပြီးတက်တယ်။","question":"什麼讓小文比較不擔心？","options":["完全不看站名","等朋友替他決定","取消這次旅行","確認火車的方向"],"optionsMy":["ဘူတာနာမည်လုံးဝမကြည့်","သူငယ်ချင်းဆုံးဖြတ်ပေးတာစောင့်","ခရီးပယ်ဖျက်","ရထားလမ်းကြောင်းသေချာစစ်"],"answer":3,"explanation":"စိတ်ပူတဲ့အရာကို အချက်အလက်စစ်ပြီး ဖြေရှင်းတာပါ။","evidence":"向站務人員確認"},{"id":"q-b1-45","level":"B1","wordId":"b1-45","passage":"小美買鞋的預算是一千元。她看到一雙一千五百元的鞋很喜歡，但決定先不買，繼續找價格在一千元以內、走起來舒服的鞋。","my":"ရှောင်မေက ဖိနပ်အတွက် ဒေါ်လာတစ်ထောင်သတ်မှတ်ထားတယ်။ တစ်ထောင့်ငါးရာတန်ကြိုက်ပေမယ့် မဝယ်သေးဘဲ တစ်ထောင်အတွင်း လမ်းလျှောက်လို့သက်သာတဲ့ဖိနပ်ကို ဆက်ရှာတယ်။","question":"小美為什麼先不買喜歡的鞋？","options":["價格超過預算","鞋子已經賣完","她不需要任何鞋子","店裡沒有她的尺寸"],"optionsMy":["ဈေးကသတ်မှတ်ငွေထက်ကျော်","ဖိနပ်ကုန်သွား","ဖိနပ်လုံးဝမလို","သူမအရွယ်မရှိ"],"answer":0,"explanation":"သူမကြိုက်ပေမယ့် ဈေးက သတ်မှတ်ထားတဲ့တစ်ထောင်ထက်များလို့ မဝယ်သေးတာပါ။","evidence":"買鞋的預算是一千元"},{"id":"q-b1-46","level":"B1","wordId":"b1-46","passage":"朋友問小安週末可以做什麼。小安說：「有很多選擇，比如逛市場、去公園，也可以在家做飯。」他請朋友先選自己有興趣的活動。","my":"သူငယ်ချင်းက ပိတ်ရက်ဘာလုပ်လို့ရလဲမေးတော့ ရှောင်အန်းက ဈေးလျှောက်တာ၊ ပန်းခြံသွားတာ၊ အိမ်မှာချက်ပြုတ်တာတို့လို ရွေးစရာများတယ်လို့ပြောပြီး စိတ်ဝင်စားတာအရင်ရွေးခိုင်းတယ်။","question":"小安說「比如」是為了什麼？","options":["規定只能去市場","舉出幾個活動例子","說明所有活動都取消","要求朋友全部做完"],"optionsMy":["ဈေးပဲသွားရလို့သတ်မှတ်","လှုပ်ရှားမှုဥပမာတချို့ပေး","အားလုံးပယ်ဖျက်ကြောင်းပြော","သူငယ်ချင်းကိုအကုန်လုပ်ခိုင်း"],"answer":1,"explanation":"「比如」က ဥပမာပေးတာပါ။ အဲဒီရွေးစရာတွေပဲရှိတယ်လို့ မကန့်သတ်ပါ။","evidence":"有很多選擇"},{"id":"q-b1-47","level":"B1","wordId":"b1-47","passage":"這家早餐店除了賣蛋餅，也賣飯糰和三明治。小文今天不想吃蛋餅，便買了一個飯糰。他覺得同一家店有不同選擇很方便。","my":"ဒီမနက်စာဆိုင်က ကြက်ဥပန်ကိတ်အပြင် ထမင်းလုံးနဲ့အသားညှပ်ပေါင်မုန့်လည်းရောင်းတယ်။ ရှောင်ဝင်က ဒီနေ့ပန်ကိတ်မစားချင်လို့ ထမင်းလုံးဝယ်တယ်။ ရွေးစရာစုံလို့အဆင်ပြေတယ်။","question":"這家店賣哪些東西？","options":["只賣飯糰","完全不賣蛋餅","蛋餅和其他早餐","只有三明治和晚餐"],"optionsMy":["ထမင်းလုံးပဲ","ပန်ကိတ်လုံးဝမရောင်း","ပန်ကိတ်နဲ့တခြားမနက်စာ","အသားညှပ်ပေါင်မုန့်နဲ့ညစာပဲ"],"answer":2,"explanation":"「除了…也…」က ထပ်ပေါင်းပြောတာမို့ ပန်ကိတ်လည်းရောင်းပါတယ်။","evidence":"除了賣蛋餅，也賣飯糰和三明治"},{"id":"q-b1-48","level":"B1","wordId":"b1-48","passage":"飲料店說，只要自己帶杯子，買任何飲料都可以少付五元。小美帶了杯子，點一杯原價四十元的茶。店員收了她三十五元。","my":"အရည်ဆိုင်က ကိုယ့်ခွက်ယူလာရင် ဘာအရည်ဝယ်ဝယ် ငါးဒေါ်လာလျှော့မယ်လို့ပြောတယ်။ ရှောင်မေက ခွက်ယူပြီး မူလဈေးလေးဆယ်တန်လက်ဖက်ရည်မှာတော့ သုံးဆယ့်ငါးဒေါ်လာပဲပေးရတယ်။","question":"得到這個折扣需要符合什麼條件？","options":["一次買五杯","一定要買咖啡","先加入會員","自己帶杯子"],"optionsMy":["တစ်ခါငါးခွက်ဝယ်","ကော်ဖီပဲဝယ်ရ","အဖွဲ့ဝင်အရင်ဖြစ်ရ","ကိုယ့်ခွက်ယူလာ"],"answer":3,"explanation":"「只要」နောက်က ကိုယ့်ခွက်ယူလာတာဟာ လျှော့ဈေးရဖို့ အခြေအနေပါ။","evidence":"只要自己帶杯子"},{"id":"q-b1-49","level":"B1","wordId":"b1-49","passage":"小安和朋友約好，如果星期天下雨，就在家一起做飯；如果沒下雨，就去公園野餐。星期天早上一直下雨，大家照原來說好的方式安排。","my":"ရှောင်အန်းနဲ့သူငယ်ချင်းတွေက တနင်္ဂနွေမိုးရွာရင် အိမ်မှာချက်စား၊ မရွာရင် ပန်းခြံပျော်ပွဲစားသွားဖို့ချိန်းတယ်။ တနင်္ဂနွေမနက် မိုးဆက်ရွာလို့ ပြောထားတဲ့အစီအစဉ်အတိုင်းလုပ်တယ်။","question":"按照約定，大家星期天應該做什麼？","options":["在家一起做飯","照樣到公園野餐","改成星期一出門","各自去不同餐廳"],"optionsMy":["အိမ်မှာအတူချက်စား","ပန်းခြံပဲသွား","တနင်္လာမှထွက်","တစ်ယောက်တစ်ဆိုင်စီသွား"],"answer":0,"explanation":"မိုးရွာတဲ့အခြေအနေဖြစ်လို့ အိမ်မှာချက်စားတဲ့အစီအစဉ်ကို ရွေးရပါတယ်။","evidence":"如果星期天下雨，就在家一起做飯"},{"id":"q-b1-50","level":"B1","wordId":"b1-50","passage":"小美推薦學校旁邊的麵店，說那裡的麵很好吃，而且老闆會記得客人不要加什麼。她雖然偶爾要排隊，還是常常去。","my":"ရှောင်မေက ကျောင်းဘေးခေါက်ဆွဲဆိုင်ကိုညွှန်းတယ်။ စားကောင်းတဲ့အပြင် ဆိုင်ရှင်က ဧည့်သည်မထည့်ချင်တာကို မှတ်မိတယ်။ တစ်ခါတစ်လေတန်းစီရပေမယ့် မကြာခဏသွားတယ်။","question":"小美提到這家店哪兩個優點？","options":["不用排隊而且離家近","食物好吃而且服務用心","價格最低而且全天營業","空間很大而且能唱歌"],"optionsMy":["တန်းမစီရအိမ်နီး","စားကောင်းပြီးဝန်ဆောင်မှုဂရုစိုက်","ဈေးအနိမ့်ဆုံးနဲ့တစ်နေ့လုံးဖွင့်","နေရာကျယ်ပြီးသီချင်းဆိုလို့ရ"],"answer":1,"explanation":"「而且」က နောက်ထပ်အားသာချက်ကို ဖြည့်ပြောတာပါ။ ဈေးအသက်သာဆုံးလို့ မပြောထားပါ။","evidence":"老闆會記得客人不要加什麼"},{"id":"q-b1-51","level":"B1","wordId":"b1-51","passage":"昨天下了一整天的雨，今天早上雖然出太陽了，山路仍然很滑。管理員建議大家改走平坦的步道，小文接受了建議。","my":"မနေ့ကတစ်နေ့လုံးမိုးရွာပြီး ဒီမနက်နေပူပေမယ့် တောင်လမ်းကချော်နေဆဲပါ။ တာဝန်ရှိသူက ပြန့်တဲ့လမ်းကိုပြောင်းလျှောက်ဖို့အကြံပြုတော့ ရှောင်ဝင်လက်ခံတယ်။","question":"「仍然」強調山路的什麼情況？","options":["已經完全乾了","今天才開始下雨","天氣變好後還是很滑","已經不能步行"],"optionsMy":["လုံးဝခြောက်ပြီ","ဒီနေ့မှမိုးစရွာ","ရာသီဥတုကောင်းလာပေမယ့်ချော်နေဆဲ","လမ်းလျှောက်လို့မရတော့"],"answer":2,"explanation":"ရာသီဥတုပြောင်းသွားပေမယ့် လမ်းချော်တဲ့အခြေအနေ ဆက်ရှိနေတာပါ။","evidence":"山路仍然很滑"},{"id":"q-b1-52","level":"B1","wordId":"b1-52","passage":"小安找了三天的鑰匙，連外套口袋都翻過了。今天整理沙發時，終於在坐墊下面找到。他鬆了一口氣，不用再去配新的鑰匙了。","my":"ရှောင်အန်းက သော့ကိုသုံးရက်ရှာပြီး အင်္ကျီအိတ်တွေလည်းစစ်ပြီးပြီ။ ဒီနေ့ဆိုဖာရှင်းလင်းရင်း ထိုင်ခုံအောက်မှာ နောက်ဆုံးရှာတွေ့တော့ သော့အသစ်လုပ်စရာမလိုလို့ စိတ်အေးသွားတယ်။","question":"「終於」表現出小安怎樣的經過？","options":["一開始就知道在哪裡","完全沒有找過","只找了幾秒鐘","找了一段時間才找到"],"optionsMy":["အစကတည်းကနေရာသိ","လုံးဝမရှာဖူး","စက္ကန့်အနည်းငယ်ပဲရှာ","အချိန်ယူရှာပြီးမှတွေ့"],"answer":3,"explanation":"「找了三天」နဲ့「終於」က အချိန်ယူကြိုးစားပြီးမှ တွေ့ကြောင်းပြတယ်။","evidence":"找了三天的鑰匙"},{"id":"q-b1-53","level":"B1","wordId":"b1-53","passage":"小美訂的點心至少要三天以前預訂。她想星期六取貨，店員提醒她最晚星期三就要訂，星期五才訂會來不及。","my":"ရှောင်မေမှာမယ့်မုန့်က အနည်းဆုံးသုံးရက်ကြိုမှာရမယ်။ စနေနေ့ယူချင်ရင် အနောက်ကျဆုံးဗုဒ္ဓဟူးမှာရပြီး သောကြာမှမှာရင် မမီဘူးလို့ ဝန်ထမ်းသတိပေးတယ်။","question":"小美最晚應該哪一天訂點心？","options":["星期三","星期五","星期六早上","星期天"],"optionsMy":["ဗုဒ္ဓဟူး","သောကြာ","စနေနေ့မနက်","တနင်္ဂနွေ"],"answer":0,"explanation":"ပုဒ်ထဲမှာ အနောက်ကျဆုံးဗုဒ္ဓဟူးလို့ တိတိကျကျပြောထားပါတယ်။","evidence":"最晚星期三就要訂"},{"id":"q-b1-54","level":"B1","wordId":"b1-54","passage":"兩家店的便當價格差不多，一家九十元，另一家九十五元。小安最後選離公司較近的那家，因為中午休息時間不長。","my":"ဆိုင်နှစ်ဆိုင်ရဲ့ထမင်းဘူးဈေးက သိပ်မကွာဘူး၊ တစ်ဆိုင်ကိုးဆယ်၊ တစ်ဆိုင်ကိုးဆယ့်ငါးဒေါ်လာ။ ရှောင်အန်းက နေ့လယ်နားချိန်တိုလို့ ကုမ္ပဏီနဲ့ပိုနီးတဲ့ဆိုင်ရွေးတယ်။","question":"小安最後主要根據什麼選擇？","options":["哪家便當份量最大","哪家離公司較近","哪家價格剛好一樣","哪家需要等更久"],"optionsMy":["ဘယ်ဆိုင်ပမာဏအများဆုံး","ကုမ္ပဏီနဲ့ဘယ်ဆိုင်ပိုနီး","ဘယ်ဆိုင်ဈေးအတိအကျတူ","ဘယ်ဆိုင်ပိုကြာစောင့်ရ"],"answer":1,"explanation":"ဈေးကွာခြားမှုနည်းတဲ့အတွက် နားချိန်တိုတဲ့သူက အကွာအဝေးကို အဓိကစဉ်းစားပါတယ်။","evidence":"因為中午休息時間不長"},{"id":"q-b1-55","level":"B1","wordId":"b1-55","passage":"小文問從學校走到車站要多久，朋友說大概十五分鐘。因為小文第一次走這條路，還要找入口，所以他留了二十五分鐘，避免太趕。","my":"ရှောင်ဝင်က ကျောင်းကနေဘူတာလမ်းလျှောက်ချိန်မေးတော့ သူငယ်ချင်းက ဆယ့်ငါးမိနစ်လောက်လို့ပြောတယ်။ ပထမဆုံးသွားပြီးဝင်ပေါက်ရှာရလို့ အလျင်မလိုအောင် နှစ်ဆယ့်ငါးမိနစ်ချန်ထားတယ်။","question":"小文為什麼留了更多時間？","options":["朋友說一定要走半小時","他不打算搭火車","估計時間之外還要找路","他想先回家睡覺"],"optionsMy":["သူငယ်ချင်းကနာရီဝက်သေချာကြာမယ်ပြော","ရထားမစီးဖို့ရည်ရွယ်","ခန့်မှန်းချိန်အပြင်လမ်းရှာရသေး","အိမ်ပြန်အိပ်ချင်"],"answer":2,"explanation":"「大概」က ခန့်မှန်းချိန်ပါ။ လမ်းမသိတဲ့အတွက် အချိန်ပိုချန်ထားတာပါ။","evidence":"還要找入口"},{"id":"q-b1-56","level":"B1","wordId":"b1-56","passage":"小美出門時天氣很好，走到市場門口卻突然下起大雨。她沒有帶傘，就先進店裡等，並打電話告訴家人會晚一點回去。","my":"ရှောင်မေအပြင်ထွက်တုန်း ရာသီဥတုကောင်းပေမယ့် ဈေးဝရောက်တော့ ရုတ်တရက်မိုးကြီးရွာတယ်။ ထီးမပါတော့ ဆိုင်ထဲဝင်စောင့်ပြီး နောက်ကျပြန်မယ်လို့ မိသားစုကိုဖုန်းဆက်တယ်။","question":"小美為什麼改變回家的時間？","options":["市場提早關門","家人叫她多買東西","她忘記市場在哪裡","天氣突然改變"],"optionsMy":["ဈေးစောပိတ်","မိသားစုပစ္စည်းထပ်ဝယ်ခိုင်း","ဈေးနေရာမေ့","ရာသီဥတုရုတ်တရက်ပြောင်း"],"answer":3,"explanation":"ရုတ်တရက်မိုးရွာပြီး ထီးမပါတာကြောင့် ခဏစောင့်ဖို့လိုသွားတယ်။","evidence":"突然下起大雨"},{"id":"q-b1-57","level":"B1","wordId":"b1-57","passage":"早餐店以前只有兩種三明治，最近增加到五種。老闆說常有客人問能不能有不放肉的選擇，所以這次也加了蔬菜三明治。","my":"မနက်စာဆိုင်မှာ အရင်အသားညှပ်ပေါင်မုန့်နှစ်မျိုးပဲရှိပြီး အခုငါးမျိုးတိုးထားတယ်။ အသားမပါတာရှိလားလို့ ဧည့်သည်တွေမေးတာကြောင့် ဟင်းသီးဟင်းရွက်အမျိုးအစားပါ ထပ်ထည့်တယ်။","question":"老闆為什麼增加蔬菜三明治？","options":["回應客人不同的需要","以後完全不賣肉","原本五種太多了","店裡不再賣早餐"],"optionsMy":["ဧည့်သည်လိုအပ်ချက်စုံကိုဖြည့်","နောက်ဆိုအသားလုံးဝမရောင်း","မူလငါးမျိုးများလွန်း","မနက်စာမရောင်းတော့"],"answer":0,"explanation":"ဧည့်သည်မေးတဲ့ အသားမပါတဲ့ရွေးစရာကို ထပ်တိုးပေးတာပါ။","evidence":"常有客人問能不能有不放肉的選擇"},{"id":"q-b1-58","level":"B1","wordId":"b1-58","passage":"小安發現自己常買重複的東西。現在去超市前，他會先看冰箱，再寫購物清單。這樣除了節省錢，也不用在店裡一直想家裡缺什麼。","my":"ရှောင်အန်းက ပစ္စည်းထပ်ဝယ်မိတတ်လို့ အခုစူပါမားကတ်မသွားခင် ရေခဲသေတ္တာစစ်ပြီး ဝယ်စာရင်းရေးတယ်။ ငွေချွေတာတဲ့အပြင် ဆိုင်ထဲမှာ ဘာလိုလဲဆိုတာ အကြာကြီးမစဉ်းစားရတော့ဘူး။","question":"先寫購物清單有什麼好處？","options":["可以完全不用買食物","省錢，也省下思考的時間","一定會買更多東西","不用看家裡有什麼"],"optionsMy":["အစားအစာလုံးဝမဝယ်ရ","ငွေရောစဉ်းစားချိန်ပါချွေတာ","ပစ္စည်းသေချာပိုဝယ်မယ်","အိမ်မှာဘာရှိလဲမကြည့်ရ"],"answer":1,"explanation":"ပုဒ်ထဲမှာ ငွေနဲ့အချိန် နှစ်ခုလုံးချွေတာနိုင်တဲ့အကျိုးကို ဖော်ပြထားပါတယ်။","evidence":"不用在店裡一直想家裡缺什麼"},{"id":"q-b1-59","level":"B1","wordId":"b1-59","passage":"小文搬到別的城市後，和以前的室友不容易見面。他們約好每星期日晚上通電話，分享最近的生活，希望繼續保持聯絡。","my":"ရှောင်ဝင်က မြို့ပြောင်းပြီး အခန်းဖော်ဟောင်းနဲ့တွေ့ရခက်တယ်။ အဆက်အသွယ်ဆက်ရှိဖို့ တနင်္ဂနွေညတိုင်းဖုန်းပြောပြီး နေ့စဉ်ဘဝအကြောင်းမျှဝေဖို့ချိန်းတယ်။","question":"他們用什麼方式保持聯絡？","options":["每天一起吃晚餐","一起搬到同一間房","固定每週通電話","只等偶然在路上遇見"],"optionsMy":["နေ့တိုင်းညစာအတူစား","အခန်းတစ်ခန်းတည်းအတူပြောင်း","အပတ်တိုင်းပုံမှန်ဖုန်းပြော","လမ်းမှာတိုက်ဆိုင်တွေ့တာပဲစောင့်"],"answer":2,"explanation":"မတွေ့နိုင်ပေမယ့် ပုံမှန်ဖုန်းပြောခြင်းနဲ့ အဆက်အသွယ်ဆက်ထိန်းထားတာပါ။","evidence":"每星期日晚上通電話"},{"id":"q-b1-60","level":"B1","wordId":"b1-60","passage":"小美想參加一日遊。費用八百元包含車票和午餐，但不包含晚餐。她看完說明後，另外準備了一些晚餐的錢，才完成報名。","my":"ရှောင်မေက တစ်ရက်ခရီးတက်ချင်တယ်။ ရှစ်ရာဒေါ်လာမှာ ကားခနဲ့နေ့လယ်စာပါပြီး ညစာမပါဘူး။ ဖတ်ပြီးတော့ ညစာအတွက်ငွေသီးသန့်ပြင်ဆင်ကာ စာရင်းသွင်းတယ်။","question":"小美為什麼另外準備一些錢？","options":["車票完全不包含在費用內","午餐需要再付一次","報名以後一定要買禮物","晚餐不包含在八百元裡"],"optionsMy":["ကားခလုံးဝမပါ","နေ့လယ်စာထပ်ပေးရ","စာရင်းသွင်းပြီးလက်ဆောင်ဝယ်ရ","ရှစ်ရာထဲညစာမပါ"],"answer":3,"explanation":"「不包含晚餐」က ညစာအတွက် သီးသန့်ပေးရမယ်ဆိုတာပါ။","evidence":"但不包含晚餐"},{"id":"q-b1-context-01","level":"B1","wordId":"b1-01","passage":"小安看了兩間房子，還拿不定主意。朋友問他決定了沒有，他說：「我想再走一次附近的路，看看晚上安不安全，明天再回答房東。」","my":"ရှောင်အန်းအိမ်နှစ်ခန်းကြည့်ပြီး မရွေးရသေးဘူး။ သူငယ်ချင်းမေးတော့ ညဘက်လုံခြုံလားလမ်းထပ်ကြည့်ပြီး မနက်ဖြန်မှအိမ်ရှင်ကိုပြန်ဖြေမယ်လို့ပြောတယ်။","question":"小安目前做出決定了嗎？","options":["已經決定兩間都租","還沒有，想再了解環境","已經搬進新家","決定不再找房子"],"optionsMy":["နှစ်ခန်းလုံးငှားဖို့ဆုံးဖြတ်ပြီး","မဆုံးဖြတ်ရသေးပတ်ဝန်းကျင်ပိုသိချင်","အိမ်အသစ်ပြောင်းဝင်ပြီး","အိမ်ဆက်မရှာဖို့ဆုံးဖြတ်"],"answer":1,"explanation":"မနက်ဖြန်မှပြန်ဖြေမယ်ဆိုတာ အခုထိမဆုံးဖြတ်ရသေးကြောင်းပြပါတယ်။","evidence":"明天再回答房東"},{"id":"q-b1-context-02","level":"B1","wordId":"b1-02","passage":"小美說：「這雙鞋雖然比另一雙貴，但是走一整天也不痛。我每天要走很多路，所以還是選這雙。」她把比較便宜的那雙放回架上。","my":"ရှောင်မေက ဒီဖိနပ်ပိုဈေးကြီးပေမယ့် တစ်နေ့လုံးလမ်းလျှောက်လည်းမနာဘူး၊ နေ့တိုင်းလမ်းအများကြီးလျှောက်ရလို့ ဒါရွေးမယ်ဆိုပြီး ဈေးသက်သာတဲ့တစ်ရံကို ပြန်တင်ထားတယ်။","question":"小美選比較貴的鞋，主要因為什麼？","options":["她只喜歡買最貴的","便宜的鞋沒有她的尺寸","她每天都不用走路","鞋子適合長時間走路"],"optionsMy":["ဈေးအကြီးဆုံးပဲကြိုက်","ဈေးသက်သာတာအရွယ်မရှိ","နေ့တိုင်းလမ်းမလျှောက်ရ","ဖိနပ်ကအကြာကြီးလမ်းလျှောက်ဖို့သင့်"],"answer":3,"explanation":"「但是」နောက်က အားသာချက်ဟာ သူမရွေးတဲ့အဓိကအကြောင်းပါ။","evidence":"走一整天也不痛"},{"id":"q-b1-context-03","level":"B1","wordId":"b1-03","passage":"小文想一次買十本中文書。朋友建議他先買一本，讀完再決定下一本，才不會買太多卻沒時間看。小文覺得有道理，只帶了一本去結帳。","my":"ရှောင်ဝင်က တရုတ်စာအုပ်ဆယ်အုပ်တစ်ခါဝယ်ချင်တယ်။ သူငယ်ချင်းက အရင်တစ်အုပ်ဝယ်ဖတ်ပြီးမှနောက်အုပ်ရွေးဖို့အကြံပြုတော့ သဘောကျပြီး တစ်အုပ်ပဲငွေရှင်းတယ်။","question":"朋友建議小文怎麼買書？","options":["先買一本，讀完再選","一次買越多越好","只買最貴的書","以後都不要買書"],"optionsMy":["အရင်တစ်အုပ်ဝယ်ဖတ်ပြီးမှရွေး","တစ်ခါများများဝယ်လေကောင်း","ဈေးအကြီးဆုံးပဲဝယ်","နောက်ဆိုစာအုပ်မဝယ်နဲ့"],"answer":0,"explanation":"စာအုပ်မဝယ်ဖို့တားတာမဟုတ်ဘဲ တစ်အုပ်စီသုံးနိုင်သလောက်ဝယ်ဖို့ပါ။","evidence":"先買一本，讀完再決定下一本"},{"id":"q-b1-context-04","level":"B1","wordId":"b1-04","passage":"上個月，小安點餐時只能指圖片。今天他能告訴店員不要加辣，還能問餐點要等多久。雖然有幾個詞說得慢，他仍然覺得自己進步了。","my":"ပြီးခဲ့တဲ့လ ရှောင်အန်းအော်ဒါမှာရင် ပုံပဲညွှန်နိုင်တယ်။ ဒီနေ့တော့ မစပ်ဖို့နဲ့ဘယ်လောက်စောင့်ရမလဲ ပြောနိုင်တယ်။ တချို့စကားလုံးနှေးပေမယ့် တိုးတက်လာလို့ခံစားရတယ်။","question":"哪個變化最能說明小安的進步？","options":["他不再需要吃飯","他開始收集餐廳圖片","他能用中文說出更多需求","他說每個詞都完全正確"],"optionsMy":["ထမင်းစားစရာမလိုတော့","ဆိုင်ပုံတွေစုလာ","တရုတ်လိုလိုအပ်ချက်ပိုပြောနိုင်","စကားလုံးတိုင်းလုံးဝမှန်"],"answer":2,"explanation":"လိုအပ်ချက်တွေကို ပိုပြောနိုင်တာဟာ တိုးတက်မှုပါ။ အမှားလုံးဝမရှိရဘူးလို့ မလိုပါ။","evidence":"能告訴店員不要加辣"},{"id":"q-b1-context-05","level":"B1","wordId":"b1-05","passage":"小美星期六要上班，也想去看朋友。她先確認下班時間，再把見面的時間安排在晚上七點，這樣就不用趕著離開工作。","my":"ရှောင်မေစနေနေ့အလုပ်ရှိပြီး သူငယ်ချင်းလည်းတွေ့ချင်တယ်။ အလုပ်ဆင်းချိန်ကိုအရင်စစ်ပြီး ညခုနစ်နာရီချိန်းလို့ အလုပ်ကအလျင်လိုထွက်စရာမလိုတော့ဘူး။","question":"小美安排見面時間時先考慮了什麼？","options":["朋友喜歡什麼飲料","自己什麼時候下班","星期日的天氣","餐廳有沒有早餐"],"optionsMy":["သူငယ်ချင်းဘာအရည်ကြိုက်","ကိုယ်ဘယ်ချိန်အလုပ်ဆင်း","တနင်္ဂနွေရာသီဥတု","ဆိုင်မှာမနက်စာရှိလား"],"answer":1,"explanation":"မတွေ့ခင် အလုပ်ပြီးဖို့လိုတဲ့အတွက် အလုပ်ဆင်းချိန်ကို အရင်စစ်ပါတယ်။","evidence":"先確認下班時間"},{"id":"q-b1-context-06","level":"B1","wordId":"b1-06","passage":"火車還有五分鐘就開了，小文卻還在離車站很遠的公車上。他知道這班來不及了，於是查下一班的時間，並通知等他的朋友。","my":"ရထားထွက်ဖို့ငါးမိနစ်ပဲရှိပြီး ရှောင်ဝင်က ဘူတာနဲ့ဝေးတဲ့ဘတ်စ်ကားပေါ်မှာပဲရှိတယ်။ ဒီတစ်စီးမမီတော့မှန်းသိလို့ နောက်ရထားအချိန်စစ်ပြီး စောင့်နေတဲ့သူငယ်ချင်းကိုအကြောင်းကြားတယ်။","question":"小文認為「來不及」的是哪一件事？","options":["買明天的早餐","通知他的朋友","查詢任何車班","趕上快要出發的火車"],"optionsMy":["မနက်ဖြန်မနက်စာဝယ်","သူငယ်ချင်းအကြောင်းကြား","ကားအချိန်စစ်","အခုထွက်တော့မယ့်ရထားမီ"],"answer":3,"explanation":"ဒီစကားက အခုထွက်တော့မယ့်ရထားကို မမီနိုင်တာကို ရည်ညွှန်းပါတယ်။","evidence":"這班來不及了"},{"id":"q-b1-context-07","level":"B1","wordId":"b1-07","passage":"朋友推薦一門晚上九點開始的中文課。小安覺得內容很好，可是他每天清晨要上班，所以選了週末白天的課。他認為時間也要適合自己。","my":"သူငယ်ချင်းက ညကိုးနာရီစတဲ့တရုတ်စာအတန်းညွှန်းတယ်။ ရှောင်အန်းက အကြောင်းအရာကောင်းပေမယ့် မနက်စောအလုပ်ရှိလို့ ပိတ်ရက်နေ့ခင်းအတန်းရွေးတယ်။ အချိန်လည်းကိုက်ဖို့လိုလို့ထင်တယ်။","question":"小安沒有選晚上的課，主要因為什麼？","options":["上課時間不適合他的生活","課程完全沒有內容","週末不能上任何課","朋友要求他不要學中文"],"optionsMy":["အတန်းချိန်ကသူ့နေ့စဉ်ဘဝနဲ့မကိုက်","အတန်းမှာအကြောင်းအရာလုံးဝမရှိ","ပိတ်ရက်အတန်းလုံးဝမတက်နိုင်","သူငယ်ချင်းတရုတ်စာမသင်ခိုင်း"],"answer":0,"explanation":"အကြောင်းအရာမကောင်းတာမဟုတ်ဘဲ မနက်စောအလုပ်ရှိတာနဲ့ အချိန်မကိုက်လို့ပါ။","evidence":"他每天清晨要上班"},{"id":"q-b1-context-08","level":"B1","wordId":"b1-08","passage":"小美原本每天坐車去附近的超市，現在改成走路。她發現路程只要十分鐘，還能順便活動身體。她沒有搬家，只是改變了出門的方法。","my":"ရှောင်မေက အရင် အနီးကစူပါမားကတ်ကို ကားစီးသွားတယ်။ အခုလမ်းလျှောက်ပြီး ဆယ်မိနစ်ပဲကြာသလို ကိုယ်လက်လှုပ်ရှားမှုပါရတယ်။ အိမ်မပြောင်းဘဲ သွားတဲ့နည်းပဲပြောင်းတာပါ။","question":"小美改變了什麼？","options":["她住的城市","她買菜的時間","她去超市的方式","她所有的朋友"],"optionsMy":["နေတဲ့မြို့","ဈေးဝယ်ချိန်","စူပါမားကတ်သွားနည်း","သူငယ်ချင်းအားလုံး"],"answer":2,"explanation":"「坐車」ကနေ「走路」ပြောင်းတာက သွားလာနည်းပြောင်းတာပါ။","evidence":"現在改成走路"},{"id":"q-b1-context-09","level":"B1","wordId":"b1-09","passage":"午餐有飯和麵可以選擇。小安今天早上已經吃過麵，所以中午選了飯。他平常兩種都喜歡，只是今天想換一種。","my":"နေ့လယ်စာမှာ ထမင်းနဲ့ခေါက်ဆွဲရွေးလို့ရတယ်။ ရှောင်အန်းမနက်ခေါက်ဆွဲစားပြီးလို့ နေ့လယ်ထမင်းရွေးတယ်။ နှစ်မျိုးလုံးကြိုက်ပေမယ့် ဒီနေ့ပြောင်းစားချင်တာပါ။","question":"為什麼小安今天選飯？","options":["他從來不吃麵","他想和早餐吃不同的東西","飯一定比麵便宜","餐廳今天沒有麵"],"optionsMy":["ခေါက်ဆွဲဘယ်တော့မှမစား","မနက်စာနဲ့မတူတာစားချင်","ထမင်းကခေါက်ဆွဲထက်သေချာသက်သာ","ဒီနေ့ဆိုင်မှာခေါက်ဆွဲမရှိ"],"answer":1,"explanation":"အကြိုက်မပြောင်းဘဲ ဒီနေ့စားတာမတူစေချင်လို့ ရွေးတာပါ။","evidence":"今天早上已經吃過麵"},{"id":"q-b1-context-10","level":"B1","wordId":"b1-10","passage":"小文剛搬到新家時，常常忘記鑰匙放在哪裡。後來他養成進門就把鑰匙放進小盒子的習慣，現在出門前很少需要找了。","my":"ရှောင်ဝင်အိမ်အသစ်ပြောင်းစမှာ သော့ထားရာမေ့တတ်တယ်။ နောက်တော့အိမ်ဝင်တိုင်း သေတ္တာငယ်ထဲသော့ထည့်တဲ့အလေ့အကျင့်လုပ်တော့ မထွက်ခင်ရှာရတာ နည်းသွားတယ်။","question":"哪一個習慣幫助了小文？","options":["每次換不同的盒子","出門時不帶鑰匙","請朋友每天來開門","回家就把鑰匙放在固定位置"],"optionsMy":["တိုင်းသေတ္တာပြောင်း","အပြင်ထွက်သော့မယူ","သူငယ်ချင်းနေ့တိုင်းဖွင့်ခိုင်း","အိမ်ပြန်တိုင်းသော့နေရာသတ်မှတ်ထား"],"answer":3,"explanation":"ပုံမှန်တစ်နေရာတည်းထားတဲ့အကျင့်က ပြန်ရှာရတာ လျော့စေတယ်။","evidence":"進門就把鑰匙放進小盒子"},{"id":"q-b1-context-11","level":"B1","wordId":"b1-11","passage":"買手機以前，小美比較了兩台的價格和重量。兩台都在她的預算內，但她每天要帶著走很多路，最後選了比較輕的那台。","my":"ရှောင်မေဖုန်းမဝယ်ခင် နှစ်လုံးရဲ့ဈေးနဲ့အလေးချိန်ကိုနှိုင်းယှဉ်တယ်။ နှစ်လုံးလုံးသတ်မှတ်ငွေအတွင်းပေမယ့် နေ့တိုင်းလမ်းအများကြီးလျှောက်ရလို့ ပိုပေါ့တာရွေးတယ်။","question":"最後哪一點對小美的選擇最重要？","options":["重量比較輕","價格超過預算","螢幕一定最大","可以放在家裡不用"],"optionsMy":["အလေးချိန်ပိုပေါ့","သတ်မှတ်ငွေထက်ကျော်","မျက်နှာပြင်အကြီးဆုံး","အိမ်မှာမသုံးဘဲထားလို့ရ"],"answer":0,"explanation":"ဈေးကနှစ်လုံးလုံးလက်ခံနိုင်လို့ နောက်ဆုံးက အလေးချိန်ကို အခြေခံရွေးတယ်။","evidence":"最後選了比較輕的那台"},{"id":"q-b1-context-12","level":"B1","wordId":"b1-12","passage":"聚餐時，小安本來想多點三道菜。小美提醒他桌上的菜還很多，吃不完會浪費。大家決定先吃，真的不夠再加點。","my":"အတူစားပွဲမှာ ရှောင်အန်းဟင်းသုံးပွဲထပ်မှာချင်တယ်။ ရှောင်မေက စားပွဲပေါ်များသေးပြီးမကုန်ရင် အလေအလွင့်ဖြစ်မယ်လို့သတိပေးတော့ အရင်စားပြီး တကယ်မလောက်မှထပ်မှာဖို့ဆုံးဖြတ်တယ်။","question":"大家怎麼做來避免浪費？","options":["完全不吃桌上的菜","把所有菜都退回去","先吃現有的，不夠再點","每個人多點三道菜"],"optionsMy":["စားပွဲပေါ်ဟင်းလုံးဝမစား","ဟင်းအားလုံးပြန်ပို့","ရှိတာအရင်စားမလောက်မှထပ်မှာ","တစ်ယောက်သုံးပွဲစီထပ်မှာ"],"answer":2,"explanation":"မစားနိုင်လောက်အောင် ထပ်မမှာဘဲ လိုအပ်မှထပ်မှာတာပါ။","evidence":"真的不夠再加點"},{"id":"q-b1-context-13","level":"B1","wordId":"b1-13","passage":"小美最近上課容易想睡，原本以為是早餐吃太少。記錄一星期後，她發現自己每天只睡五個小時，才知道主要原因是睡眠不足。","my":"ရှောင်မေအတန်းမှာအိပ်ချင်လို့ မနက်စာနည်းတာကြောင့်ထင်တယ်။ တစ်ပတ်မှတ်တမ်းထားတော့ တစ်ရက်ငါးနာရီပဲအိပ်တာတွေ့ပြီး အဓိကအကြောင်းက အိပ်ချိန်မလောက်တာမှန်းသိတယ်။","question":"她最後發現的主要原因是什麼？","options":["早餐吃太多","睡眠時間太少","教室離家太遠","每天上課太晚"],"optionsMy":["မနက်စာများလွန်း","အိပ်ချိန်နည်း","စာသင်ခန်းအိမ်နဲ့ဝေး","နေ့တိုင်းအတန်းအရမ်းနောက်ကျ"],"answer":1,"explanation":"အစကယူဆချက်နဲ့ နောက်ဆုံးတွေ့တဲ့အကြောင်းရင်းကို ခွဲဖတ်ပါ။","evidence":"每天只睡五個小時"},{"id":"q-b1-context-14","level":"B1","wordId":"b1-14","passage":"老師說小考結果星期五公布。小安星期四就一直問自己有沒有及格，老師請他再等一天，現在還不能知道。","my":"ဆရာက စာမေးပွဲရလဒ်ကို သောကြာထုတ်ပြန်မယ်လို့ပြောတယ်။ ရှောင်အန်းက ကြာသပတေးမှာပဲ အောင်လားမေးတော့ တစ်ရက်ထပ်စောင့်ဖို့ပြောတယ်၊ အခုမသိနိုင်သေးဘူး။","question":"星期四時，能確定小安的考試結果嗎？","options":["能，他一定及格","能，他一定不及格","能，成績已經寄出","不能，還沒公布"],"optionsMy":["ရတယ်သူသေချာအောင်","ရတယ်သူသေချာကျ","ရတယ်ရလဒ်ပို့ပြီး","မရဘူးမထုတ်ပြန်သေး"],"answer":3,"explanation":"ရလဒ်မထွက်သေးလို့ အောင်မအောင်ကို မသတ်မှတ်နိုင်ပါ။","evidence":"現在還不能知道"},{"id":"q-b1-context-15","level":"B1","wordId":"b1-15","passage":"小文每天聽中文廣播，但他的目的不是記住所有生字，而是先聽出節目在談什麼。遇到不懂的詞，他會先繼續聽，不馬上停止。","my":"ရှောင်ဝင်နေ့တိုင်းတရုတ်ရေဒီယိုနားထောင်တယ်။ ရည်ရွယ်ချက်က စကားလုံးအားလုံးမှတ်ဖို့မဟုတ်ဘဲ ဘာအကြောင်းပြောလဲသိဖို့ပါ။ မသိတဲ့စကားလုံးရှိလည်း ချက်ချင်းမရပ်ဘဲ ဆက်နားထောင်တယ်။","question":"小文這個階段的練習目的是什麼？","options":["掌握節目的主要內容","把每個詞寫十次","立刻翻譯每一句","完全不接觸新詞"],"optionsMy":["အစီအစဉ်အဓိကအကြောင်းသိ","စကားလုံးတိုင်းဆယ်ခါရေး","ဝါကျတိုင်းချက်ချင်းဘာသာပြန်","စကားလုံးအသစ်လုံးဝမတွေ့"],"answer":0,"explanation":"သူ့လက်ရှိရည်ရွယ်ချက်က အဓိကအကြောင်းကို သိဖို့ပါ။","evidence":"先聽出節目在談什麼"},{"id":"q-b1-context-16","level":"B1","wordId":"b1-16","passage":"小安以前沒辦過活動，這次第一次幫班上訂餐廳。他忘了問能不能分開付錢，結帳時有點混亂。他說下次會先問，這次的經驗讓他學到一件事。","my":"ရှောင်အန်းပထမဆုံးအတန်းစားပွဲအတွက်ဆိုင်ဘိုကင်လုပ်တယ်။ ငွေခွဲရှင်းလို့ရလားမမေးခဲ့လို့ ငွေရှင်းချိန်ရှုပ်တယ်။ နောက်တစ်ခေါက်အရင်မေးမယ်၊ ဒီအတွေ့အကြုံက တစ်ခုသင်ပေးတယ်လို့ပြောတယ်။","question":"小安從這次經驗學到什麼？","options":["以後不要和同學吃飯","一定要訂更貴的餐廳","訂位時先問付款方式","完全不用問餐廳問題"],"optionsMy":["နောက်အတန်းဖော်နဲ့မစားနဲ့","ပိုဈေးကြီးတဲ့ဆိုင်ဘိုကင်ရ","ဘိုကင်လုပ်ရင်ငွေပေးနည်းအရင်မေး","ဆိုင်ကိုလုံးဝမမေးရ"],"answer":2,"explanation":"ငွေရှင်းချိန်ပြဿနာကြောင့် ကြိုမေးဖို့သင်ယူခဲ့တာပါ။","evidence":"下次會先問"},{"id":"q-b1-context-17","level":"B1","wordId":"b1-17","passage":"小美想練習說中文，卻很少主動開口。老師說買早餐也是練習的機會，可以每天試著多問一句，例如今天有沒有新口味。","my":"ရှောင်မေတရုတ်စကားလေ့ကျင့်ချင်ပေမယ့် ကိုယ်တိုင်စပြောတာနည်းတယ်။ ဆရာက မနက်စာဝယ်တာလည်း လေ့ကျင့်ခွင့်ဖြစ်ပြီး ဒီနေ့အရသာအသစ်ရှိလားလို တစ်ကြောင်းထပ်မေးနိုင်တယ်လို့ပြောတယ်။","question":"老師認為小美可以在哪裡找到練習機會？","options":["只有正式考試時","日常買早餐的時候","完全沒有人的地方","只在寫作業的時候"],"optionsMy":["တရားဝင်စာမေးပွဲမှာပဲ","နေ့စဉ်မနက်စာဝယ်ချိန်","လူလုံးဝမရှိတဲ့နေရာ","အိမ်စာရေးချိန်မှာပဲ"],"answer":1,"explanation":"နေ့စဉ်လိုအပ်တဲ့လုပ်ဆောင်မှုထဲမှာ စကားပြောအခွင့်အရေး ရှာလို့ရပါတယ်။","evidence":"買早餐也是練習的機會"},{"id":"q-b1-context-18","level":"B1","wordId":"b1-18","passage":"小文想記住新同學的名字。他不只看名單，還在聊天時用對方的名字打招呼。幾天後，他發現這個方法比只看名單更容易記住。","my":"ရှောင်ဝင်အတန်းဖော်သစ်နာမည်မှတ်ဖို့ စာရင်းကြည့်ရုံမက စကားပြောရင် နာမည်ခေါ်နှုတ်ဆက်တယ်။ ရက်အနည်းငယ်ကြာတော့ ဒီနည်းက စာရင်းပဲကြည့်တာထက် ပိုမှတ်မိတယ်။","question":"小文採用的新方法是什麼？","options":["不再和同學說話","每天換自己的名字","只抄寫名單","在交談中使用同學的名字"],"optionsMy":["အတန်းဖော်နဲ့မပြောတော့","ကိုယ့်နာမည်နေ့တိုင်းပြောင်း","စာရင်းပဲကူးရေး","စကားပြောရာမှာအတန်းဖော်နာမည်သုံး"],"answer":3,"explanation":"နာမည်ကို တကယ့်စကားပြောထဲမှာ သုံးတာဟာ နည်းအသစ်ပါ။","evidence":"用對方的名字打招呼"},{"id":"q-b1-context-19","level":"B1","wordId":"b1-19","passage":"小美的聽力能力比閱讀好。朋友讀一段通知給她聽，她很快就懂；讓她自己看同一段，卻需要比較久。她決定把兩種練習分開安排。","my":"ရှောင်မေရဲ့နားထောင်စွမ်းရည်က စာဖတ်ထက်ကောင်းတယ်။ သူငယ်ချင်းကြေညာချက်ဖတ်ပေးရင် မြန်မြန်နားလည်ပေမယ့် ကိုယ်တိုင်ဖတ်ရင်ပိုကြာလို့ နှစ်မျိုးခွဲလေ့ကျင့်မယ်။","question":"這段話顯示小美的什麼情況？","options":["聽力和閱讀的表現不同","所有能力都一樣好","完全聽不懂中文","不需要再練習閱讀"],"optionsMy":["နားထောင်နဲ့စာဖတ်ရလဒ်မတူ","စွမ်းရည်အားလုံးတူတူကောင်း","တရုတ်လိုလုံးဝနားမလည်","စာဖတ်ထပ်မလေ့ကျင့်ရ"],"answer":0,"explanation":"ဘာသာစကားစွမ်းရည်တစ်ခုချင်း ကွာနိုင်တဲ့အကြောင်းပါ။","evidence":"聽力能力比閱讀好"},{"id":"q-b1-context-20","level":"B1","wordId":"b1-20","passage":"小安今天學了五個新詞。明天他打算先複習這五個詞，再學新的。他說，能把昨天的詞說出來，比每天只增加數量更重要。","my":"ရှောင်အန်းဒီနေ့စကားလုံးငါးလုံးသင်တယ်။ မနက်ဖြန်အဲဒီငါးလုံးအရင်ပြန်လေ့လာပြီးမှ အသစ်သင်မယ်။ နေ့တိုင်းအရေအတွက်တိုးတာထက် မနေ့ကစကားလုံးကိုပြောနိုင်တာ ပိုအရေးကြီးတယ်လို့ပြောတယ်။","question":"小安明天打算先做什麼？","options":["把今天的詞全部刪掉","只學十個新詞","回想今天學過的詞","只看下星期的進度"],"optionsMy":["ဒီနေ့စကားလုံးအားလုံးဖျက်","အသစ်ဆယ်လုံးပဲသင်","ဒီနေ့သင်ပြီးတာပြန်စဉ်းစား","နောက်အပတ်တိုးတက်မှုပဲကြည့်"],"answer":2,"explanation":"「先複習…再學新的」က လုပ်ရမယ့်အစီအစဉ်ကို ပြပါတယ်။","evidence":"先複習這五個詞"},{"id":"q-b1-context-21","level":"B1","wordId":"b1-21","passage":"小文說：「我看得懂這些字，可是不懂整句話。」老師請他指出不懂的地方，再用另外一個生活情境解釋，沒有叫他把每個字重新背一次。","my":"ရှောင်ဝင်က စာလုံးတွေသိပေမယ့် တစ်ကြောင်းလုံးမသိဘူးလို့ပြောတယ်။ ဆရာက မသိတဲ့နေရာညွှန်ခိုင်းပြီး အခြားနေ့စဉ်အခြေအနေနဲ့ရှင်းပြတယ်၊ စာလုံးတိုင်းပြန်ကျက်ခိုင်းတာမဟုတ်ဘူး။","question":"小文需要老師解釋的是什麼？","options":["每個字怎麼寫","整個句子的意思","教室的位置","所有同學的名字"],"optionsMy":["စာလုံးတစ်လုံးချင်းရေးနည်း","ဝါကျတစ်ကြောင်းလုံးအဓိပ္ပာယ်","စာသင်ခန်းနေရာ","အတန်းဖော်အားလုံးနာမည်"],"answer":1,"explanation":"စာလုံးကိုသိပေမယ့် ဝါကျအဓိပ္ပာယ်ကို မဆက်စပ်နိုင်တာပါ။","evidence":"不懂整句話"},{"id":"q-b1-context-22","level":"B1","wordId":"b1-22","passage":"小美想謝謝幫她搬家的朋友。她還不會說很長的中文，就說：「今天你幫我很多，真的謝謝你。」朋友笑著說，他已經感受到她的感謝。","my":"ရှောင်မေအိမ်ပြောင်းကူတဲ့သူငယ်ချင်းကိုကျေးဇူးတင်ချင်တယ်။ တရုတ်လိုအရှည်မပြောတတ်လို့ ဒီနေ့အများကြီးကူလို့ တကယ်ကျေးဇူးတင်တယ်လို့ပြောတော့ သူငယ်ချင်းက နားလည်တယ်လို့ပြုံးပြောတယ်။","question":"小美成功表達了什麼？","options":["對搬家的不滿","希望朋友付房租","自己不想再搬家","對朋友幫忙的感謝"],"optionsMy":["အိမ်ပြောင်းတာမကျေနပ်","သူငယ်ချင်းအိမ်ငှားခပေးစေချင်","ထပ်မပြောင်းချင်","သူငယ်ချင်းကူတာကျေးဇူးတင်"],"answer":3,"explanation":"ရှည်ရှည်ပြောစရာမလိုဘဲ ကျေးဇူးတင်မှုကို ဖော်ပြနိုင်ခဲ့ပါတယ်။","evidence":"感受到她的感謝"},{"id":"q-b1-context-23","level":"B1","wordId":"b1-23","passage":"兩個室友對冷氣溫度有不同想法。一個覺得太熱，另一個怕太冷。討論後，他們把溫度調高一點，再加上電風扇，試試看兩人能不能接受。","my":"အခန်းဖော်နှစ်ယောက် အဲကွန်းအပူချိန်အမြင်မတူဘူး။ တစ်ယောက်ပူတယ်၊ တစ်ယောက်အေးမှာကြောက်တယ်။ ဆွေးနွေးပြီး အပူချိန်နည်းနည်းတိုး၊ ပန်ကာပါဖွင့်ပြီး နှစ်ယောက်လက်ခံနိုင်လားစမ်းတယ်။","question":"他們透過討論想做到什麼？","options":["找出兩人都能接受的方式","讓一個人永遠不能用冷氣","立即搬到不同城市","不再告訴對方自己的感覺"],"optionsMy":["နှစ်ယောက်လုံးလက်ခံနိုင်တဲ့နည်းရှာ","တစ်ယောက်အဲကွန်းဘယ်တော့မှမသုံးရ","မြို့ခွဲချက်ချင်းပြောင်း","ကိုယ့်ခံစားချက်ထပ်မပြော"],"answer":0,"explanation":"နှစ်ယောက်ရဲ့လိုအပ်ချက်ကို ထည့်စဉ်းစားတဲ့နည်းကို အတူစမ်းကြည့်တာပါ။","evidence":"兩人能不能接受"},{"id":"q-b1-context-24","level":"B1","wordId":"b1-24","passage":"小安看到通知上的「請自備餐具」，不太了解。他問同學以後，才知道要自己帶筷子或湯匙，不是只帶錢去買午餐。","my":"ရှောင်အန်းက ကြေညာချက်မှာ ကိုယ့်စားသောက်ကိရိယာယူလာပါဆိုတာ မသိဘူး။ အတန်းဖော်ကိုမေးတော့ နေ့လယ်စာဝယ်ဖို့ငွေပဲယူတာမဟုတ်ဘဲ တူ ဒါမှမဟုတ်ဇွန်းကိုယ်တိုင်ယူရမယ်လို့သိတယ်။","question":"小安了解通知後，應該準備什麼？","options":["只有午餐的錢","只帶學校課本","自己使用的餐具","全班同學的午餐"],"optionsMy":["နေ့လယ်စာဖိုးပဲ","ကျောင်းစာအုပ်ပဲ","ကိုယ်သုံးမယ့်တူဇွန်း","အတန်းတစ်ခုလုံးနေ့လယ်စာ"],"answer":2,"explanation":"「自備」က ကိုယ့်ဘာသာပြင်ဆင်ယူလာတာပါ။","evidence":"自己帶筷子或湯匙"},{"id":"q-b1-context-25","level":"B1","wordId":"b1-25","passage":"小美昨天送出社團申請，今天還沒有收到回覆。朋友問她是不是已經加入了，她說還要等社團確認，送出申請不代表一定通過。","my":"ရှောင်မေ မနေ့ကအသင်းဝင်လျှောက်ပြီး ဒီနေ့အကြောင်းမပြန်သေးဘူး။ သူငယ်ချင်းက ဝင်ပြီးပြီလားမေးတော့ အသင်းအတည်ပြုဖို့စောင့်ရမယ်၊ လျှောက်ရုံနဲ့လက်ခံတာမဟုတ်ဘူးလို့ပြောတယ်။","question":"小美目前的情況是什麼？","options":["已經確定加入","已申請，正在等結果","已經收到拒絕通知","還沒交申請"],"optionsMy":["ဝင်ဖို့သေချာပြီး","လျှောက်ပြီးရလဒ်စောင့်","ငြင်းတဲ့အကြောင်းကြားချက်ရပြီး","မလျှောက်ရသေး"],"answer":1,"explanation":"「申請」နဲ့「通過」မတူပါ။ ဒီမှာ ရလဒ်စောင့်နေဆဲပါ။","evidence":"還要等社團確認"},{"id":"q-b1-context-26","level":"B1","wordId":"b1-26","passage":"小文想參加週末的讀書會。通知說不必每週都來，第一次參加也不用先讀完整本書。他覺得壓力小了，決定這星期先去聽聽。","my":"ရှောင်ဝင်ပိတ်ရက်စာဖတ်ဝိုင်းတက်ချင်တယ်။ အပတ်တိုင်းလာဖို့မလို၊ ပထမဆုံးဆို စာအုပ်အကုန်ကြိုဖတ်ဖို့လည်းမလိုလို့ စိတ်ဖိအားနည်းပြီး ဒီအပတ်အရင်သွားနားထောင်မယ်။","question":"關於這個讀書會，哪一項正確？","options":["每週都必須到場","第一次一定要做報告","沒讀完整本書不能來","新參加的人可以先聽聽"],"optionsMy":["အပတ်တိုင်းမဖြစ်မနေတက်","ပထမခေါက်အစီရင်ခံစာလုပ်ရ","စာအုပ်အကုန်မဖတ်ရင်မလာရ","အသစ်တက်သူအရင်နားထောင်လို့ရ"],"answer":3,"explanation":"ပထမဆုံးတက်ဖို့ စာအုပ်အကုန်ဖတ်ပြီးသားဖြစ်ရန် မလိုပါ။","evidence":"第一次參加也不用先讀完整本書"},{"id":"q-b1-context-27","level":"B1","wordId":"b1-27","passage":"小安星期一答應星期三完成海報。星期二他已經做好了，但先請同學檢查時間和地點是否正確，確認沒有錯才交給老師。","my":"ရှောင်အန်းက တနင်္လာမှာ ဗုဒ္ဓဟူးပိုစတာပြီးမယ်လို့ကတိပေးတယ်။ အင်္ဂါနေ့လုပ်ပြီးပေမယ့် အချိန်နဲ့နေရာမှန်လား အတန်းဖော်စစ်ခိုင်းပြီးမှ ဆရာ့ကိုပေးတယ်။","question":"小安做好海報以後，為什麼沒有立刻交？","options":["他想先檢查重要資訊","他已經忘了老師是誰","他決定不要完成海報","他還沒有選任何圖片"],"optionsMy":["အရေးကြီးအချက်အလက်အရင်စစ်ချင်","ဆရာဘယ်သူလဲမေ့","ပိုစတာမပြီးဖို့ဆုံးဖြတ်","ပုံလုံးဝမရွေးရသေး"],"answer":0,"explanation":"လုပ်ပြီးသော်လည်း အမှားမရှိအောင် ထပ်စစ်တာပါ။","evidence":"先請同學檢查時間和地點是否正確"},{"id":"q-b1-context-28","level":"B1","wordId":"b1-28","passage":"室友提醒小美，明天垃圾車會提早半小時來。小美本來打算照平常時間出門，聽到提醒後，就把手機鬧鐘也調早了。","my":"အခန်းဖော်က မနက်ဖြန်အမှိုက်ကားနာရီဝက်စောလာမယ်လို့ ရှောင်မေကိုသတိပေးတယ်။ မူလပုံမှန်အချိန်ထွက်မလို့ပေမယ့် သိရတော့ ဖုန်းနှိုးစက်လည်းစောထားလိုက်တယ်။","question":"提醒讓小美改變了什麼？","options":["明天不再倒垃圾","把垃圾車時間改晚","提早準備出門","請垃圾車等一小時"],"optionsMy":["မနက်ဖြန်အမှိုက်မပစ်တော့","အမှိုက်ကားအချိန်နောက်ရွှေ့","စောစောထွက်ဖို့ပြင်","အမှိုက်ကားတစ်နာရီစောင့်ခိုင်း"],"answer":2,"explanation":"ကားစောလာမယ်လို့သိတော့ ကိုယ့်ထွက်ချိန်ကိုပါ စောထားတာပါ။","evidence":"把手機鬧鐘也調早了"},{"id":"q-b1-context-29","level":"B1","wordId":"b1-29","passage":"小文的手機沒有電，沒辦法聯絡等他的朋友。他向車站服務人員借電話，簡單說明自己在哪裡，請朋友在原來約好的地方等。","my":"ရှောင်ဝင်ဖုန်းအားကုန်လို့ စောင့်နေတဲ့သူငယ်ချင်းကို မဆက်သွယ်နိုင်ဘူး။ ဘူတာဝန်ထမ်းဆီဖုန်းငှားပြီး ကိုယ်ဘယ်မှာလဲပြောကာ မူလချိန်းနေရာမှာစောင့်ဖို့ပြောတယ်။","question":"小文怎麼解決無法聯絡朋友的問題？","options":["一直在原地不做任何事","借用電話告訴朋友位置","把見面地點改成另一個城市","請朋友自己猜他在哪裡"],"optionsMy":["နေရာမှာဘာမှမလုပ်ဘဲနေ","ဖုန်းငှားပြီးနေရာပြော","တွေ့ရာကိုအခြားမြို့ပြောင်း","သူငယ်ချင်းကိုနေရာခန့်မှန်းခိုင်း"],"answer":1,"explanation":"ကိုယ့်ဖုန်းမသုံးနိုင်ပေမယ့် ဖုန်းငှားပြီး ဆက်သွယ်နိုင်ခဲ့တယ်။","evidence":"向車站服務人員借電話"},{"id":"q-b1-context-30","level":"B1","wordId":"b1-30","passage":"店員說外帶餐點十分鐘後可以取。小安確認了一次：「是六點二十分，不是六點十分，對嗎？」店員說對，小安才走去旁邊買水果。","my":"ဆိုင်ဝန်ထမ်းက ပါဆယ်အစားအစာကို ဆယ်မိနစ်နောက်ယူလို့ရတယ်လို့ပြောတယ်။ ရှောင်အန်းက ခြောက်နာရီနှစ်ဆယ်၊ ခြောက်နာရီဆယ်မဟုတ်ဘူးနော်လို့စစ်တော့ ဟုတ်တယ်ဆိုမှ ဘေးမှာသစ်သီးသွားဝယ်တယ်။","question":"小安確認的是什麼資訊？","options":["餐點有沒有加辣","水果的價格","店家明天是否營業","可以取餐的時間"],"optionsMy":["အစားအစာစပ်လား","သစ်သီးဈေး","မနက်ဖြန်ဆိုင်ဖွင့်လား","အစားအစာယူနိုင်ချိန်"],"answer":3,"explanation":"အချိန်နှစ်ခုကို ပြန်မေးတာက ယူရမယ့်အချိန် သေချာစေဖို့ပါ။","evidence":"是六點二十分，不是六點十分"},{"id":"q-b1-context-31","level":"B1","wordId":"b1-31","passage":"小美原本訂了兩間房，後來一位朋友不能去，只需要一間。她打電話取消其中一間，並確認另一間的訂房仍然保留。","my":"ရှောင်မေမူလအခန်းနှစ်ခန်းဘိုကင်ထားပြီး သူငယ်ချင်းတစ်ယောက်မသွားနိုင်တော့ တစ်ခန်းပဲလိုတယ်။ ဖုန်းဆက်တစ်ခန်းပယ်ဖျက်ပြီး နောက်တစ်ခန်းဘိုကင်ရှိနေဆဲလားစစ်တယ်။","question":"小美最後希望保留幾間房？","options":["一間","兩間","三間","一間都不要"],"optionsMy":["တစ်ခန်း","နှစ်ခန်း","သုံးခန်း","တစ်ခန်းမှမလို"],"answer":0,"explanation":"「其中一間」ကိုပဲပယ်ဖျက်တာမို့ နောက်တစ်ခန်းကျန်ပါတယ်။","evidence":"另一間的訂房仍然保留"},{"id":"q-b1-context-32","level":"B1","wordId":"b1-32","passage":"今天的戶外活動沒有取消，只是因為雨太大，延後一週。老師請已經報名的同學保留資料，下星期同一天再集合。","my":"ဒီနေ့ပြင်ပလှုပ်ရှားမှုက ပယ်ဖျက်တာမဟုတ်ဘဲ မိုးကြီးလို့ တစ်ပတ်နောက်ရွှေ့တာပါ။ စာရင်းပေးပြီးသူတွေကို စာရွက်သိမ်းထားပြီး နောက်အပတ်အဲဒီနေ့ပဲစုဖို့ ဆရာပြောတယ်။","question":"這個活動現在怎麼安排？","options":["永遠不再舉行","今天晚上一定舉行","改到下星期同一天","明天重新報名才可以參加"],"optionsMy":["ဘယ်တော့မှမကျင်းပတော့","ဒီညသေချာကျင်းပ","နောက်အပတ်အဲဒီနေ့ပြောင်း","မနက်ဖြန်အသစ်စာရင်းပေးမှတက်လို့ရ"],"answer":2,"explanation":"「延後一週」ဆိုတာ နောက်အပတ်သို့အချိန်ရွှေ့တာ၊ လုံးဝပယ်ဖျက်တာ မဟုတ်ပါ။","evidence":"下星期同一天再集合"},{"id":"q-b1-context-33","level":"B1","wordId":"b1-33","passage":"小安的班原本晚上六點下班，今天店裡提早關門，店長讓他提前一小時回家。他沒有加班，反而能和家人一起吃晚飯。","my":"ရှောင်အန်းမူလညခြောက်နာရီအလုပ်ဆင်းရမယ်။ ဒီနေ့ဆိုင်စောပိတ်လို့ ဆိုင်မန်နေဂျာက တစ်နာရီစောပြန်ခွင့်ပေးတယ်။ အချိန်ပိုမလုပ်ရဘဲ မိသားစုနဲ့ညစာစားနိုင်တယ်။","question":"小安今天幾點可以下班？","options":["下午四點","下午五點","晚上六點","晚上七點"],"optionsMy":["နေ့လယ်လေးနာရီ","ညနေငါးနာရီ","ညခြောက်နာရီ","ညခုနစ်နာရီ"],"answer":1,"explanation":"ခြောက်နာရီထက်တစ်နာရီ「提前」ဆိုတော့ ငါးနာရီပါ။","evidence":"提前一小時回家"},{"id":"q-b1-context-34","level":"B1","wordId":"b1-34","passage":"小文要去郵局寄包裹，發現圖書館就在旁邊。他把到期的書也帶上，打算寄完包裹後順便還書，這樣不用再出門一次。","my":"ရှောင်ဝင်ပါဆယ်ပို့ဖို့စာတိုက်သွားမယ်။ ဘေးမှာစာကြည့်တိုက်ရှိလို့ ပြန်အပ်ရမယ့်စာအုပ်ပါယူပြီး ပို့ပြီးရင်တစ်လက်စတည်းအပ်မယ်။ ဒါဆိုနောက်တစ်ခေါက်ထွက်စရာမလိုဘူး။","question":"小文為什麼把書一起帶出門？","options":["包裹裡只能放書","郵局要求每人帶一本書","他要在郵局買書","可以順路去旁邊的圖書館還書"],"optionsMy":["ပါဆယ်ထဲစာအုပ်ပဲထည့်ရ","စာတိုက်ကတစ်ယောက်တစ်အုပ်ယူခိုင်း","စာတိုက်မှာစာအုပ်ဝယ်မယ်","ဘေးစာကြည့်တိုက်ဝင်အပ်နိုင်"],"answer":3,"exp /* ===== 生活對話教材格式 =====
   SCENE({id, name, my, place, goal, goalMy, words:[[中文, 緬文, 補充?]], axis:{1:[中,緬],2:..,3:..}})
   V(scene, 級, id, {who, tr?, setup, setupMy}, [節點...])
   節點（照順序走；選項有 go 就跳到該 id）：
     H(中文, 緬文, {easy, easyMy, bc, q:[Q..], learn:[中,緬], who})   對方說話（bc=廣播，只能重播／放慢）
     SAY(要表達的意思, 緬文, [[積木,緬文]...], 參考答案, 緬文, {alt:[其他說法]})   你先開口
     ACT(題目, 緬文, [O(...)...])   你怎麼接
     O(中文, 緬文, 判定 ok|part|bad, 說明, 說明緬文, go?)   判定：ok 可以繼續／part 需要補充／bad 會出錯
     END(結果, 緬文, res)   res：ok／late（出錯後補救）
   Q(問題, 緬文, [[中,緬],[中,緬],[中,緬]], 正確答案位置=0)   選項執行時會打亂
*/
const TALK = [];
function SCENE(o) { o.vars = []; TALK.push(o); return o; }
function H(zh, my, o) { return Object.assign({ t: 'hear', zh: zh, my: my }, o || {}); }
function Q(q, qMy, o, a) { return { q: q, qMy: qMy, o: o, a: a || 0 }; }
function SAY(intent, intentMy, skel, ans, ansMy, o) { return Object.assign({ t: 'say', intent: intent, intentMy: intentMy, skel: skel, ans: ans, ansMy: ansMy }, o || {}); }
function ACT(q, qMy, o) { return { t: 'act', q: q, qMy: qMy, o: o }; }
function O(zh, my, r, why, whyMy, go) { return { zh: zh, my: my, r: r, why: why, whyMy: whyMy, go: go || null }; }
function END(text, textMy, res) { return { t: 'end', text: text, textMy: textMy, res: res || 'ok' }; }
function V(sc, lv, id, meta, nodes) { sc.vars.push(Object.assign({ id: id, lv: lv, nodes: nodes }, meta)); }

     第一個選項是正確答案（執行時會打亂）。
     能力：detail 細節、number 數字時間、infer 推論、main 主旨、attitude 態度意思、next 接下來、place 地點身分、vocab 詞彙、grammar 語法、connect 連接詞

  [['分類', 'ခွဲခြား'], ['回收', 'ပြန်လည်အသုံးချ'], ['退回', 'ပြန်ပေး'], ['必須', 'ရမယ်']]);
PARA('rp04', 'B1-', '珍珠奶茶', '珍珠奶茶是很多人喜歡的飲料，（1）它的熱量其實很高。一杯全糖的珍奶，熱量（2）一碗白飯。專家建議，想喝的話可以選半糖或微糖，（3）一個星期不要喝超過兩杯。',

PARA('rp05', 'B1', '寫給老師的信', '張老師您好：我是三年級的林明。很抱歉，我明天因為要去醫院做檢查，（1）參加期中考。請問我可以（2）時間補考嗎？醫院的證明我會（3）交給系辦公室。謝謝老師。',

PARA('rp06', 'B1', '大學生打工', '很多大學生會在課餘時間打工。打工（1）能賺錢，還能累積工作經驗。（2），如果打工的時間太長，就可能影響學業。所以，學生應該好好（3）自己的時間，在學習和工作之間找到平衡。',

function studyNext(known) {
  const s = NAV.sheet, id = s.ids[s.i];
  mark(id, !!known);
  if (!known && !s.requeued) { s.requeue = s.requeue || []; if (s.requeue.indexOf(id) < 0 && s.ids.length < 40) { s.ids.push(id); s.requeue.push(id); } }
  save();
  if (s.i + 1 < s.ids.length) { s.i++; s.show = false; render(); autoPlayCard(); return; }
  const uniq = [...new Set(s.ids)];
  if (s.then === 'quiz') return startQuiz(uniq, { tag: s.tag, unit: s.unit, title: '၅ စက္ကန့် စမ်းသပ်' });
  if (s.then === 'screens') return startScreens(3, 'ui');

  NAV.sheet = { v: 'done', title: s.title, msg: 'စကားလုံး ' + MYNUM(uniq.length) + ' လုံး ပြီးပြီ' };
  render();
}

/* ---- 5 秒測驗（照 Chin Chin Chinese 的玩法：看字選意思，兩個選項，5 秒） ---- */
function startQuiz(ids, opt) {
  stopAll();
  const pool = ids.length >= 4 ? ids : Object.keys(WORDS).filter(k => WORDS[k].src === WORDS[ids[0]].src);
  const qs = shuffle(ids).map(id => {
    const w = WORDS[id];
    let d, tries = 0;
    do { d = WORDS[pick(pool)]; tries++; } while ((d.id === id || d.my === w.my) && tries < 50);
    const top = Math.random() < .5;
    return { id: id, o: top ? [w.my, d.my] : [d.my, w.my], a: top ? 0 : 1 };
  });
  NAV.sheet = Object.assign({ v: 'quiz', qs: qs, i: 0, res: [], sel: null, title: '၅ စက္ကန့် စမ်းသပ်', sec: 5, tag: null, unit: null }, opt || {});
  render(); quizStart();
}
function quizStart() {
  const s = NAV.sheet; if (!s || s.v !== 'quiz') return;
  s.sel = null; s.t0 = now();
  const q = s.qs[s.i];
  playWord(WORDS[q.id]);
  requestAnimationFrame(() => { const t = $('.timer'); if (!t) return; t.classList.add('run'); const i = t.querySelector('i'); i.style.transitionDuration = s.sec + 's'; i.style.width = '0%'; });
  clearTimeout(s.timer); s.timer = setTimeout(() => quizAnswer(-1), s.sec * 1000 + 80);
}
SHEETS.quiz = function (s) {
  const q = s.qs[s.i], w = WORDS[q.id];
  let h = sheetHead(s.title, s.i + 1, s.qs.length);
  h += '<div class="wordcard" style="padding:30px 18px"><div class="big' + (w.zh.length > 4 ? ' long' : '') + '">' + zy(w.zh) + '</div>' + playBtn(q.id) + '</div><div class="timer kraft" style="margin:16px 0"><i></i></div><div>';
  q.o.forEach((o, k) => {
    let c = '';
    if (s.sel != null) c = k === q.a ? ' ok' : (k === s.sel ? ' bad' : ' dim');
    h += '<button class="opt' + c + '" data-a="qans" data-k="' + k + '"' + (s.sel != null ? ' disabled' : '') + '><span class="k">' + (k + 1) + '</span><span lang="my" style="font-family:var(--my)">' + esc(o) + '</span></button>';
  });
  h += '</div>';
  if (s.sel === -1) h += '<div class="fb bad">' + B('အချိန်ပြည့်ပြီ') + '</div>';
  return h;
};
function quizAnswer(k) {
  const s = NAV.sheet; if (!s || s.v !== 'quiz' || s.sel != null) return;
  clearTimeout(s.timer);
  const q = s.qs[s.i]; const ok = k === q.a;
  s.sel = k; s.res.push({ id: q.id, ok: ok, ms: now() - s.t0, to: k === -1 });
  mark(q.id, ok); save();
  sfx(ok ? 'pass' : 'fail');
  render();
  setTimeout(() => {
    if (NAV.sheet !== s) return;
    if (s.i + 1 < s.qs.length) { s.i++; s.sel = null; render(); quizStart(); }
    else quizFinish();
  }, ok ? 650 : 1300);
}
function quizFinish() {
  const s = NAV.sheet;
  const n = s.res.filter(r => r.ok).length;
  if (s.unit) S.units[s.unit] = Math.max(S.units[s.unit] || 0, n);
  if (s.tag) doneTask(s.tag);
  save();
  NAV.sheet = { v: 'qres', res: s.res, title: s.title, again: s.qs.map(q => q.id), tag: s.tag, unit: s.unit };
  render();
}
SHEETS.qres = function (s) {
  const n = s.res.filter(r => r.ok).length;
  const wrong = s.res.filter(r => !r.ok);
  let h = sheetHead(s.title);
  h += '<div class="card center">' + MASCOT(n === s.res.length ? 'cheer' : n >= s.res.length / 2 ? 'happy' : 'think', 84, 'bob') + '<div class="score">' + n + '<small> / ' + s.res.length + '</small></div><p class="small muted">' + B(n === s.res.length ? 'အကုန်မှန်တယ် 🎉' : 'မှားတဲ့စကားလုံး မကြာခင် ပြန်ပေါ်လာမယ်') + '</p></div>';
  if (wrong.length) {
    h += '<div class="sec"><h2>' + B('မှားခဲ့တဲ့ စကားလုံး') + '</h2></div><div class="list">';

  h += '<div style="margin-top:16px">' + endBtn() + '</div><button class="linkbtn" data-a="qagain">' + esc('ထပ်စမ်းမယ်') + '</button>';
  return h;
};

/* ===== 生活對話：對方先說 → 聽懂 → 回答小問題 → 選怎麼接（照日文 App 的流程） ===== */
const SC_ICON = { sbux: 'cup', boba: 'boba', cvs: 'store', bfast: 'egg', mrt: 'train', school: 'school' };
function findVar(vid) { for (const sc of TALK) { const v = sc.vars.find(x => x.id === vid); if (v) return { sc, v }; } return null; }
function varRank(vid) { const t = S.talk[vid]; return t ? t.best : null; }
function sceneDone(sc) { return sc.vars.filter(v => S.talk[v.id]).length; }
function nextVar(sc) {
  // 先一般版本，再換說法；照級數
  for (const lv of [1, 2, 3]) for (const v of sc.vars.filter(x => x.lv === lv)) if (!S.talk[v.id]) return v;
  return sc.vars.slice().sort((a, b) => (S.talk[a.id].last || 0) - (S.talk[b.id].last || 0))[0];
}
function recommendVar() {
  // 首頁推薦：還沒練過的最低級數；都練過就挑最久沒練的
  for (const lv of [1, 2, 3]) for (const sc of TALK) for (const v of sc.vars.filter(x => x.lv === lv && !x.tr)) if (!S.talk[v.id]) return v.id;
  for (const lv of [1, 2, 3]) for (const sc of TALK) for (const v of sc.vars.filter(x => x.lv === lv)) if (!S.talk[v.id]) return v.id;
  let best = null; TALK.forEach(sc => sc.vars.forEach(v => { if (!best || (S.talk[v.id].last || 0) < (S.talk[best].last || 0)) best = v.id; }));
  return best;
}

/* ---- 出題 ---- */
function rankItems(pool, target, s) {
  return pool.map(it => ({ it, sc: Math.abs(it.b - target) + (itemSeen(it) ? .6 : 0) + Math.random() * .35 - (s.fam ? Math.min(famSeen(it), 3) * .08 : 0) + (it.type === 'old' ? .15 : 0) }))

  for (const it of rankItems(lvPool, target, s)) { if (n >= s.count) break; out.push(it); n += it.qs.length; }

  if (!nx && skipN) h += '<button class="btn block" data-a="retrySkipped">' + B('ကျော်ထားတဲ့ အဆင့်တွေ ပြန်လုပ်မယ်') + '</button>';
  h += '<button class="journey-link" data-a="tab" data-t="talk"><span>' + ICON.chat + B('စကားပြော ယူနစ်များ') + '</span><span aria-hidden="true">›</span></button>';
  return h;
};

function runTask(t) {
  const day = ensureDay();
  if (t === 'new') startStudy(day.newIds, { then: 'quiz', tag: 'new', title: 'စကားလုံးအသစ်' });
  else if (t === 'rev') startStudy(day.rev, { recall: true, tag: 'rev', title: 'ပြန်လေ့ကျင့်' });
  else if (t === 'talk') {
    if (S.run && !S.run.end && S.run.vid === day.talk) { S.run.tag = 'talk'; NAV.sheet = { v: 'talk' }; save(); render(); talkAuto(); }
    else startTalk(day.talk, 'talk');
  }
  else if (t === 'ui') startStudy(day.ui, { then: 'screens', tag: null, title: 'ဖုန်းထဲက စကားလုံး' });
  else if (t === 'listen') startPractice({ skill: 'listening', mode: 'guided', count: 5, level: 'all', type: 'all', tag: 'listen' });
}

function flowNext() {

/* ---- 畫面 ---- */
function applySettings() {
  const r = document.documentElement;
  if (S.set.theme === 'auto') r.removeAttribute('data-theme'); else r.setAttribute('data-theme', S.set.theme);
  r.setAttribute('data-size', S.set.size);
  document.body.classList.toggle('hide-my', !S.set.my);
  document.body.classList.toggle('hide-zy', !S.set.zy);
  r.classList.toggle('motion-reduce', S.set.motion === 'reduce');
}
let lastKey = '';
function render() {
  applySettings();
  const sh = NAV.sheet;
  document.body.classList.toggle('sheet-mode', !!sh);
  let h;
  if (sh) h = SHEETS[sh.v](sh);
  else {
    const top = NAV.stack[NAV.stack.length - 1];
    h = (top ? '' : '<header class="top"><div class="brand"><b>' + zy('明白') + '</b></div><button class="gear" data-a="go" data-v="me" aria-label="settings">' + ICON.gear + '</button></header>') +
      (top ? VIEWS[top.v](top) : VIEWS[NAV.tab]());
  }
  const key0 = sh ? (sh.v === 'pr' ? 'pr:' + (sh.cur ? sh.cur.id : sh.phase) + ':' + sh.qi : sh.v + ':' + (sh.i != null ? sh.i : '') + ':' + (sh.t || '')) : 'p:' + NAV.tab + ':' + NAV.stack.length + ':' + (NAV.stack.length ? JSON.stringify(NAV.stack[NAV.stack.length - 1]) : '');

  NAV.dir = null;
  $('#app').innerHTML = '<main class="' + (sh ? 'sheet' : 'page') + ' ' + anim + '">' + h + '</main>';
  if (sh && !sh._cele) {
    const win = (sh.v === 'alldone' && daySteps().every(x => ensureDay().done[x.t])) || sh.v === 'done' || (sh.v === 'qres' && sh.res.every(r => r.ok)) || (sh.v === 'prres' && sh.src.ans.length && sh.src.ans.filter(a => a.ok).length / sh.src.ans.length >= .8) || (sh.v === 'talk' && S.run && S.run.end);
    if (win) { sh._cele = true; sfx('done'); setTimeout(confetti, 120); }
  }
  $('#nav').innerHTML = '<div class="nav-in">' + TABS.map(t => '<button class="' + (NAV.tab === t[0] ? 'on' : '') + '" data-a="tab" data-t="' + t[0] + '">' + t[2] + '<span class="lbl" lang="my">' + esc(t[1]) + '</span></button>').join('') + '</div>';
  const key = key0;
  if (key !== lastKey && !(sh && sh.v === 'talk')) window.scrollTo(0, 0);
  if (sh && sh.v === 'talk' && !lastKey.startsWith('talk')) window.scrollTo(0, 0);
  lastKey = key;
}

document.addEventListener('change', e => {
  if (e.target.id === 'voiceSel') { S.set.voice = e.target.value; save(); speak('你好，我們開始練習吧。'); }
  if (e.target.id === 'trackSel') { S.track = e.target.value; if (S.day && !S.day.done.new) S.day.newIds = trackWords().filter(id => !(S.w[id] && S.w[id].seen)).slice(0, 5); save(); toast('ပြောင်းပြီးပြီ'); }
});
document.addEventListener('toggle', e => { if (e.target.id === 'prmore') NAV.prMore = e.target.open; }, true);
document.addEventListener('visibilitychange', () => { if (document.hidden) { stopAll(); } });
if (TTS.ok && speechSynthesis.addEventListener) speechSynthesis.addEventListener('voiceschanged', () => { if (NAV.stack.length && NAV.stack[NAV.stack.length - 1].v === 'me' && !NAV.sheet) render(); });
render();

</script>
</body>
</html>
