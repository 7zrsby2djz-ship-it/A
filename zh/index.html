<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<meta name="description" content="明白：緬文介面的中文學習路線、生活對話、單字與 TOCFL 練習。">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>明白 · နားလည်ပြီ</title>
<meta name="theme-color" content="#F3F1EB" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1A1A19" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="明白">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Myanmar:wght@400;500&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
/* 明白 — 無印風：米白紙、襯衫藍、細線、留白 */
:root{
  --bg:#F3F1EB; --paper:#FBFAF6; --card:#FFFFFF; --ink:#2A2926; --ink2:#6E6A63; --ink3:#A19C93;
  --line:#E2DDD2; --line2:#D2CCBF; --blue:#3B5A82; --blue2:#5C7BA3; --blue-soft:#E7EDF4; --blue-ink:#22385A;
  --kraft:#D8C7A3; --kraft-soft:#F1EADB; --ok:#4E7351; --ok-soft:#E6EEE3; --warn:#A06A1F; --warn-soft:#F5EBDA;
  --bad:#9C3B2E; --bad-soft:#F4E3DF; --shadow:0 1px 0 rgba(0,0,0,.03);
  --zh:"Noto Sans TC","PingFang TC","Heiti TC",system-ui,sans-serif; --my:"Noto Sans Myanmar","Myanmar Text","Padauk",sans-serif;
  --fs:17px; --r:14px; --nav:64px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1A1A19; --paper:#20201E; --card:#262624; --ink:#ECE9E2; --ink2:#AAA59C; --ink3:#77736C;
  --line:#353431; --line2:#46443F; --blue:#9DB6D8; --blue2:#7F9CC4; --blue-soft:#273141; --blue-ink:#C9D8EC;
  --kraft:#8C7A57; --kraft-soft:#2E2A22; --ok:#9CC29B; --ok-soft:#24301F; --warn:#E0B26B; --warn-soft:#352B1C;
  --bad:#E39C8F; --bad-soft:#3A2420; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#1A1A19; --paper:#20201E; --card:#262624; --ink:#ECE9E2; --ink2:#AAA59C; --ink3:#77736C;
  --line:#353431; --line2:#46443F; --blue:#9DB6D8; --blue2:#7F9CC4; --blue-soft:#273141; --blue-ink:#C9D8EC;
  --kraft:#8C7A57; --kraft-soft:#2E2A22; --ok:#9CC29B; --ok-soft:#24301F; --warn:#E0B26B; --warn-soft:#352B1C;
  --bad:#E39C8F; --bad-soft:#3A2420; color-scheme:dark;}
:root[data-size="l"]{--fs:19px}
:root[data-size="s"]{--fs:15.5px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:var(--zh);font-size:var(--fs);line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden;min-height:100vh}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
.my,[lang="my"]{font-family:var(--my);line-height:1.9}
small.my{display:block;font-size:.72em;color:var(--ink2);font-weight:400;letter-spacing:0}
.hide-my .my{display:none!important}
.hide-my .my-reveal{display:inline-flex!important}
.my-reveal{display:none!important}

/* 注音 */
/* 每個字上方放注音，用絕對定位，字距不會被注音撐開 */
.zc{position:relative;display:inline-block;text-indent:0}
.zt{position:absolute;left:50%;bottom:calc(100% - .28em);transform:translateX(-50%);font-size:.36em;line-height:1;white-space:nowrap;color:var(--ink2);font-weight:400;letter-spacing:-.06em;pointer-events:none;font-family:var(--zh)}
.hide-zy .zt{display:none}
body:not(.hide-zy){line-height:2.05}
body:not(.hide-zy) .zc{margin:0 .05em}
.big .zt{font-size:.26em;bottom:calc(100% - .2em)}
.btn.pri .zt{color:inherit;opacity:.75}
.nav .zt{display:none}
.hl{color:var(--blue);font-weight:700;border-bottom:1.5px solid var(--blue2)}

/* 外框 */
#app{max-width:540px;margin:0 auto;min-height:100vh;padding:0 16px calc(var(--nav) + 28px + env(safe-area-inset-bottom));position:relative}
.top{display:flex;align-items:flex-end;justify-content:space-between;padding:22px 2px 14px;gap:12px}
.brand{display:flex;align-items:baseline;gap:10px}
.brand b{font-size:1.45rem;letter-spacing:.12em;font-weight:500}
.brand .my{font-size:.78rem;color:var(--ink2)}
.tag{display:inline-flex;flex-direction:column;align-items:flex-end;font-size:.72rem;color:var(--ink2);line-height:1.35;text-align:right}
.tag b{font-weight:500;color:var(--ink);font-size:.8rem;letter-spacing:.06em}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--paper) 94%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav-in{max-width:540px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--nav)}
.nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.7rem;color:var(--ink3);position:relative}
.nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.5}
.nav button.on{color:var(--blue)}
.nav button.on::before{content:"";position:absolute;top:0;left:30%;right:30%;height:2px;background:var(--blue);border-radius:0 0 2px 2px}
.nav .my{font-size:.58rem;line-height:1.3;color:inherit;display:block}

/* 基本元件 */
h1,h2,h3{font-weight:500;margin:0}
h1{font-size:1.35rem;letter-spacing:.04em}
h2{font-size:1.08rem;letter-spacing:.04em}
.sec{margin:22px 0 10px;display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.sec h2 small.my{display:inline;margin-left:8px}
.sec .meta{font-size:.78rem;color:var(--ink2)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.card+.card{margin-top:10px}
.paper{background:var(--paper)}
.muted{color:var(--ink2)}
.small{font-size:.82rem}
.tiny{font-size:.72rem;color:var(--ink3)}
.row{display:flex;align-items:center;gap:10px}
.row.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.stack>*+*{margin-top:10px}
.grow{flex:1;min-width:0}
.center{text-align:center}
hr.thin{border:0;border-top:1px solid var(--line);margin:14px 0}
.btn{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:0;min-height:48px;padding:8px 18px;border-radius:12px;border:1px solid var(--line2);background:var(--card);font-weight:500;text-align:center;line-height:1.35}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
:root[data-theme="dark"] .btn.pri{color:#14202f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.pri{color:#14202f}}
.btn.ghost{background:transparent}
.btn.block{display:flex;width:100%}
.btn.sm{min-height:38px;padding:4px 12px;font-size:.88rem;border-radius:10px}
.btn:disabled{opacity:.45;cursor:default}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn .my{color:inherit;opacity:.8}
.btns{display:grid;gap:10px}
.btns.two{grid-template-columns:1fr 1fr}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;border:1px solid var(--line2);background:var(--card);font-size:.84rem;line-height:1.4}
.chip.on{background:var(--blue-soft);border-color:var(--blue2);color:var(--blue-ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.seg{display:flex;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;padding:8px 6px;border-radius:9px;font-size:.88rem;color:var(--ink2);line-height:1.3}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 0 0 1px var(--line2)}
.seg button .my{font-size:.62rem}
.pill{display:inline-block;font-size:.7rem;padding:1px 8px;border-radius:999px;border:1px solid var(--line2);color:var(--ink2);white-space:nowrap}
.pill.blue{border-color:var(--blue2);color:var(--blue)}
.pill.ok{border-color:var(--ok);color:var(--ok)}
.pill.kraft{background:var(--kraft-soft);border-color:var(--kraft);color:var(--ink)}
.icon{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.6;flex:none}
.ib{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;background:var(--card);flex:none}
.ib.on{color:var(--blue);border-color:var(--blue2);background:var(--blue-soft)}
.ib.star.on svg{fill:currentColor}
.list{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.li{display:flex;align-items:center;gap:12px;padding:13px 14px;border-top:1px solid var(--line);width:100%;text-align:left}
.li:first-child{border-top:0}
.li .no{font-size:.72rem;color:var(--ink3);width:26px;flex:none;font-variant-numeric:tabular-nums;letter-spacing:.04em}
.li .arr{color:var(--ink3)}
.bar{height:3px;background:var(--line);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--blue);border-radius:2px;transition:width .3s}
.dots{display:flex;gap:4px}
.dots i{width:7px;height:7px;border-radius:50%;border:1px solid var(--line2);display:block}
.dots i.t{background:var(--kraft);border-color:var(--kraft)}
.dots i.l{background:var(--blue);border-color:var(--blue)}
.note{border-left:2px solid var(--kraft);background:var(--kraft-soft);padding:10px 12px;border-radius:0 10px 10px 0;font-size:.88rem}
.note.blue{border-color:var(--blue2);background:var(--blue-soft)}
.empty{padding:28px 10px;text-align:center;color:var(--ink2);font-size:.9rem}

/* 今天 */
.hello{padding:4px 2px 2px}
.hello p{margin:4px 0 0;color:var(--ink2);font-size:.9rem}
.task{display:flex;align-items:center;gap:14px;padding:14px;width:100%;text-align:left;border-top:1px solid var(--line)}
.task:first-child{border-top:0}
.task .ck{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line2);display:flex;align-items:center;justify-content:center;flex:none;font-size:.75rem;color:var(--ink3)}
.task.done .ck{background:var(--blue);border-color:var(--blue);color:#fff}
.task.done .t1{color:var(--ink2)}
.task .t1{font-weight:500}
.task .t2{font-size:.78rem;color:var(--ink2)}
.resume{border:1px dashed var(--blue2);background:var(--blue-soft);color:var(--blue-ink)}

/* 單字卡 */
.sheet{min-height:calc(100vh - 40px);padding-top:10px}
.shead{display:flex;align-items:center;gap:12px;padding:10px 0 14px}
.shead .grow{font-size:.85rem;color:var(--ink2)}
.wordcard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:26px 18px 20px;text-align:center;position:relative}
.wordcard .big{font-size:2.9rem;font-weight:500;letter-spacing:.06em;line-height:1.5;margin:8px 0 2px}
.wordcard .big.long{font-size:2.1rem}
.wordcard .mean{font-size:1.15rem;margin-top:4px}
.wordcard .no{position:absolute;top:12px;left:14px;font-size:.7rem;color:var(--ink3);letter-spacing:.08em}
.wordcard .src{position:absolute;top:12px;right:14px}
.ex{margin-top:18px;padding-top:14px;border-top:1px solid var(--line);text-align:left}
.ex .zh{font-size:1.05rem;line-height:2.1}
.ex .my{font-size:.88rem;color:var(--ink2)}
.reveal{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;color:var(--blue);border:1px dashed var(--blue2);border-radius:999px;padding:3px 12px;margin-top:6px}
.play{display:inline-flex;align-items:center;justify-content:center;width:52px;height:52px;border-radius:50%;border:1px solid var(--line2);background:var(--paper);margin:6px auto 0}
.play.sm{width:36px;height:36px}
.play.busy{border-color:var(--blue);color:var(--blue)}

/* 測驗 */
.timer{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin:4px 0 18px}
.timer i{display:block;height:100%;background:var(--blue);width:100%}
.timer.run i{transition:width linear}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px 16px;border:1px solid var(--line2);border-radius:14px;background:var(--card);min-height:58px;line-height:1.5}
.opt+.opt{margin-top:10px}
.opt .k{width:24px;height:24px;border-radius:50%;border:1px solid var(--line2);font-size:.72rem;display:flex;align-items:center;justify-content:center;color:var(--ink3);flex:none}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ok .k{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.sel{border-color:var(--blue);background:var(--blue-soft)}
.opt.dim{opacity:.55}
.fb{margin-top:14px;padding:12px 14px;border-radius:12px;font-size:.92rem}
.fb.ok{background:var(--ok-soft);color:var(--ok)}
.fb.part{background:var(--warn-soft);color:var(--warn)}
.fb.bad{background:var(--bad-soft);color:var(--bad)}
.fb .why{color:var(--ink);margin-top:4px}
.score{font-size:3rem;font-weight:300;letter-spacing:.04em;line-height:1.2}
.score small{font-size:1.1rem;color:var(--ink2)}

/* 對話 */
.scene{display:flex;gap:14px;align-items:center;padding:16px 14px;width:100%;text-align:left;border-top:1px solid var(--line)}
.scene:first-child{border-top:0}
.scene .mk{width:46px;height:46px;border-radius:12px;background:var(--paper);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex:none;color:var(--blue)}
.scene .mk svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.4}
.board{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:8px 0 10px;border-bottom:1px solid var(--line);margin-bottom:12px}
.board .g{font-size:.8rem;color:var(--ink2)}
.board .g b{color:var(--ink);font-weight:500}
.board .got{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.board .got span{font-size:.72rem;background:var(--blue-soft);color:var(--blue-ink);border-radius:6px;padding:1px 8px}
.chat{display:flex;flex-direction:column;gap:12px}
.bub{max-width:88%;padding:12px 14px;border-radius:16px;border:1px solid var(--line);background:var(--card);line-height:2}
.bub.them{align-self:flex-start;border-top-left-radius:4px}
.bub.me{align-self:flex-end;background:var(--blue-soft);border-color:transparent;border-top-right-radius:4px;color:var(--blue-ink)}
.bub.bc{align-self:stretch;max-width:none;background:var(--paper);border-style:dashed}
.bub .who{font-size:.7rem;color:var(--ink3);display:block;line-height:1.4;margin-bottom:2px;letter-spacing:.06em}
.bub .hidden-text{color:var(--ink3);font-size:.9rem;letter-spacing:.2em}
.bub .my{font-size:.84rem;color:var(--ink2);line-height:1.8}
.bub.past{opacity:.75}
.repair{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.repair button{font-size:.78rem;padding:5px 10px;border-radius:999px;border:1px solid var(--line2);background:var(--paper);line-height:1.6;text-align:left}
.repair button:disabled{opacity:.4}
.qbox{margin-top:6px}
.qbox .q{font-weight:500;margin-bottom:10px}
.blocks{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:10px 0}
.blocks span.b{border:1px solid var(--line2);background:var(--card);border-radius:8px;padding:4px 10px;line-height:1.9;text-align:center}
.blocks span.b small.my{font-size:.6rem}
.blocks .plus{color:var(--ink3)}
.endcard{text-align:center;padding:26px 16px}
.endcard .mark{width:56px;height:56px;border-radius:50%;margin:0 auto 10px;display:flex;align-items:center;justify-content:center;background:var(--ok-soft);color:var(--ok)}
.endcard.late .mark{background:var(--warn-soft);color:var(--warn)}

/* 介面字・手機畫面 */
.phone{border:1px solid var(--line2);border-radius:26px;padding:14px;background:var(--paper);max-width:330px;margin:0 auto}
.dialog{background:var(--card);border-radius:16px;border:1px solid var(--line);overflow:hidden;text-align:center}
.dialog .dt{font-weight:600;padding:18px 16px 4px;line-height:2}
.dialog .db{font-size:.85rem;color:var(--ink2);padding:0 16px 16px;line-height:2}
.dialog .dbs{display:flex;border-top:1px solid var(--line)}
.dialog .dbs button{flex:1;padding:12px 6px;color:#2F6FD6;font-size:.95rem;line-height:1.8;border-left:1px solid var(--line)}
.dialog .dbs button:first-child{border-left:0}
.dialog .dbs button.ok{background:var(--ok-soft);color:var(--ok)}
.dialog .dbs button.bad{background:var(--bad-soft);color:var(--bad)}
.cmp{display:grid;gap:8px}
.cmp .c{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.cmp .c b{font-size:1.15rem;font-weight:500;min-width:4.5em;line-height:1.9}

/* 聽讀 */
.passage{font-size:1.08rem;line-height:2.2;padding:14px 16px;background:var(--card);border:1px solid var(--line);border-radius:14px}
.countdown{font-variant-numeric:tabular-nums;font-size:.85rem;color:var(--ink2)}
.reasons{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:1.3rem;font-weight:400}
.stat span{font-size:.7rem;color:var(--ink2)}

/* 設定 */
.set{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border-top:1px solid var(--line)}
.set:first-child{border-top:0}
.sw{width:50px;height:30px;border-radius:15px;background:var(--line2);position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.sw.on{background:var(--blue)}
.sw.on::after{transform:translateX(20px)}
textarea.code{width:100%;min-height:90px;border:1px solid var(--line2);border-radius:10px;background:var(--paper);padding:10px;font-size:.75rem;font-family:ui-monospace,monospace}
select.sel{border:1px solid var(--line2);border-radius:10px;background:var(--card);padding:8px;max-width:60%}
.toast{position:fixed;left:50%;bottom:calc(var(--nav) + 20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:.88rem;z-index:50;max-width:88vw;text-align:center}
.fade{animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}.timer.run i{transition:none}}
.sheet-mode .nav{display:none}
.sheet-mode #app{padding-bottom:40px}
.hide-my .myw.force .my{display:block!important}
.hide-my .myw.force .my-reveal{display:none!important}
.myw{display:block}
.mk{width:46px;height:46px;border-radius:12px;background:var(--paper);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex:none}
.mk svg{width:22px;height:22px}
.hidden-text{display:inline-flex;align-items:center;gap:8px}
.bub.playing{border-color:var(--blue2)}
.task:disabled{opacity:1;cursor:default}
.timer.kraft i{background:var(--kraft)}

.tiny .zt,.stat .zt,.pill .zt,.who .zt,.board .zt,.shead .grow .zt,.chip .zt,.repair .zt,.tag .zt,small .zt,.seg .zt,.t2 .zt{display:none}
body:not(.hide-zy) .tiny,body:not(.hide-zy) .stat span,body:not(.hide-zy) .seg button{line-height:1.5}
.wordcard .star-pos{position:absolute;top:10px;right:10px}
.wordcard .src{right:auto;left:62px;top:11px}
.z{display:inline}
.passage.notice{border-style:dashed;background:var(--paper)}

/* ===== v2：大字、緬文介面、少即是多 ===== */
:root{--fs:20px;--nav:76px;--r:18px}
:root[data-size="s"]{--fs:18px}
:root[data-size="l"]{--fs:23px}
.ui{font-family:var(--my);line-height:1.75;font-weight:inherit}
.ui-sub{display:block;font-family:var(--my);font-size:.82em;color:var(--ink2);line-height:1.7;font-weight:400}
.tiny{font-size:.8rem}
.small{font-size:.92rem}
h1{font-size:1.45rem}
h2{font-size:1.15rem}
.btn{min-height:58px;border-radius:16px;font-size:1.02rem;padding:10px 18px}
.btn.sm{min-height:46px;font-size:.92rem}
.btn .ui{font-weight:500}
.ib{width:50px;height:50px;border-radius:14px}
.icon{width:24px;height:24px}
.li{padding:16px;gap:14px;min-height:68px}
.li .no{display:none}
.nav-in{grid-template-columns:repeat(4,1fr)}
.nav button{font-size:.78rem;gap:4px}
.nav button svg{width:26px;height:26px}
.nav .lbl{font-family:var(--my);font-size:.84rem;line-height:1.3}
.top{padding:18px 2px 8px}
.gear{width:50px;height:50px;border-radius:14px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;background:var(--card)}
/* 首頁大按鈕 */
.hero{margin-top:18px;width:100%;border-radius:28px;background:var(--blue);color:#fff;padding:30px 22px;text-align:center;display:block;box-shadow:0 6px 18px rgba(59,90,130,.25)}
:root[data-theme="dark"] .hero{color:#14202f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .hero{color:#14202f}}
.hero .big{font-family:var(--my);font-size:2.1rem;font-weight:600;line-height:1.6;display:block}
.hero .sub{font-family:var(--my);font-size:1rem;opacity:.85;display:block;line-height:1.7}
.hero .ring{display:flex;justify-content:center;gap:8px;margin-top:14px}
.hero .ring i{width:12px;height:12px;border-radius:50%;border:2px solid currentColor;opacity:.9}
.hero .ring i.on{background:currentColor}
.hero.done{background:var(--ok-soft);color:var(--ok);box-shadow:none;border:1px solid var(--ok)}
.steps{margin-top:18px}
.step{display:flex;align-items:center;gap:14px;padding:14px 16px;border-top:1px solid var(--line);width:100%;text-align:left}
.step:first-child{border-top:0}
.step .ck{width:34px;height:34px;border-radius:50%;border:2px solid var(--line2);display:flex;align-items:center;justify-content:center;flex:none;font-size:.9rem;color:var(--ink3)}
.step.done .ck{background:var(--blue);border-color:var(--blue);color:#fff}
.step.done .ui{color:var(--ink2)}
.step.now{background:var(--blue-soft)}
/* 步驟介紹 */
.intro{text-align:center;padding:30px 10px 10px}
.intro .num{font-family:var(--my);color:var(--ink2);font-size:.95rem}
.intro .ico{width:84px;height:84px;border-radius:26px;margin:14px auto;background:var(--blue-soft);color:var(--blue);display:flex;align-items:center;justify-content:center}
.intro .ico svg{width:44px;height:44px}
.intro h1{font-family:var(--my);font-size:1.6rem;line-height:1.7;font-weight:600}
.intro p{font-family:var(--my);font-size:1.05rem;color:var(--ink2);line-height:1.9;margin:8px 0 0}
.linkbtn{display:block;margin:14px auto 0;color:var(--ink2);font-family:var(--my);font-size:.95rem;padding:10px 16px}
/* 大卡片選單 */
.bigcard{display:flex;align-items:center;gap:16px;width:100%;text-align:left;padding:20px 18px;border:1px solid var(--line);border-radius:22px;background:var(--card)}
.bigcard+.bigcard{margin-top:12px}
.bigcard .ico{width:58px;height:58px;border-radius:18px;background:var(--blue-soft);color:var(--blue);display:flex;align-items:center;justify-content:center;flex:none}
.bigcard .ico svg{width:30px;height:30px}
.bigcard .t{font-family:var(--my);font-size:1.12rem;font-weight:600;line-height:1.7;display:block}
.bigcard .d{font-family:var(--my);font-size:.88rem;color:var(--ink2);line-height:1.7;display:block}
.bigcard.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.bigcard.pri .ico{background:rgba(255,255,255,.18);color:#fff}
.bigcard.pri .d{color:rgba(255,255,255,.85)}
/* 學習卡變大 */
.wordcard{padding:30px 18px 24px;border-radius:24px}
.wordcard .big{font-size:3.6rem}
.wordcard .big.long{font-size:2.5rem}
.wordcard .mean{font-size:1.35rem}
.wordcard .mean .my,.wordcard .mean.my{font-size:1em;color:var(--ink)}
.ex .zh{font-size:1.2rem}
.ex .my{font-size:1rem}
.opt{min-height:66px;padding:16px 18px;font-size:1.08rem;border-radius:18px}
.opt .k{width:30px;height:30px;font-size:.85rem}
.passage{font-size:1.18rem}
.bub{font-size:1.1rem}
.repair button{font-size:.92rem;padding:8px 14px}
.chip{font-size:.95rem;padding:8px 14px}
.seg button{font-size:.95rem;padding:10px 6px}
.fb{font-size:1rem}
.sheet .shead .grow{font-family:var(--my);font-size:1rem}
.myw .my{color:var(--ink2)}
.hide-my .myw:not(.force) .my{display:none}
.my-reveal{font-family:var(--my)}
.more{margin-top:16px}
.more summary{font-family:var(--my);color:var(--ink2);padding:12px 4px;cursor:pointer;list-style:none}
.more summary::-webkit-details-marker{display:none}
.setlbl{font-family:var(--my);line-height:1.7}

/* ===== v3：可愛但乾淨 — 按下去有手感、換頁有動作、答對有回饋 ===== */
:root{--blue-deep:#2C4566;--pink:#F4C7CC;--pink-ink:#B85C6A;--mint:#CFE6D3;--sun:#F6D98B;--press:4px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--blue-deep:#6F8DB8;--pink:#5A3A40;--pink-ink:#F0A9B4;--mint:#2D4433;--sun:#5C4B23}}
:root[data-theme="dark"]{--blue-deep:#6F8DB8;--pink:#5A3A40;--pink-ink:#F0A9B4;--mint:#2D4433;--sun:#5C4B23}
/* 立體按鈕：底下有一條厚邊，按下去會沉下去 */
.btn,.opt,.bigcard,.hero,.chip,.seg button.on,.ib,.play,.step,.li[data-a]{transition:transform .08s ease,box-shadow .08s ease,background .2s,border-color .2s}
.btn{box-shadow:0 var(--press) 0 var(--line2);border-color:var(--line2)}
.btn.pri{box-shadow:0 var(--press) 0 var(--blue-deep)}
.btn.ghost{box-shadow:none}
.btn:active:not(:disabled),.btn.pressed{transform:translateY(var(--press));box-shadow:0 0 0 transparent}
.opt{box-shadow:0 3px 0 var(--line2)}
.opt:active:not(:disabled){transform:translateY(3px);box-shadow:none}
.opt.ok{box-shadow:0 3px 0 var(--ok);animation:pop .38s cubic-bezier(.3,1.6,.5,1)}
.opt.bad{box-shadow:0 3px 0 var(--bad);animation:shake .38s ease}
.bigcard{box-shadow:0 4px 0 var(--line)}
.bigcard:active{transform:translateY(4px);box-shadow:none}
.bigcard.pri{box-shadow:0 5px 0 var(--blue-deep)}
.bigcard .ico{transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.bigcard:active .ico{transform:rotate(-8deg) scale(1.08)}
.hero{box-shadow:0 6px 0 var(--blue-deep),0 14px 28px rgba(44,69,102,.22);animation:breathe 3.2s ease-in-out infinite}
.hero:active{transform:translateY(6px);box-shadow:0 0 0 var(--blue-deep),0 6px 14px rgba(44,69,102,.18);animation:none}
.hero.done{animation:none;box-shadow:0 4px 0 var(--ok)}
.ib{box-shadow:0 3px 0 var(--line)}
.ib:active{transform:translateY(3px);box-shadow:none}
.ib.star.on{color:#E0A100;background:#FFF6D8;border-color:#F1D27A}
.ib.star.on svg{animation:starpop .45s cubic-bezier(.3,1.8,.5,1)}
.play{box-shadow:0 3px 0 var(--line2)}
.play:active{transform:translateY(3px);box-shadow:none}
.play.busy{animation:ring 1s ease-out infinite}
.chip:active{transform:scale(.95)}
.li[data-a]:active,.step:active{background:var(--blue-soft)}
.wordcard{box-shadow:0 6px 0 var(--line),0 16px 30px rgba(0,0,0,.04)}
.endcard .mark{animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
.fb{animation:rise .28s ease}
.bar i,.timer i{background:linear-gradient(90deg,var(--blue),#7FA3CF)}
.bar{height:6px;border-radius:3px}
.bar i{border-radius:3px}
.hero .ring i{transition:background .3s}
.hero .ring i.on{animation:pop .4s ease}
.step .ck{transition:all .3s}
.step.done .ck{animation:pop .35s ease}
/* 換頁 */
.enter-fwd{animation:inRight .26s cubic-bezier(.2,.8,.3,1)}
.enter-back{animation:inLeft .26s cubic-bezier(.2,.8,.3,1)}
.enter-tab{animation:rise .22s ease}
.enter-next{animation:inRight .3s cubic-bezier(.2,.8,.3,1)}
.nav button svg{transition:transform .2s cubic-bezier(.3,1.6,.5,1)}
.nav button.on svg{transform:translateY(-2px) scale(1.12)}
@keyframes inRight{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes inLeft{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.85)}60%{transform:scale(1.06)}100%{transform:scale(1)}}
@keyframes starpop{0%{transform:scale(.4) rotate(-30deg)}100%{transform:scale(1) rotate(0)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(2px)}}
@keyframes breathe{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(59,90,130,.35)}100%{box-shadow:0 0 0 14px rgba(59,90,130,0)}}
/* 小角色：飯糰「明明」 */
.mascot{display:block;margin:0 auto}
.mascot .blink{animation:blink 4.5s infinite;transform-origin:center;transform-box:fill-box}
.mascot.bob{animation:bob 2.6s ease-in-out infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-4px) rotate(-2deg)}}
.hello-row{display:flex;align-items:center;gap:12px;margin-top:4px}
.bubble{position:relative;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px 14px;font-family:var(--my);line-height:1.7;box-shadow:0 3px 0 var(--line)}
.bubble::before{content:"";position:absolute;left:-7px;top:22px;width:12px;height:12px;background:var(--card);border-left:1px solid var(--line);border-bottom:1px solid var(--line);transform:rotate(45deg)}
/* 彩紙 */
.confetti{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.confetti i{position:absolute;top:-12px;width:9px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translate3d(var(--dx),105vh,0) rotate(var(--r));opacity:.9}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== v4：學習路徑 — 紙上的小旅程，清楚知道下一步 ===== */
/* 沿用按鈕與積木的厚底按鈕、柔和線條與飯糰角色；地圖以閱讀為先。 */
:root{--map-rail:color-mix(in srgb,var(--line2) 78%,var(--paper));--map-node-size:64px}
button,a,summary{touch-action:manipulation}
button:focus-visible,a:focus-visible,summary:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--blue2);outline-offset:4px}
button:disabled{cursor:default}
.ui,.ui-sub,.bigcard .t,.bigcard .d,.map-copy{overflow-wrap:anywhere}
.gear{box-shadow:0 3px 0 var(--line);transition:transform .1s,box-shadow .1s}
.gear:active{transform:translateY(3px);box-shadow:none}
.nav button{color:var(--ink2)}
.nav button.on{color:var(--blue);font-weight:600}
.nav button.on::before{height:3px;border-radius:0 0 4px 4px}
.hello-row{gap:12px;margin:6px 0 18px;align-items:center}
.hello-row .mascot{flex:none;animation:none}
.hello-row .bubble{font-size:1rem;line-height:1.9;padding:12px 16px;box-shadow:none;background:var(--paper)}
.journey-header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin:24px 2px 14px}
.journey-header h1,.journey-header h2{font-family:var(--my);font-size:1.22rem;font-weight:600;line-height:1.85;letter-spacing:0}
.journey-header small{display:block;color:var(--ink2);font-size:.86rem;line-height:1.8;margin-top:3px}
.journey-header .mascot{margin:0;flex:none}
.journey-summary{position:relative;display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:4px 12px;padding:0 2px;background:transparent;margin:0;color:var(--ink2);font-size:.92rem;line-height:1.9}
.journey-summary .row{align-items:center;gap:12px}
.journey-summary .ui{font-size:1rem;font-weight:600}
.journey-summary .ui-sub{font-size:.86rem;line-height:1.8;margin-top:4px}
.journey-summary .pill{padding:5px 10px;font-size:.79rem;flex:none;line-height:1.5}
.journey-progress{height:9px;border-radius:999px;overflow:hidden;background:var(--line);margin:10px 0 22px;box-shadow:inset 0 1px 1px rgba(0,0,0,.04)}
.journey-progress i{display:block;height:100%;background:var(--blue);border-radius:999px;transition:width .35s ease;min-width:0}
.journey-summary.complete .journey-progress i{background:var(--ok)}
.map-unit-header{display:block;margin:17px 2px 5px;font-family:var(--my);font-size:.91rem;line-height:1.9;color:var(--ink2)}
.map-unit-header p{margin:8px 0 15px}
.map-unit-header .journey-progress{margin-bottom:16px}
.journey-cta{flex-direction:row;gap:10px;min-height:60px;margin:0 0 17px;padding:14px 18px;line-height:1.9}
.journey-cta svg{flex:none}
.journey-finished{padding:13px 16px;margin:0 0 14px;background:var(--ok-soft);color:var(--ok);border:1px solid var(--ok);border-radius:16px;font-size:1rem;line-height:1.9}
.resume-card{display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px;margin:0 0 18px;text-align:left;background:var(--blue-soft);border:1px solid var(--blue2);border-radius:18px;color:var(--blue-ink);font-size:.96rem;line-height:1.9}
.resume-card .ico{display:flex;align-items:center;justify-content:center;width:42px;height:42px;flex:none;border-radius:13px;background:var(--paper)}
.journey-link{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;padding:19px 4px;margin-top:20px;border-top:1px solid var(--line);font-size:.95rem;line-height:1.9;text-align:left;color:var(--blue-ink)}
.journey-link>span:first-child{display:flex;align-items:center;gap:10px;min-width:0}
.journey-link svg{flex:none}
.map-arrow{color:var(--ink2);font-family:var(--zh);font-size:1.35rem;flex:none;line-height:1;margin-left:auto;align-self:center}
.map-footnote{font-size:.83rem;color:var(--ink2);line-height:1.9;margin:16px 3px 0}
.learning-map{list-style:none;padding:8px 0 0;margin:0;position:relative}
.map-stop{position:relative;min-height:122px;padding:10px 0 31px;--offset:0px;isolation:isolate}
.map-stop:last-child{padding-bottom:6px;min-height:96px}
.map-stop::before{content:"";position:absolute;left:calc(var(--map-node-size) / 2 + var(--offset));top:70px;bottom:-11px;width:3px;background:var(--map-rail);border-radius:999px;z-index:-1}
.map-stop:last-child::before{display:none}
.map-stop.done::before{background:var(--ok)}
.map-stop:has(.map-connector)::before{display:none}
.map-connector{position:absolute;left:0;top:70px;width:100px;height:calc(100% - 53px);z-index:-1;overflow:visible;pointer-events:none}
.map-connector path{fill:none;stroke:var(--map-rail);stroke-width:3;vector-effect:non-scaling-stroke;stroke-linecap:round}
.map-stop.done .map-connector path{stroke:var(--ok)}
.map-node{display:flex;align-items:flex-start;gap:16px;text-align:left;width:calc(100% - var(--offset));margin-left:var(--offset);padding:0 8px 0 0;border-radius:22px;position:relative;min-height:72px;line-height:1.75;transition:background .2s ease}
.map-disc{display:flex;align-items:center;justify-content:center;width:var(--map-node-size);height:var(--map-node-size);margin-top:6px;flex:none;border-radius:50%;border:2px solid var(--line2);background:var(--card);color:var(--ink2);box-shadow:0 5px 0 var(--line2);font-family:var(--my);font-size:1.15rem;font-weight:600;transition:transform .12s ease,box-shadow .12s ease,border-color .2s}
.map-disc svg{width:29px;height:29px;fill:none;stroke:currentColor;stroke-width:1.8}
.map-copy{flex:1;min-width:0;display:block;padding:7px 0}
.map-title{display:block;font-family:var(--my);font-size:1.07rem;font-weight:600;line-height:1.85;color:var(--ink)}
.map-sub{display:block;font-family:var(--my);font-size:.85rem;line-height:1.85;color:var(--ink2);margin-top:3px}
.map-badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;background:var(--paper);border:1px solid var(--line);color:var(--ink2);font-family:var(--my);font-size:.77rem;line-height:1.7;max-width:100%;margin-top:6px}
.map-badge svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;flex:none}
.map-stop.done .map-disc{background:var(--ok-soft);border-color:var(--ok);color:var(--ok);box-shadow:0 5px 0 color-mix(in srgb,var(--ok) 65%,var(--line2))}
.map-stop.done .map-badge{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.map-stop.current .map-disc{background:var(--blue);border-color:var(--blue);color:var(--paper);box-shadow:0 5px 0 var(--blue-deep),0 0 0 7px var(--blue-soft)}
.map-stop.current .map-title{color:var(--blue-ink)}
.map-stop.current .map-badge,.map-current-label{background:var(--blue-soft);color:var(--blue-ink);border-color:transparent;font-weight:600}
.map-current-label{display:inline-block;font-family:var(--my);font-size:.8rem;padding:3px 10px;border-radius:999px;line-height:1.8;margin-bottom:6px}
.map-stop.upcoming .map-disc{background:var(--paper);border-style:dashed;box-shadow:0 4px 0 var(--line)}
.map-stop.skipped .map-disc{background:var(--kraft-soft);border-color:var(--kraft);box-shadow:0 4px 0 var(--kraft);color:var(--ink2)}
.map-stop.skipped .map-badge{background:var(--kraft-soft);border-color:transparent;color:var(--ink2)}
.map-stop.available .map-disc{background:var(--paper);border-style:dashed;box-shadow:0 4px 0 var(--line)}
.map-stop.skip .map-disc{background:var(--kraft-soft);border-color:var(--kraft);color:var(--ink2)}
.map-node:active:not(:disabled) .map-disc{transform:translateY(5px);box-shadow:none}
.map-node:disabled .map-disc{box-shadow:0 3px 0 var(--line);border-style:dashed}
.map-node:disabled{opacity:1}
.map-node:disabled .map-title,.map-node:disabled .map-sub{color:var(--ink2)}
@media(hover:hover){.map-node:hover:not(:disabled){background:var(--paper)}.map-node:hover:not(:disabled) .map-disc{border-color:var(--blue2)}}
/* 地圖頁的主按鈕保留厚底，取消無限浮動，讓單元與進度成為焦點。 */
.journey-header~.hero,.journey-summary~.hero,.learning-map~.hero{animation:none;padding:20px;border-radius:22px;margin-top:18px;box-shadow:0 5px 0 var(--blue-deep)}
.journey-header~.hero .big,.journey-summary~.hero .big,.learning-map~.hero .big{font-size:1.45rem}
.journey-header~.hero .sub,.journey-summary~.hero .sub,.learning-map~.hero .sub{font-size:.91rem;line-height:1.9;margin-top:3px}
.journey-summary~.hero.done,.learning-map~.hero.done{box-shadow:0 4px 0 var(--ok)}
/* 練習區也保持一致的紙感，不壓縮緬文的上下筆畫。 */
.bub .who{font-size:.79rem;color:var(--ink2);letter-spacing:.02em;margin-bottom:6px}
.bub{padding:15px 16px;border-radius:20px}
.bub .my{line-height:1.95}
.bub.playing{box-shadow:0 0 0 3px var(--blue-soft);border-color:var(--blue2)}
.board{padding:12px 2px 13px}
.board .got span{padding:3px 9px;border-radius:9px;font-size:.78rem}
.scene .mk{border-radius:16px;background:var(--blue-soft);border-color:transparent}
.intro .ico{box-shadow:0 5px 0 var(--line);border:1px solid var(--line)}
.more{margin-top:22px;border-top:1px solid var(--line);padding-top:4px}
.more summary{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:.91rem;line-height:1.8;min-height:56px;padding:14px 4px}
.more summary::after{content:"+";font-family:var(--zh);font-size:1.25rem;color:var(--ink2);flex:none}
.more[open]>summary::after{content:"−"}
.unit-list{display:grid;gap:13px;margin:12px 0 22px}
.unit-card{display:flex;align-items:center;gap:15px;text-align:left;width:100%;padding:18px 16px;background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:0 4px 0 var(--line);line-height:1.8;transition:transform .12s ease,box-shadow .12s ease,border-color .2s}
.unit-card:active:not(:disabled){transform:translateY(4px);box-shadow:none}
.unit-card .unit-number{display:flex;align-items:center;justify-content:center;flex:none;width:48px;height:48px;border-radius:16px;background:var(--blue-soft);color:var(--blue-ink);font-family:var(--my);font-size:1.04rem;font-weight:600}
.unit-card .grow{min-width:0}
.unit-card .map-title,.unit-card .t{display:block;font-family:var(--my);font-size:1.04rem;line-height:1.85;font-weight:600;overflow-wrap:anywhere}
.unit-card .map-sub,.unit-card .d{display:block;font-family:var(--my);font-size:.83rem;color:var(--ink2);line-height:1.85;margin-top:3px;overflow-wrap:anywhere}
.unit-card.current{border-color:var(--blue2);background:var(--paper)}
.unit-card.done .unit-number{background:var(--ok-soft);color:var(--ok)}
.unit-card .arr{flex:none;color:var(--ink2);font-family:var(--zh);font-size:1.2rem}
.unit-progress{display:block;height:5px;margin-top:10px;background:var(--line);border-radius:999px;overflow:hidden}
.unit-progress i{display:block;height:100%;background:var(--blue);border-radius:inherit;transition:width .3s ease}
.unit-card.done .unit-progress i{background:var(--ok)}
@media(max-width:360px){
  #app{padding-left:13px;padding-right:13px}
  :root{--map-node-size:58px}
  .map-stop{--offset:0px!important}
  .map-connector{display:none}
  .map-stop:has(.map-connector)::before{display:block}
  .map-stop:last-child:has(.map-connector)::before{display:none}
  .map-node{gap:12px}
  .map-title{font-size:1.01rem}
  .map-sub{font-size:.82rem}
  .map-stop::before{top:66px}
  .map-connector{top:66px;height:calc(100% - 56px)}
  .journey-summary{font-size:.86rem}
  .journey-summary .row{flex-wrap:wrap;gap:6px}
  .journey-header h1,.journey-header h2{font-size:1.12rem}
  .bigcard{gap:12px;padding:18px 14px}
  .bigcard .ico{width:50px;height:50px}
  .nav .lbl{font-size:.77rem}
}
/* 注音保留至少 10 px，教學本文預留字距與上方空間，避免音標互相疊住。 */
.zt{font-size:max(.36em,10px);letter-spacing:-.1em}
.big .zt{font-size:max(.26em,10px)}
body:not(.hide-zy) .bub,body:not(.hide-zy) .qbox .q,body:not(.hide-zy) .opt,body:not(.hide-zy) .ex .zh{line-height:2.2}
body:not(.hide-zy) :is(.bub,.passage,.ex,.qbox,.opt,.wordcard .big) .zc{min-width:max(1em,32px);margin:0 .1em;text-align:center}
.motion-reduce *,.motion-reduce *::before,.motion-reduce *::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
